Object.assign(RECETAS, {"tacos de solomillo de cerdo al wok con verduras":"Ingredientes (4 raciones): 550 g de solomillo de cerdo en tacos, 1 pimiento rojo, 1 pimiento verde, 1 cebolla, 1 calabacín, 200 g de brócoli, 150 g de champiñones, 2 dientes de ajo, 1 trozo de jengibre fresco, AOVE, sal, pimienta.\n\n1. Corta las verduras en tiras o dados pequeños y salpimienta el solomillo.\n2. Calienta el wok con AOVE a fuego fuerte y saltea el ajo y el jengibre picados 30 s.\n3. Añade el solomillo y saltea 3–4 min hasta que se dore; resérvalo.\n4. Saltea las verduras 4–5 min hasta que queden al dente y devuelve la carne (o en Thermomix a temperatura Varoma).\n5. Sirve 200 g a Alex y 150 g a Jeza; el resto para Noah e Iria.","bacalao a la plancha":"Ingredientes (4 raciones): 550 g de lomos de bacalao desalado, AOVE, sal, pimienta, 1 limón, perejil fresco picado.\n\n1. Seca bien los lomos de bacalao con papel de cocina y salpimienta.\n2. Calienta una plancha con AOVE a fuego medio-alto.\n3. Cocina el bacalao 3–4 min por el lado de la piel y 2 min por el otro, hasta que esté opaco.\n4. Riega con un poco de limón y el perejil picado.\n5. Sirve 200 g a Alex y 150 g a Jeza; el resto para Noah e Iria. Acompaña con una ensalada grande aparte.","judías verdes salteadas con almendras, huevo duro y queso de cabra":"Ingredientes (4 raciones): 800 g de judías verdes, 80 g de almendras y nueces variadas, 5 huevos, 100 g de queso de cabra, 2 dientes de ajo, AOVE, sal, pimienta.\n\n1. Cuece las judías verdes al vapor 8–10 min hasta que estén tiernas pero firmes.\n2. Cuece los huevos 10 min, enfríalos en agua fría, pélalos y pícalos.\n3. Saltea las judías con el ajo laminado y AOVE 3–4 min; salpimienta.\n4. Tuesta las almendras y las nueces en una sartén 1–2 min.\n5. Sirve con el huevo picado (2 para Alex, 1 para Jeza y 1 para cada niño), el queso de cabra desmenuzado y los frutos secos por encima (1 puñado para Alex, ½ puñado para Jeza).","judías verdes salteadas con pollo":"Ingredientes (4 raciones): 800 g de judías verdes, 550 g de pechuga de pollo o pavo en tiras, 1 cebolla, 2 dientes de ajo, AOVE, sal, pimienta, 1 limón.\n\n1. Cuece las judías verdes al vapor 8–10 min hasta que estén tiernas pero firmes.\n2. Salpimienta el pollo (o pavo) y dóralo en una sartén con AOVE 5–6 min hasta que esté hecho.\n3. Añade la cebolla y el ajo picados y rehoga 3 min.\n4. Incorpora las judías salteadas y saltea todo junto 2 min; un chorro de limón.\n5. Sirve 150–170 g de pollo a Alex y 150 g a Jeza; el resto para Noah e Iria.","paella de pollo y verduras":"Ingredientes (4 raciones): 320 g de arroz redondo, 500 g de pechuga de pollo troceada, 1 pimiento rojo, 1 tomate maduro rallado, 100 g de judía verde plana, 1 cebolla, 2 dientes de ajo, unas hebras de azafrán, 1 cdta de pimentón dulce, 1 l de caldo de pollo, AOVE, sal.\n\n1. Sofríe el pollo salpimentado en la paellera con AOVE hasta dorarlo; resérvalo.\n2. En el mismo aceite, pocha la cebolla, el ajo y el pimiento; añade el tomate rallado y el pimentón y sofríe 2 min.\n3. Incorpora la judía verde, el arroz y el azafrán; nacara 1 min removiendo.\n4. Vuelve a poner el pollo, añade el caldo caliente y cocina 16–18 min sin remover, los últimos minutos a fuego fuerte.\n5. Deja reposar 5 min y sirve a partes iguales.","paella de marisco":"Ingredientes (4 raciones): 320 g de arroz redondo, 400 g de gambas peladas, 300 g de mejillones limpios, 200 g de calamar troceado, 1 tomate maduro rallado, 1 pimiento rojo, 2 dientes de ajo, unas hebras de azafrán, 1 cdta de pimentón dulce, 1 l de caldo de pescado, AOVE, sal.\n\n1. Sofríe las gambas y el calamar en la paellera con AOVE 2–3 min; resérvalos.\n2. En el mismo aceite, sofríe el ajo y el pimiento; añade el tomate rallado y el pimentón.\n3. Incorpora el arroz y el azafrán y nacara 1 min.\n4. Añade el caldo caliente, reparte los mejillones y cocina 16–18 min sin remover.\n5. En los últimos 3 min, incorpora las gambas y el calamar reservados; deja reposar antes de servir.","arroz seco con conejo y verduras":"Ingredientes (4 raciones): 320 g de arroz redondo, 800 g de conejo troceado, 1 tomate maduro rallado, 100 g de judía verde plana, 1 pimiento rojo, 2 dientes de ajo, 1 ramita de romero, unas hebras de azafrán, 1 l de caldo de pollo o verduras, AOVE, sal.\n\n1. Salpimienta el conejo y dóralo en la paellera con AOVE hasta que esté bien dorado.\n2. Añade el ajo, el pimiento y el tomate rallado; sofríe 3–4 min.\n3. Incorpora el arroz, el azafrán y el romero; nacara 1 min removiendo.\n4. Añade el caldo caliente y la judía verde y cocina 16–18 min sin remover.\n5. Deja reposar 5 min y sirve a partes iguales.","ensalada mixta":"Ingredientes (4 raciones): 200 g de lechugas variadas, 2 tomates, ½ cebolla morada, 1 pepino, 1 zanahoria, 12 aceitunas, AOVE, vinagre, sal.\n\n1. Lava y trocea la lechuga, el tomate, el pepino y la cebolla morada.\n2. Ralla o lamina la zanahoria y añádela junto con las aceitunas.\n3. Mezcla todo en una fuente grande.\n4. Aliña con AOVE, vinagre y sal justo antes de servir.","pollo asado con verduras asadas y patata":"Ingredientes (4 raciones): 1 pollo grande entero (1,8 kg aprox), 4 patatas medianas, 2 cebollas, 2 zanahorias, 1 cabeza de ajos, 1 limón, tomillo fresco, romero fresco, AOVE, sal, pimienta.\n\n1. Precalienta el horno a 200 °C; salpimienta el pollo por dentro y por fuera y rellénalo con el limón partido, el ajo y las hierbas.\n2. Coloca el pollo en una bandeja rodeado de las patatas, cebollas y zanahorias troceadas; riega todo con AOVE.\n3. Asa 70–80 min, regando de vez en cuando con su jugo, hasta que esté dorado y bien hecho.\n4. Deja reposar 10 min antes de trinchar.\n5. Sirve 1 patata mediana (150–180 g) a Alex y 1 patata pequeña (100 g) a Jeza; el resto de patata y verdura para Noah e Iria. Guarda el pollo que sobre para la ensalada de la cena.","merluza al horno sobre cama de verduras":"Ingredientes (4 raciones): 550 g de lomos de merluza, 1 calabacín, 1 pimiento rojo, 1 cebolla, 2 tomates, 2 dientes de ajo, AOVE, sal, pimienta, perejil fresco.\n\n1. Precalienta el horno a 200 °C; corta las verduras en láminas finas y colócalas en una fuente con AOVE, sal y pimienta.\n2. Hornea las verduras 15 min hasta que empiecen a ablandarse.\n3. Coloca los lomos de merluza salpimentados sobre las verduras y riega con AOVE.\n4. Hornea 12–15 min más hasta que el pescado esté opaco y se separe con facilidad.\n5. Espolvorea perejil picado y sirve 150–200 g a Alex y 150 g a Jeza; el resto para Noah e Iria.","dorada al horno sobre cama de verduras":"Ingredientes (4 raciones): 550 g de lomos de dorada, 1 calabacín, 1 berenjena, 1 pimiento rojo, 2 tomates, 2 dientes de ajo, AOVE, sal, pimienta, perejil fresco.\n\n1. Precalienta el horno a 200 °C; corta las verduras en láminas y colócalas en una fuente con AOVE, sal y pimienta.\n2. Hornea las verduras 15 min hasta que empiecen a ablandarse.\n3. Coloca los lomos de dorada salpimentados sobre las verduras con un poco de AOVE.\n4. Hornea 12–14 min hasta que el pescado esté hecho y se separe con facilidad.\n5. Espolvorea perejil y sirve 150–200 g a Alex y 150 g a Jeza; el resto para Noah e Iria.","salmón al horno sobre cama de verduras":"Ingredientes (4 raciones): 550 g de lomos de salmón, 1 calabacín, 1 pimiento rojo, 1 cebolla, 200 g de espárragos verdes, 2 dientes de ajo, AOVE, sal, pimienta, eneldo fresco (opcional).\n\n1. Precalienta el horno a 200 °C; coloca las verduras en láminas en una fuente con AOVE, sal y pimienta.\n2. Hornea las verduras 12 min.\n3. Coloca los lomos de salmón salpimentados encima y riega con AOVE.\n4. Hornea 12–14 min hasta que el salmón esté jugoso por dentro.\n5. Sirve 150–200 g a Alex y 150 g a Jeza con el eneldo picado por encima; el resto para Noah e Iria.","hamburguesas de pavo a la plancha":"Ingredientes (4 raciones): 600 g de pavo picado, 1 huevo, 1 diente de ajo, perejil fresco picado, sal, pimienta, AOVE.\n\n1. Mezcla el pavo picado con el huevo, el ajo y el perejil; salpimienta.\n2. Forma 4 hamburguesas compactas con las manos.\n3. Calienta una plancha con AOVE a fuego medio-alto.\n4. Cocina las hamburguesas 4–5 min por cada lado hasta que estén bien hechas por dentro.\n5. Sirve 150 g a Alex y 150 g a Jeza; el resto para Noah e Iria, con la crema de verduras aparte.","hamburguesas de pollo a la plancha":"Ingredientes (4 raciones): 600 g de pechuga de pollo picada, 1 huevo, 1 diente de ajo, perejil fresco picado, sal, pimienta, AOVE.\n\n1. Mezcla el pollo picado con el huevo, el ajo y el perejil; salpimienta.\n2. Forma 4 hamburguesas compactas.\n3. Calienta una plancha con AOVE a fuego medio-alto.\n4. Cocina las hamburguesas 4–5 min por cada lado hasta que estén doradas y hechas por dentro.\n5. Sirve 150 g a Alex y 150 g a Jeza; el resto para Noah e Iria, con la crema de verduras aparte.","ternera a la plancha con espárragos y champiñones":"Ingredientes (4 raciones): 550 g de ternera magra (babilla o tapa) en filetes, 300 g de espárragos trigueros, 250 g de champiñones, 2 dientes de ajo, AOVE, sal, pimienta.\n\n1. Salpimienta los filetes de ternera y déjalos atemperar 10 min.\n2. Calienta una plancha con AOVE a fuego fuerte y marca la ternera 2–3 min por cada lado.\n3. Resérvala y en la misma plancha saltea los espárragos y los champiñones laminados con el ajo 4–5 min.\n4. Salpimienta las verduras y vuelve a juntar todo.\n5. Sirve 150–200 g de ternera a Alex y 150 g a Jeza; el resto para Noah e Iria.","pollo a la plancha con espárragos y champiñones":"Ingredientes (4 raciones): 550 g de pechuga de pollo en filetes, 300 g de espárragos trigueros, 250 g de champiñones, 2 dientes de ajo, AOVE, sal, pimienta.\n\n1. Salpimienta los filetes de pollo.\n2. Calienta una plancha con AOVE y cocina el pollo 4–5 min por cada lado hasta que esté hecho.\n3. Resérvalo y en la misma plancha saltea los espárragos y los champiñones laminados con el ajo 4–5 min.\n4. Salpimienta las verduras y vuelve a juntar todo.\n5. Sirve 150–200 g de pollo a Alex y 150 g a Jeza; el resto para Noah e Iria.","pisto con huevo":"Ingredientes (4 raciones): 1 calabacín, 1 berenjena, 1 pimiento rojo, 1 pimiento verde, 1 cebolla, 400 g de tomate triturado, 2 dientes de ajo, 5 huevos, AOVE, sal, pimienta, orégano.\n\n1. Corta todas las verduras en dados pequeños.\n2. Rehoga la cebolla y el ajo en AOVE, añade el pimiento y la berenjena y cocina 8 min.\n3. Incorpora el calabacín y el tomate triturado; cocina 15–20 min a fuego medio hasta que espese (o en Thermomix).\n4. Salpimienta y añade el orégano.\n5. Cuaja los huevos en la sartén y sirve 2 huevos a Alex, 1 a Jeza y 1 a cada niño sobre el pisto.","pisto con pollo desmigado":"Ingredientes (4 raciones): 1 calabacín, 1 berenjena, 1 pimiento rojo, 1 pimiento verde, 1 cebolla, 400 g de tomate triturado, 2 dientes de ajo, 550 g de pechuga de pollo (en crudo), AOVE, sal, pimienta, orégano.\n\n1. Cuece la pechuga 12–15 min en agua con sal (o hazla a la plancha) y desmígala con dos tenedores.\n2. Corta todas las verduras en dados pequeños.\n3. Rehoga la cebolla y el ajo en AOVE, añade el pimiento y la berenjena y cocina 8 min.\n4. Incorpora el calabacín y el tomate triturado; cocina 15–20 min a fuego medio hasta que espese (o en Thermomix).\n5. Añade el pollo desmigado, salpimienta y añade el orégano; cocina 5 min más.\n6. Sirve 150 g de pollo a Alex y a Jeza; el resto, para Noah e Iria.","fajitas de pavo con pimientos y guacamole":"Ingredientes (4 raciones): 550 g de pavo en tiras, 1 pimiento rojo, 1 pimiento verde, 1 cebolla, 1 diente de ajo, comino, pimentón, 12 hojas de lechuga para servir, 2 aguacates, 1 tomate, ½ cebolla morada, 1 lima, cilantro fresco, sal, AOVE, tortillas integrales (opcional, para Noah e Iria).\n\n1. Saltea el pavo salpimentado con comino y pimentón en AOVE 5–6 min; resérvalo.\n2. En la misma sartén, saltea los pimientos y la cebolla en tiras 5 min.\n3. Para el guacamole, machaca el aguacate con el tomate, la cebolla morada, la lima, sal y cilantro.\n4. Junta el pavo con los pimientos salteados.\n5. Sirve en hojas de lechuga con el guacamole; las tortillas integrales son opcionales, solo para Noah e Iria.","ensalada césar ligera con pollo":"Ingredientes (4 raciones): 300 g de lechugas variadas (romana y similares), 400 g de pollo asado (el que sobró de la comida), 40 g de parmesano en lascas, 2 cdas de AOVE, 1 limón, sal, pimienta.\n\n1. Lava y trocea la lechuga y repártela en una fuente.\n2. Añade el pollo asado troceado por encima (puede ser el que sobró de la comida).\n3. Aliña con el AOVE, el zumo de limón, sal y pimienta; remueve bien.\n4. Añade las lascas de parmesano por encima.\n5. Sirve 150 g de pollo a Alex y 120 g a Jeza; el resto para Noah e Iria.","ensalada de lechuga, aguacate, queso fresco y nueces":"Ingredientes (4 raciones): 1 lechuga, 2 aguacates, 120 g de queso fresco, 40 g de nueces, AOVE, 1 cucharada de vinagre de manzana, sal.\n\n1. Lava y trocea la lechuga; repártela en una fuente o en boles.\n2. Pela y corta el aguacate en láminas; añade el queso fresco en dados y las nueces.\n3. Aliña con el AOVE, el vinagre y la sal justo antes de servir.","ensalada de calabacín, queso de cabra y frutos secos":"Ingredientes (4 raciones): 2 calabacines, 150 g de queso de cabra, 50 g de frutos secos (nueces o almendras), AOVE, 1 cucharadita de miel, 1 cucharada de vinagre de manzana, sal.\n\n1. Corta el calabacín en láminas finas con la mandolina o un pelador (crudo, o pasado 1 min por la plancha).\n2. Reparte las láminas en una fuente y desmiga el queso de cabra por encima.\n3. Añade los frutos secos, un chorrito de miel, el AOVE y el vinagre; sal al gusto.","ensalada de pepino, aguacate, cebolla y huevo duro":"Ingredientes (4 raciones): 2 pepinos, 2 aguacates, ½ cebolla morada, 4 huevos duros, AOVE, 1 cucharada de vinagre de manzana, sal.\n\n1. Pela y trocea el pepino y el aguacate en dados; pica fina la cebolla morada.\n2. Cuece los huevos 10 min, enfríalos en agua fría, pélalos y córtalos en cuartos.\n3. Mezcla todo en una fuente y aliña con el AOVE, el vinagre y la sal.","ensalada de naranja, aguacate y queso fresco":"Ingredientes (4 raciones): 3 naranjas, 2 aguacates, 150 g de queso fresco, AOVE, pimentón dulce, sal.\n\n1. Pela las naranjas a lo vivo y córtalas en rodajas finas (vale también con mandarinas).\n2. Pela y lamina el aguacate; desmiga el queso fresco por encima.\n3. Aliña con el AOVE, una pizca de pimentón dulce y sal.","ensalada de espinacas, calabacín y queso de cabra":"Ingredientes (4 raciones): 150 g de espinacas frescas (crudas), 2 calabacines, 150 g de queso de cabra, AOVE, 1 cucharada de vinagre de manzana, sal.\n\n1. Lava y seca bien las espinacas; repártelas crudas en la fuente o en boles individuales.\n2. Corta el calabacín en láminas muy finas y repártelo por encima.\n3. Desmiga el queso de cabra, aliña con el AOVE y el vinagre, y sal al gusto.","ensalada de trigueros con tomates cherry y jamón":"Ingredientes (4 raciones): 500 g de espárragos trigueros, 300 g de tomates cherry, 100 g de jamón serrano en lonchas, AOVE, sal.\n\n1. Corta la base leñosa de los trigueros y pásalos por la plancha 3–4 min hasta que estén tiernos.\n2. Parte los tomates cherry por la mitad y trocea el jamón en tiras finas.\n3. Mezcla todo en una fuente, aliña con el AOVE y sal al gusto.","ensalada de espinacas, queso de cabra y champiñones salteados":"Ingredientes (4 raciones): 150 g de espinacas frescas (o lechuga), 250 g de champiñones, 150 g de queso de cabra, 1 diente de ajo, AOVE, sal.\n\n1. Limpia y lamina los champiñones; saltéalos en AOVE con el ajo picado 5 min.\n2. Lava y seca las espinacas (o la lechuga) y repártelas en la fuente.\n3. Añade los champiñones templados y desmiga el queso de cabra por encima; sal al gusto.","ensalada de lechuga, aguacate, queso, uvas y nueces":"Ingredientes (4 raciones): 1 lechuga, 2 aguacates, 60 g de queso curado en dados, 120 g de uvas, 30 g de nueces, AOVE, 1 cucharada de vinagre de manzana, sal.\n\n1. Lava y trocea la lechuga; repártela en una fuente.\n2. Añade el aguacate en láminas, el queso en dados y las uvas partidas por la mitad.\n3. Esparce las nueces por encima y aliña con el AOVE, el vinagre y la sal.","ensalada de espinacas con pepino y pollo":"Ingredientes (4 raciones): 500 g de pollo asado en tiras (el que sobró de la comida), 200 g de espinacas frescas, 2 pepinos, 200 g de tomates cherry, ½ cebolla morada, AOVE, 1 cucharada de vinagre de manzana, sal, pimienta.\n\n1. Lava y trocea las espinacas, el pepino, los tomates cherry y la cebolla morada; mézclalo en una fuente grande.\n2. Añade el pollo asado que sobró y aliña con el AOVE, el vinagre, la sal y la pimienta.\n3. Sirve 150 g de pollo a Alex y 120 g a Jeza; el resto, repartido entre Noah e Iria.","ensalada de lentejas rojas con sardinillas":"Ingredientes (4 raciones): 600 g de lentejas rojas cocidas (de bote, escurridas y enjuagadas), 250 g de sardinillas en aceite de oliva (escurridas), 200 g de tomate, ½ cebolla morada, AOVE, 1 cucharada de vinagre de Jerez, sal, pimienta.\n\n1. Escurre y enjuaga las lentejas si son de bote (o cuécelas en casa / en Thermomix) y ponlas en una fuente grande.\n2. Añade el tomate en dados, la cebolla morada picada fina y las sardinillas escurridas.\n3. Aliña con el AOVE, el vinagre de Jerez, la sal y la pimienta; mezcla bien.","salpicón de legumbres con palitos de cangrejo":"Ingredientes (4 raciones): 320 g de garbanzos cocidos, 320 g de alubias blancas cocidas, 220 g de palitos de cangrejo, 1 pimiento rojo, ½ cebolla, AOVE, 1 cucharada de vinagre de vino, sal.\n\n1. Escurre y enjuaga los garbanzos y las alubias (o cuécelos en casa) y ponlos en una fuente grande.\n2. Trocea el pimiento rojo, la cebolla y los palitos de cangrejo en dados pequeños; mézclalo todo.\n3. Aliña con el AOVE, el vinagre de vino y la sal; deja reposar 10 min en la nevera antes de servir.","ensalada primaveral de garbanzos con tomate y ventresca":"Ingredientes (4 raciones): 600 g de garbanzos cocidos (de bote, escurridos y enjuagados), 2 tomates maduros, 200 g de ventresca de atún en aceite de oliva (escurrida), ½ cebolla dulce, AOVE, 1 cucharada de vinagre de Jerez, perejil, sal.\n\n1. Escurre y enjuaga los garbanzos (o cuécelos en casa / en Thermomix) y ponlos en una fuente grande.\n2. Corta los tomates en dados y pica fina la cebolla dulce; añádelos a los garbanzos.\n3. Reparte la ventresca desmenuzada por encima, añade perejil picado y aliña con el AOVE, el vinagre de Jerez y la sal.","ensalada templada de alubias blancas con hortalizas asadas":"Ingredientes (4 raciones): 600 g de alubias blancas cocidas (de bote, escurridas y enjuagadas), 1 calabacín, 1 berenjena, 1 pimiento rojo, ½ cebolla, 40 g de almendras, AOVE, 1 cucharada de vinagre de Jerez, sal, pimienta.\n\n1. Corta el calabacín, la berenjena y el pimiento en trozos y ásalos al horno con AOVE y sal 25–30 min a 200 °C.\n2. Escurre y enjuaga las alubias y ponlas en una fuente; añade las hortalizas asadas templadas y la cebolla picada.\n3. Tuesta las almendras en una sartén sin aceite, espárcelas por encima y aliña con el resto del AOVE, el vinagre de Jerez y la pimienta.","ensalada de garbanzos con atún y vinagreta de mostaza":"Ingredientes (4 raciones): 600 g de garbanzos cocidos (de bote, escurridos y enjuagados), 200 g de atún en aceite de oliva (escurrido), 1 pimiento verde, ½ cebolla, 1 cucharada de mostaza, AOVE, 1 cucharada de vinagre de manzana, sal.\n\n1. Escurre y enjuaga los garbanzos (o cuécelos en casa / en Thermomix) y ponlos en una fuente grande.\n2. Pica el pimiento verde y la cebolla en dados pequeños y añádelos a los garbanzos junto con el atún desmenuzado.\n3. Bate la mostaza con el AOVE y el vinagre para hacer la vinagreta, viértela por encima y mezcla bien.","ensalada de lentejas con pepino, feta, aceitunas negras y tomate":"Ingredientes (4 raciones): 600 g de lentejas cocidas (de bote, escurridas y enjuagadas), 1 lechuga, 2 pepinos, 200 g de queso feta, 100 g de aceitunas negras, 2 tomates, AOVE, orégano, sal.\n\n1. Escurre y enjuaga las lentejas (o cuécelas en casa) y ponlas en una fuente grande con la lechuga troceada.\n2. Añade el pepino y el tomate en dados, el feta en cubos y las aceitunas negras.\n3. Aliña con el AOVE, el orégano y la sal; mezcla justo antes de servir.","ensalada empedrada":"Ingredientes (4 raciones): 600 g de alubias blancas cocidas, 2 tomates, ½ cebolla tierna, 100 g de aceitunas negras, 200 g de atún en aceite de oliva (escurrido), 2 huevos duros, AOVE, 1 cucharada de vinagre de vino, sal.\n\n1. Es la ensalada empedrada catalana tradicional: sirve igual de bien con alubia blanca o con garbanzo, según lo que tengas en casa.\n2. Escurre y enjuaga las alubias y ponlas en una fuente con el tomate y la cebolla tierna en dados.\n3. Añade las aceitunas negras, el atún desmenuzado y el huevo duro en cuartos.\n4. Aliña con el AOVE, el vinagre de vino y la sal; sirve fría o a temperatura ambiente.","huevos poché con tomate en tostada":"Ingredientes (1 ración): 1 huevo, 1 tomate maduro, 1 rebanada de pan integral, AOVE, sal, pimienta.\n\n1. Casca el huevo sobre film transparente, cierra en bolsita apretando bien el aire y anuda.\n2. Hierve la bolsita 3 min en agua a fuego medio; si prefieres, cocina el huevo a la plancha con unas gotas de AOVE en su lugar.\n3. Mientras, tuesta el pan y trocea el tomate con AOVE, sal y pimienta por encima.\n4. Sirve el huevo sobre la tostada con el tomate; esta ración es la de Jeza (1 huevo), Alex dobla a 2 huevos poché.","huevos revueltos sobre tostada con fruta":"Ingredientes (1 ración): 1 huevo, 1 rebanada de pan integral, AOVE, sal, 1 puñado de arándanos o 1 manzana.\n\n1. Bate el huevo con una pizca de sal.\n2. Cocina a fuego suave en la sartén con unas gotas de AOVE, removiendo hasta que cuaje cremoso.\n3. Tuesta el pan y sirve el huevo revuelto encima.\n4. Acompaña con los arándanos o la manzana; esta ración es la de Jeza (1 huevo), Alex dobla a 2 huevos revueltos.","porridge de avena con semillas y fruta":"Ingredientes (1 ración): 60 g de copos de avena, 200 ml de bebida vegetal, 1 cucharada de semillas (chía o lino), 1 fruta rica en hidratos troceada (plátano, uvas o mango), canela (opcional).\n\n1. Calienta la bebida vegetal y añade la avena; cuece 5 min a fuego suave sin dejar de remover hasta que espese.\n2. Retira del fuego y añade las semillas.\n3. Sirve con la fruta troceada por encima y canela al gusto.\n4. Versión overnight: mezcla en un tarro la avena cruda con la bebida vegetal y las semillas, tapa y deja en la nevera toda la noche; añade la fruta al sacarlo.","bowl de arroz inflado con bebida vegetal, fruta y proteína":"Ingredientes (1 ración): 40 g de arroz inflado (o copos de avena), 200 ml de bebida vegetal, 1 cazo de proteína en polvo (o 1 huevo), 1 fruta de temporada troceada.\n\n1. Pon el arroz inflado (o la avena) en un bowl y cubre con la bebida vegetal.\n2. Añade el cazo de proteína en polvo o, si prefieres, un huevo cocido y troceado.\n3. Remata con la fruta troceada por encima y sirve.","fruta con tostada y crema de cacahuete":"Ingredientes (1 ración): 1 plátano (u otra fruta de temporada), 1 tostada pequeña de pan integral, 1 cucharadita de crema de cacahuete.\n\n1. Tuesta ligeramente la tostada pequeña.\n2. Unta la crema de cacahuete por encima.\n3. Sirve con el plátano troceado o en rodajas; como alternativa, cambia la tostada por 2–3 tortitas de arroz con la misma crema.","tortitas de arroz con crema de cacahuete y plátano":"Ingredientes (1 ración): 3 tortitas de arroz, 1 cucharadita de crema de cacahuete, ½ plátano.\n\n1. Unta cada tortita de arroz con la crema de cacahuete.\n2. Corta el plátano en rodajas y repártelas por encima.\n3. Sirve enseguida, recién montadas, para que las tortitas no se ablanden.","yogur proteico con canela y almendras":"Ingredientes (1 ración): 1 yogur proteico (o yogur natural o bebida vegetal), canela, 1 puñado pequeño de almendras.\n\n1. Sirve el yogur proteico (o el yogur natural o la bebida vegetal) en un bowl.\n2. Espolvorea canela al gusto.\n3. Añade el puñado pequeño de almendras por encima."});

function Uid(){return Math.random().toString(36).slice(2,9)}
/* Local YYYY-MM-DD. Never round-trip through toISOString() for date-only
   math: it converts to UTC and shifts the day in UTC+ zones (e.g. Madrid). */
function Ymd(d){
	return d.getFullYear() + "-" +
		String(d.getMonth() + 1).padStart(2, "0") + "-" +
		String(d.getDate()).padStart(2, "0");
}
function TodayISO(){return Ymd(new Date())}

function MondayOf(d){
	const dt = (d instanceof Date)? new Date(d): new Date(d+"T00:00:00");
	const wd = (dt.getDay()+6)%7;            // 0=Mon
	dt.setDate(dt.getDate()-wd);
	return Ymd(dt);
}
function AddDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return Ymd(d)}
function FmtLong(iso){const d=new Date(iso+"T00:00:00");return d.getDate()+" "+["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getMonth()]}

/* ---- load / save (storage is best-effort; never throws) ----
   Save() stamps updatedAt (drives cloud-sync conflict resolution: newest wins).
   SaveQuiet() skips the stamp — for boot/adopt writes that aren't user edits,
   so a mere app-open never outranks real changes made on another device. */
let _stampPaused=false;
function Save(){
	if(!_stampPaused) state.updatedAt=new Date().toISOString();
	try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){/* in-memory only */}
	if(!_stampPaused && typeof UpdateCloudDot==="function"){ UpdateCloudDot(); ScheduleAutoSync(); }
}
function SaveQuiet(){ _stampPaused=true; Save(); _stampPaused=false; }
/* Reference data (catalog) is rebuilt from SEED on every boot and never
   trusted from storage; otherwise catalog updates never reach an already
   installed user. Only user data (weeks/inventory/produce/members/theme)
   is persisted. */
function BuildCatalog(){
	return SEED.catalog.concat(REALFOODING_DISHES).concat(PLAN_DISHES).map(c=>({
		id:Uid(), name:c.name, tipo:c.tipo, course:c.course,
		kcal:c.kcal, prot:c.prot, carb:c.carb, fat:c.fat,
		estilo:c.estilo, batch:!!c.batch
	}));
}
function ValidState(s){
	return !!(s && s.weeks && Array.isArray(s.members) && s.inventory &&
		s.inventory.frigo && s.inventory.conge && Array.isArray(s.produce));
}
/* Heal slots that hold a cell keyed by a non-existent member (the "null" ghost
   written by the pre-1.7.1 picker bug). If the ghost holds a dish and every real
   member is empty, the meal was meant for everyone → recover it before dropping
   the ghost, so no plan is silently lost. Returns how many ghosts were removed. */
function SanitizeSlots(s){
	if(!s||!s.weeks||!Array.isArray(s.members)) return 0;
	const ids=s.members.map(m=>m.id);
	let fixed=0;
	Object.values(s.weeks).forEach(w=>(w&&w.days||[]).forEach(d=>{
		if(!d||!d.slots) return;
		SLOTS.forEach(sl=>{
			const slot=d.slots[sl]; if(!slot) return;
			Object.keys(slot).forEach(k=>{
				if(ids.indexOf(k)>=0) return;                  // real member: keep
				const ghost=slot[k];
				const allEmpty=ids.every(id=>!slot[id]||(!slot[id].dish&&!slot[id].away));
				if(ghost&&(ghost.dish||ghost.away)&&allEmpty){
					ids.forEach(id=>{ slot[id]={dish:ghost.dish||"",invId:null,away:!!ghost.away}; });
				}
				delete slot[k]; fixed++;
			});
		});
	}));
	return fixed;
}
function Load(){
	try{
		let raw = localStorage.getItem(STORE_KEY), legacy=false;
		if(!raw){ raw = localStorage.getItem(LEGACY_STORE_KEY); legacy = !!raw; }
		if(!raw) return false;
		const s = JSON.parse(raw);
		if(!ValidState(s)) return false;   // partial/corrupt -> re-seed
		if(legacy) MigrateV1(s);           // v1 store found: upgrade in place
		SanitizeSlots(s);                  // drop phantom-member cells (pre-1.7.1 bug)
		state = s; return true;
	}catch(e){ return false; }
}
/* v1 -> v2: user-editable recipe book + fixed breakfast/snack routine.
   The v1 key is left untouched as a safety net; Save() writes to the v2 key. */
function MigrateV1(s){
	if(!Array.isArray(s.userDishes)) s.userDishes=[];
	if(!Array.isArray(s.hidden)) s.hidden=[];
	if(!Array.isArray(s.extras)) s.extras=[];
	Object.values(s.weeks||{}).forEach(w=>ApplyTemplate(w));
	return s;
}

/* ---- weekly routine: breakfasts & mid-morning snacks ----
   Editable since 1.2.0 (state.plantilla); defaults derived from SEED.week.
   ApplyTemplate only fills EMPTY cells, so manual edits and deliberate
   deletions always win over the template. */
const TEMPLATE_SLOTS = ["Desayuno","Almuerzo"];
function DefaultPlantilla(){
	const P={desayuno:[],almKids:[],almAdults:[]};
	for(let i=0;i<7;i++){
		const s=(SEED.week[i]&&SEED.week[i].slots)||{};
		P.desayuno.push((s.Desayuno&&(s.Desayuno.nosotros||s.Desayuno.noah))||"");
		P.almKids.push((s.Almuerzo&&s.Almuerzo.noah)||"");
		P.almAdults.push((s.Almuerzo&&s.Almuerzo.nosotros)||"");
	}
	return P;
}
function Plantilla(){
	const p=state&&state.plantilla;
	return (p&&Array.isArray(p.desayuno)&&p.desayuno.length===7)?p:DefaultPlantilla();
}
function TemplateDish(dow,slot,mid){
	const P=Plantilla();
	if(slot==="Desayuno") return P.desayuno[dow]||"";
	if(slot==="Almuerzo") return (mid==="nosotros"?P.almAdults[dow]:P.almKids[dow])||"";
	return "";
}
function ApplyTemplate(week){
	let n=0;
	(week.days||[]).forEach((d,i)=>TEMPLATE_SLOTS.forEach(s=>{
		if(!d.slots[s]) return;
		MEMBER_IDS.forEach(mid=>{
			const c=d.slots[s][mid];
			if(c && !c.dish && !c.away){
				const t=TemplateDish(i,s,mid);
				if(t){ c.dish=t; n++; }
			}
		});
	}));
	return n;
}

function SeedState(){
	const members = [
		{id:"nosotros",name:"Nosotros",color:"var(--m-nosotros)",factor:1},
		{id:"noah",name:"Noah",color:"var(--m-noah)",factor:0.6},
		{id:"iria",name:"Iria",color:"var(--m-iria)",factor:0.6}
	];
	const catalog = BuildCatalog();
	const today = TodayISO();
	const frigo = SEED.frigo.map(i=>({id:Uid(),name:i.name,qty:i.qty,unit:"",added:today,pri:true}));
	const conge = SEED.conge.map(i=>({id:Uid(),name:i.name,qty:i.qty,unit:"",added:today,pri:false}));
	const produce = SEED.produce.map(p=>({id:Uid(),name:p.name,qty:p.qty,unit:p.unit||"ud",done:false}));
	// build week object from seed
	const weeks = {};
	const wk = BuildWeekFromSeed(SEED.week);
	weeks[wk.monday] = wk;
	return EnsurePlanState({
		members, catalog,
		inventory:{frigo,conge},
		produce, extras:[], userDishes:[], hidden:[], graveyard:{},
		weeks, current: wk.monday
	});
}

function BlankCell(){return {dish:"",invId:null,away:false}}

function BuildWeekFromSeed(seedWeek){
	const monday = MondayOf(seedWeek[0].date);
	const days = [];
	for(let i=0;i<7;i++){
		const date = AddDays(monday,i);
		const src = seedWeek.find(d=>d.date===date);
		const slots = {};
		SLOTS.forEach(s=>{
			slots[s] = {};
			MEMBER_IDS.forEach(m=>{
				const dish = src && src.slots[s] ? (src.slots[s][m]||"") : "";
				slots[s][m] = {dish:dish||"",invId:null,away:false};
			});
		});
		days.push({date,slots});
	}
	return {monday,days};
}

function EnsureWeek(monday){
	if(state.weeks[monday]) return state.weeks[monday];
	const days = [];
	for(let i=0;i<7;i++){
		const date = AddDays(monday,i);
		const slots = {};
		SLOTS.forEach(s=>{slots[s]={};state.members.forEach(m=>{slots[s][m.id]=BlankCell()})});
		days.push({date,slots});
	}
	state.weeks[monday] = {monday,days};
	ApplyTemplate(state.weeks[monday]);   // routine desayunos/almuerzos come pre-filled
	return state.weeks[monday];
}

function CurWeek(){return EnsureWeek(state.current)}
function Member(id){return state.members.find(m=>m.id===id)}

/* ============================ HELPERS ============================ */
function InvById(id){
	if(!id) return null;
	return state.inventory.frigo.find(i=>i.id===id)||state.inventory.conge.find(i=>i.id===id)||null;
}
function InvLoc(id){
	if(state.inventory.frigo.some(i=>i.id===id)) return "frigo";
	if(state.inventory.conge.some(i=>i.id===id)) return "conge";
	return null;
}
// distinct planned dishes this week with no inventory backing -> need shopping
function DishesNeedingShopping(){
	const wk = CurWeek();
	const all = new Map();          // key -> display name
	const covered = new Set();      // dish keys backed by any inventory link
	wk.days.forEach(d=>SLOTS.forEach(s=>{
		const slot=d.slots[s];
		state.members.forEach(m=>{
			const c=slot[m.id];
			if(c && c.dish && !c.away){
				const key=c.dish.trim().toLowerCase();
				if(!all.has(key)) all.set(key,c.dish.trim());
				if(c.invId) covered.add(key);
			}
		});
	}));
	const out=[];
	all.forEach((name,key)=>{ if(!covered.has(key)) out.push(name) });
	return out.sort((a,b)=>a.localeCompare(b,"es"));
}
/* How many meal SLOTS are planned, out of how many are visible. The old count
   added one per person per slot including "fuera de casa" and the breakfasts you
   have hidden, so a fresh week already read 42 and a full one 84 — a number
   nobody could interpret. Now: "12 de 14 comidas y cenas". */
function CountPlanned(){
	const wk=CurWeek(); const slots=VisibleSlots();
	let done=0, total=0;
	wk.days.forEach(d=>slots.forEach(s=>{
		const slot=d.slots[s]; if(!slot) return;
		total++;
		if(state.members.some(m=>slot[m.id]&&slot[m.id].dish)) done++;
	}));
	return {done,total};
}
/* wording that matches what's on screen: only the meals you chose to see */
function PlannedLabel(){
	const {done,total}=CountPlanned();
	const que = state.hideDesAlm ? "comidas y cenas" : "comidas";
	if(!total) return "Semana sin planificar";
	if(done===total) return `${total} ${que} · semana completa ✓`;
	return `${done} de ${total} ${que}`;
}

/* ============================ RENDER: NAV ============================ */
function RenderNav(){

	// while 25 ingredients were pending, which taught you to ignore it)
	let need = state.produce.filter(p=>!p.done).length + state.extras.filter(x=>!x.done).length;

/* ============================ RENDER: SEMANA ============================ */
function SlotRows(d,dayIdx,slot){
	const cells = state.members.map(m=>({m,c:d.slots[slot][m.id]}));
	const filled = cells.filter(x=>x.c.dish && !x.c.away);
	const allSame = filled.length===state.members.length &&
		filled.every(x=>x.c.dish.trim().toLowerCase()===filled[0].c.dish.trim().toLowerCase());
	let rows="";
	if(allSame){
		rows = `<div class="row-all" data-action="pick" data-d="${dayIdx}" data-s="${slot}" data-all="1">
			<span class="tag all">Todos</span>
			<span class="dish">${DishHtml(filled[0].c)}</span></div>`;
	}else{
		const parts = cells.map(({m,c})=>{
			let inner;
			if(c.away) inner=`<span class="away">🚶 Fuera de casa</span>`;
			else if(c.dish) inner=`<span class="dish">${DishHtml(c)}</span>`;
			else inner=`<span class="dish empty">+ añadir</span>`;
			return `<div class="row-m" data-action="pick" data-d="${dayIdx}" data-s="${slot}" data-m="${m.id}">
				<span class="tag m" style="background:${m.color}">${m.name}</span>${inner}</div>`;
		});
		rows = parts.join("");
	}
	return rows;
}
/* food-group colours, so a glance at the week shows what you're planning */
/* Six genuinely distinguishable families instead of twelve near-identical hues
   (the old set was five ochres, three greens and two blues — at 8 px "lentejas"
   and "arroz" were the same brown dot). Each family carries a soft background
   and a dark ink, the pattern that already passes contrast elsewhere. */
const TIPO_FAMILIES = {
	verde:  {ink:"#1F6B44", bg:"#DCEFE3", dot:"#2F8B5B"},   // verduras y ensaladas
	ocre:   {ink:"#7A5410", bg:"#F6EBD5", dot:"#C08A2D"},   // legumbres
	trigo:  {ink:"#7B5A21", bg:"#F3EEDC", dot:"#B39247"},   // pasta, arroz y cereales
	azul:   {ink:"#1D5A78", bg:"#DDEBF3", dot:"#3B82A6"},   // pescado y marisco
	rojo:   {ink:"#8A3529", bg:"#F7E1DD", dot:"#B4503F"},   // carne y pollo
	amarillo:{ink:"#7A5E12", bg:"#F7EFD2", dot:"#C9A227"}   // huevos
};
const TIPO_FAMILY = {
	"Verduras":"verde","Ensaladas":"verde","Sopas y cremas":"verde","Bowls":"verde",
	"Legumbres":"ocre",
	"Pasta":"trigo","Arroz y cereales":"trigo",
	"Pescado":"azul","Marisco":"azul",
	"Pollo":"rojo","Carne":"rojo",
	"Huevos":"amarillo"
};
function TipoFamily(t){ return TIPO_FAMILIES[TIPO_FAMILY[t]] || {ink:"#4A5750",bg:"#E7EBE8",dot:"#7C8A83"}; }
function TipoColor(t){ return TipoFamily(t).dot; }        // the dot / legacy callers
function DishTipo(name){
	if(!name) return null;
	const k=name.trim().toLowerCase();
	const c=state.catalog.find(x=>x.name.trim().toLowerCase()===k);
	return (c&&c.tipo)||null;
}
/* distinct food groups of a (possibly composite "1º · 2º") meal */
function MealTipos(dish){
	if(!dish) return [];
	const out=[];
	dish.split(SEP).map(s=>s.trim()).filter(Boolean).forEach(p=>{
		const t=DishTipo(p); if(t && !out.includes(t)) out.push(t);
	});
	return out;
}
function TipoTags(dish){
	return MealTipos(dish).map(t=>{ const f=TipoFamily(t);
		return `<span class="tipo-tag" style="background:${f.bg};color:${f.ink}">${escapeHtml(t)}</span>`;
	}).join("");
}
/* distinct food groups planned for a day's comida + cena (for the day header) */
function DayTipos(day){
	const out=[];
	["Comida","Cena"].forEach(s=>{ if(!day.slots[s]) return;
		state.members.forEach(m=>{ const c=day.slots[s][m.id];
			if(c&&c.dish&&!c.away) MealTipos(c.dish).forEach(t=>{ if(!out.includes(t)) out.push(t); });
		});
	});
	return out;
}
/* Each part of the meal that HAS a recipe becomes its own tap target that opens
   the recipe (marked with 📖 so the tappable bit is visible); the rest of the row
   keeps opening the picker to change the dish. Free-text dishes stay plain text. */
function DishNameHtml(dish){
	return (dish||"").split(SEP).map(p=>{
		const name=p.trim();
		if(!name) return "";
		if(EsLibre(name)) return "🎉 Libre";
		if(!DishRecipe(name)) return escapeHtml(name);
		return `<span class="dish-nm" data-action="dish-open" data-name="${escapeHtml(name)}" role="button" title="Ver la receta">${escapeHtml(name)}<span class="rbk">📖</span></span>`;
	}).filter(Boolean).join(`<span class="dish-sep">${SEP}</span>`);
}
function DishHtml(c){
	let extra="";
	if(c.invId){
		const loc=InvLoc(c.invId);
		extra = loc==="frigo"?`<span class="fridge">🧊 del frigo</span>`:`<span class="frozen">❄️ del congelador</span>`;
	}
	const tags=TipoTags(c.dish);
	return DishNameHtml(c.dish)+extra+(tags?`<span class="tipo-tags">${tags}</span>`:"");
}
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

/* Land on the current week with only TODAY open: that is the daily question
   ("what do we eat today?"), and a wall of 7 open days answers it worse. */
function GoToThisWeek(){
	const monday=MondayOf(TodayISO());
	state.current=monday;
	const wk=EnsureWeek(monday);
	const today=TodayISO();
	wk.days.forEach(d=>{ ui.collapsed[d.date] = d.date!==today; });
	return wk;
}
/* which meals to show in the week: desayuno/almuerzo are optional to plan */
function VisibleSlots(){
	return state.hideDesAlm ? SLOTS.filter(s=>s==="Comida"||s==="Cena") : SLOTS.slice();
}
function RenderSemana(){
	const wk=CurWeek(); const today=TodayISO();
	// materialise defaults first so the expand-all toggle sees real values
	wk.days.forEach(d=>{ ui.collapsed[d.date]=ui.collapsed[d.date] ?? (d.date<today); });
	const anyOpen = wk.days.some(d=>!ui.collapsed[d.date]);
	const slots = VisibleSlots();
	let html=`<div class="exp-row">
		<button class="exp-all ${state.hideDesAlm?'':'on'}" data-action="toggle-desalm">${state.hideDesAlm?"🍳 Solo comida y cena":"🍳 Desayuno y almuerzo"}</button>
		<button class="exp-all" data-action="menu-rutina" title="Desayunos y almuerzos que se repiten cada semana">🥣 Rutina</button>
		<button class="exp-all" data-action="toggle-all-days">${anyOpen?"▴ Contraer":"▾ Expandir"}</button>
	</div>`;
	wk.days.forEach((d,i)=>{
		const isToday = d.date===today;
		const collapsed = ui.collapsed[d.date];
		const dowName = DOW[i];
		const dots = state.members.map(m=>`<span class="dot" style="background:${m.color}"></span>`).join("");
		const dayTipos = DayTipos(d);
		// initial inside the dot: colour alone can't carry the information
		const tipoMini = dayTipos.slice(0,3).map(t=>
			`<span class="tdot" style="background:${TipoColor(t)}" title="${escapeHtml(t)}">${escapeHtml(t.charAt(0))}</span>`).join("")
			+ (dayTipos.length>3?`<span class="tdot more" title="${escapeHtml(dayTipos.slice(3).join(", "))}">+${dayTipos.length-3}</span>`:"");
		let body="";
		if(!collapsed){
			body = `<div class="slots">`+slots.map(s=>{
				return `<div class="slot">
					<div class="slot-l">${s}
						<button class="sl-act" data-action="slot-all" data-d="${i}" data-s="${s}">para todos ›</button>
					</div>
					<div class="rows">${SlotRows(d,i,s)}</div>
					${(s==="Comida"||s==="Cena")?PlanMealHtml(i,s,d):""}
				</div>`;
			}).join("")+`</div>`;
		}
		html += `<div class="day">
			<div class="day-head ${collapsed?'collapsed':''}" data-action="toggle-day" data-date="${d.date}">
				<div>
					<div class="day-dow">${dowName}</div>
					<div class="day-date">${FmtLong(d.date)}</div>
					${PlanDayBadges(i)}
				</div>
				${isToday?'<span class="day-today">hoy</span>':''}
				<div class="day-fill"></div>
				${collapsed?`<div class="day-mini">${tipoMini||dots}</div>`:''}
				${!collapsed&&PlanActivo()?`<span class="day-copy day-plan" data-action="vive-dia" data-d="${i}" title="Plan del día: raciones, desayuno y merienda">📋</span>`:''}
				${!collapsed?`<span class="day-copy" data-action="copy-day" data-d="${i}" title="Copiar esta comida y cena a otro día">⧉</span>`:''}
				<span class="chev ${collapsed?'':'up'}">▾</span>
			</div>
			${body}
		</div>`;
	});
	return html;
}

/* ============================ RENDER: DESPENSA ============================ */
/* days until expiry (date-only ISO strings; negative = expired) */
function DaysLeft(cad){
	if(!cad) return null;
	return Math.round((Date.parse(cad)-Date.parse(TodayISO()))/86400000);
}
/* urgent = starred by hand OR expiring within 2 days */
function InvUrgent(it){
	if(!it) return false;
	if(it.pri) return true;
	const dl=DaysLeft(it.cad);
	return dl!==null && dl<=2;
}
function CadBadge(it){
	const dl=DaysLeft(it.cad);
	if(dl===null) return it.pri?'<span class="pri">usar pronto</span>':'';
	if(dl<0) return '<span class="pri cad-off">caducado</span>';
	if(dl<=2) return `<span class="pri">usar pronto · ${dl===0?"caduca hoy":dl===1?"caduca mañana":"caduca en 2 días"}</span>`;
	return (it.pri?'<span class="pri">usar pronto</span>':'')+`<span class="used"> · cad. ${FmtLong(it.cad)}</span>`;
}
function InvSection(loc,title,sub){
	const list = state.inventory[loc].slice().sort((a,b)=>{
		if(!!InvUrgent(b)-!!InvUrgent(a)) return !!InvUrgent(b)-!!InvUrgent(a);
		return (a.added||"").localeCompare(b.added||"");
	});
	const usedSet = UsedInvIds();
	const items = list.length? list.map(it=>{
		const used = usedSet.has(it.id);
		return `<div class="it">
			<button class="star ${it.pri?'on':''}" data-action="inv-pri" data-id="${it.id}" data-loc="${loc}" title="Usar pronto">${it.pri?'★':'☆'}</button>
			<div class="nm" data-action="inv-edit" data-id="${it.id}" data-loc="${loc}" role="button" style="cursor:pointer">${escapeHtml(it.name)} ${it.unit?`<small>${escapeHtml(it.unit)}</small>`:''}
				${CadBadge(it)}
				${used?'<span class="used"> · en el menú</span>':''}</div>
			<div class="stepper">
				<button data-action="inv-q" data-id="${it.id}" data-loc="${loc}" data-dir="-1">−</button>
				<span class="q">${NiceQty(it.qty)}</span>
				<button data-action="inv-q" data-id="${it.id}" data-loc="${loc}" data-dir="1">+</button>
			</div>
			<button class="del" data-action="inv-del" data-id="${it.id}" data-loc="${loc}">✕</button>
		</div>`;
	}).join("") : `<div class="empty-msg">Vacío. Añade lo que tengas.</div>`;
	return `<div class="sec">
		<div class="sec-h"><h3>${title}</h3><span class="sub">${sub}</span>
			<button class="add-x" data-action="inv-add" data-loc="${loc}">+ añadir</button></div>
		${items}
	</div>`;
}
function UsedInvIds(){
	const wk=CurWeek(); const s=new Set();
	wk.days.forEach(d=>SLOTS.forEach(sl=>state.members.forEach(m=>{
		const c=d.slots[sl][m.id]; if(c&&c.invId) s.add(c.invId);
	})));
	return s;
}
function RenderDespensa(){
	return `<div class="view-title">Despensa</div>
		<p class="hint">Marca con ★ lo que toca gastar antes, o toca un alimento para ponerle caducidad: a 2 días de caducar se marca solo como «usar pronto». Lo urgente aparece primero al planear y en “Sorpréndeme”.</p>
		${InvSection("frigo","🧊 En el frigo","consumir antes")}
		${InvSection("conge","❄️ En el congelador","stock")}`;
}

/* ============================ RENDER: COMPRA ============================ */
function RenderCompra(){
	ResetWeeklyTicks();
	const dishes = PlannedCookDishes();
	const produce = PendingFirst(state.produce);
	const prodItems = produce.length? produce.map(p=>`
		<div class="it ${p.done?'done':''}">
			<button class="check ${p.done?'on':''}" data-action="prod-done" data-id="${p.id}">${p.done?'✓':''}</button>
			<div class="nm">${escapeHtml(p.name)} ${p.qty?`<small>· ${NiceQty(p.qty)} ${escapeHtml(p.unit||'')}</small>`:''}</div>
			<button class="del" data-action="prod-del" data-id="${p.id}">✕</button>
		</div>`).join("") : `<div class="empty-msg">Lista vacía.</div>`;

	// tappable ingredient: toggles "bought" (strike-through + check)
	const ingRow = x => { const have=PantryMatch(x); const bought=IsBought(x); const k=escapeHtml(ShopKey(x));
		return `<button class="ing-item${have?' have':''}${bought?' bought':''}" data-action="shop-check" data-k="${k}">
			<span class="ing-box">${bought?'✓':''}</span>
			<span class="ing-tx">${escapeHtml(x)}${have?`<span class="have-tag">ya tienes: ${escapeHtml(have.name)}</span>`:''}</span>
		</button>`; };

	// view toggle: "dish" = ingredients grouped per dish; "merged" = one flat list
	const shopView = state.shopView==="merged" ? "merged" : "dish";
	const merged = MergedIngredients();
	const remaining = merged.filter(x=>!IsBought(x)).length;
	const boughtCount = merged.length - remaining;
	let needBody;
	if(!dishes.length){
		needBody = `<div class="empty-msg">Aún no has planificado comidas ni cenas esta semana.</div>`;
	}else if(shopView==="merged"){
		const noRec = dishes.filter(n=>!IngredientesDe(n));
		// grouped by supermarket aisle so the list follows the trolley
		let last=-1, rows="";
		merged.filter(x=>!IsBought(x)).forEach(x=>{
			const a=AisleOf(x);
			if(a!==last){ rows+=`<div class="aisle">${AisleName(a)}</div>`; last=a; }
			rows+=ingRow(x);
		});
		// everything already in the trolley drops below the aisles, out of the way
		const yaCogido=merged.filter(IsBought);
		const rowsDone = yaCogido.length
			? `<div class="aisle done">Ya en el carro · ${yaCogido.length}</div>`+yaCogido.map(ingRow).join("")
			: "";
		needBody = `<div class="ing-block merged">
			${rows}
			${noRec.map(n=>`<div class="ing-item none">• ${escapeHtml(n)} (plato sin receta)</div>`).join("")}
			${rowsDone}
		</div>`;
	}else{
		ui.shopClosed = ui.shopClosed || {};
		needBody = dishes.map(n=>{
			const esc=EscalaTxt(n);
			const ing=IngredientesCompra(n);
			const closed=!!ui.shopClosed[n];
			const body = closed ? "" : (ing
				? `<div class="ing-block">${ing.filter(x=>!IsBought(x)).concat(ing.filter(IsBought)).map(ingRow).join("")}</div>`
				: `<div class="ing-block"><div class="ing-item none">Sin receta guardada. Escríbela tocando el nombre del plato en la Semana, o añade lo que falte abajo en “Otros”.</div></div>`);
			const total=ing?ing.length:0, got=ing?ing.filter(IsBought).length:0;
			const badge = ing ? (got?`${got}/${total} ✓`:`${total}`) : 'sin receta';
			// the scale factor is shown, never silent: you can audit the quantities
			const raciones = ing&&esc ? `<span class="need-x">para ${ServingsNeeded(n)} · ${escapeHtml(esc)}</span>` : "";
			return `<div class="need-dish">
				<button class="need-h" data-action="shop-toggle" data-name="${escapeHtml(n)}">
					<span class="chev ${closed?'':'up'}">▾</span>
					<span class="need-nm">${escapeHtml(n)}${raciones}</span>
					${DishRecipe(n.split(SEP)[0].trim())?`<span class="pick-book" data-action="dish-open" data-name="${escapeHtml(n.split(SEP)[0].trim())}" title="Ver la receta">📖</span>`:''}
					<span class="need-c ${ing?'':'none'}${ing&&got===total?' done':''}">${badge}</span>
				</button>
				${body}
			</div>`;
		}).join("");
		// plan: whoever trained adds their carb to a carb-free base recipe
		const pc=PlanHidratosCompra();
		if(pc.length){
			const got=pc.filter(IsBought).length;
			needBody += `<div class="need-dish">
				<div class="need-h static"><span class="need-nm">🏋️ Hidratos post-entreno<span class="need-x">plan · quien entrenó</span></span>
					<span class="need-c${got===pc.length?' done':''}">${got?`${got}/${pc.length} ✓`:pc.length}</span></div>
				<div class="ing-block">${pc.filter(x=>!IsBought(x)).concat(pc.filter(IsBought)).map(ingRow).join("")}</div>
			</div>`;
		}
	}
	const subText = merged.length ? (remaining>0 ? `${remaining} por comprar` : "¡todo comprado! ✓") : "";
	const yaEnCasa = BoughtForPantry().length;
	const anyOpen = dishes.some(n=>!(ui.shopClosed||{})[n]);
	const shopViewBar = dishes.length? `<div class="shop-view">
		<div class="sv-group">
			<button class="sv ${shopView==='dish'?'on':''}" data-action="shop-view" data-v="dish">Por plato</button>
			<button class="sv ${shopView==='merged'?'on':''}" data-action="shop-view" data-v="merged">Todo junto</button>
		</div>
		${shopView==='dish'?`<button class="sv-all" data-action="shop-toggle-all">${anyOpen?"▴ Contraer":"▾ Expandir"}</button>`:""}
	</div>` : "";

	const extras = PendingFirst(state.extras);
	const exItems = extras.length? extras.map(x=>`
		<div class="it ${x.done?'done':''}">
			<button class="check ${x.done?'on':''}" data-action="ex-done" data-id="${x.id}">${x.done?'✓':''}</button>
			<div class="nm">${escapeHtml(x.name)}</div>
			<button class="del" data-action="ex-del" data-id="${x.id}">✕</button>
		</div>`).join("") : `<div class="empty-msg">Sin extras.</div>`;

	return `<div class="view-title">Lista de la compra</div>
		<p class="hint">Los ingredientes salen solos de las recetas, ya escalados para los que coméis. Ve tachando por el súper y, al llegar a casa, pulsa <b>«Ya está en casa»</b> para que entren en tu despensa.</p>
		<div class="sec">
			<div class="sec-h"><h3>🍎 Fruta y verdura</h3>
				${state.produce.length?`<button class="add-x" data-action="prod-clear">vaciar</button>`:""}
				<button class="add-x" data-action="prod-add">+ añadir</button></div>

/* ============================ RENDER: MACROS ============================ */
/* O(1) name->macros lookup. The catalog is reference data rebuilt only via
   RefreshCatalog(), which is the single invalidation point of this index. */
let _macroIndex = null;
function MacroIndex(){
	if(_macroIndex) return _macroIndex;
	_macroIndex = new Map();
	state.catalog.forEach(c=>{
		if(typeof c.kcal==="number")
			_macroIndex.set(c.name.trim().toLowerCase(),
				{kcal:c.kcal,prot:c.prot,carb:c.carb,fat:c.fat});
	});
	return _macroIndex;
}
/* catalog = (SEED upserted with state.userDishes, keyed by name) − hidden.
   A user dish whose name matches a SEED dish overrides it ("edit");
   a new name extends the catalog ("add"). SEED itself is never mutated. */
function RefreshCatalog(){
	const hidden = new Set(state.hidden||[]);
	const byName = new Map();
	BuildCatalog().forEach(c=>byName.set(c.name.trim().toLowerCase(),c));
	(state.userDishes||[]).forEach(u=>{
		if(!u || !u.name) return;
		byName.set(u.name.trim().toLowerCase(),{
			id:Uid(), name:u.name, tipo:u.tipo||null, course:u.course||"primero",
			kcal:u.kcal, prot:u.prot, carb:u.carb, fat:u.fat,
			estilo:u.estilo||null, batch:!!u.batch, receta:u.receta||null, user:true
		});
	});
	state.catalog = [...byName.values()]
		.filter(c=>!hidden.has(c.name.trim().toLowerCase()));
	_macroIndex = null;
}
/* accent/case-insensitive needle for search ("atun" must match "Atún") */
function Norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}

/* renaming a dish must follow it into every planned cell (composites too),
   or the week keeps the old name and its macros silently stop counting */
function RenameDishInWeeks(oldName,newName){
	const ok=oldName.trim().toLowerCase(); let n=0;
	Object.values(state.weeks||{}).forEach(w=>(w.days||[]).forEach(d=>SLOTS.forEach(sl=>{
		const slot=d.slots[sl]; if(!slot) return;
		Object.keys(slot).forEach(mid=>{
			const c=slot[mid]; if(!c||!c.dish) return;
			let hit=false;
			const parts=c.dish.split(SEP).map(p=>{
				if(p.trim().toLowerCase()===ok){hit=true;return newName;}
				return p.trim();
			});
			if(hit){c.dish=parts.join(SEP);n++;}
		});
	})));
	return n;
}

/* ---- recipe text utilities: the recipe IS the data (no duplicate store) ---- */
/* "Ingredientes (2 raciones): a, b, c.\n\n1. ..." -> {base, items[], steps} */
function RecipeParts(rec){
	if(!rec) return null;
	const i=rec.indexOf("\n\n");
	const head=(i>=0?rec.slice(0,i):rec).trim();
	const steps=i>=0?rec.slice(i+2).trim():"";
	const m=head.match(/^Ingredientes\s*(?:\(([^)]*)\))?\s*:\s*([\s\S]+)$/i);
	if(!m) return null;                        // "Sugerencia: …" -> not structured
	// top-level separators only (never inside parens): commas, ";" and ". " before a
	// capital ("sal. Para servir: …"). Older recipes wrote "sésamo; marinada: soja"
	// and it reached the shopping list. `ver` keeps the labels for the recipe sheet
	// ("Relleno: 3 huevos"); `items` is the shopping version (SinRotulo).
	const ver=m[2].replace(/\.\s*$/,"")
		.split(/(?:,|;|\.(?=\s+[A-ZÁÉÍÓÚÑ]))\s+(?![^()]*\))/)
		.map(s=>s.trim()).filter(Boolean);
	return {base:m[1]||"", items:ver.map(SinRotulo).filter(Boolean), ver, steps};
}
/* Shopping version of a line with a leading label, as people write their own
   recipes. It depends on what follows the label:
   - not something to buy ("Nota:", "Horno: 180 °C", "Raciones: 4") → the line goes;
   - "Opcional: guindilla" → "guindilla (opcional)", or it looked compulsory;
   - a product of its own ("Especias: comino", "Masa: 1 lámina de hojaldre",
     "Proteína: 200 g de pollo") → the label goes;
   - only a quantity → the label IS the product and is folded in: "Pollo: 500 g" →
     "500 g de pollo", "Huevo: 2" → "2 huevos", "Hummus: 1 tarrina" → "1 tarrina de
     hummus", "Sal: al gusto" → "sal al gusto". Dropping it bought "500 g" of nothing.
     Unless the label is a part or a category of the dish ("Para la salsa: 2
     cucharadas": of what?; "Verduras: 1 calabacín" names its own product);
   - a quantity with adjectives ("Cebolla: 1 grande") or an article ("Aceite de

/* a word that is a food itself (the shop's aisles, the proteins): "patatas", not "tarrina" */
function EsAlimento(w){
	const n=Norm(w||""); if(n.length<3) return false;
	return AISLES.some(a=>a.k.some(k=>n.indexOf(k)===0)) || PLAN_PROTEINAS.has(n) || PESCADO_AZUL.has(n) || PESCADO_BLANCO.has(n);

	const q=cant.match(CANTIDAD_SOLA);
	if(q){                                                   // nothing but a quantity
		if(grupo) return s;
		if(q[1]) return cant+" de "+nombre+paren;
		return cant+" "+(CantidadValor(cant.replace(/\.$/,""))>1?PluralFrase(nombre):nombre)+paren;
	}
	const qp=cant.match(/^([\d½¼¾⅓⅔][\d.,\/½¼¾⅓⅔–-]*)\s+(.+)$/);
	if(qp && !/\bde\b/i.test(qp[2])){                        // a quantity and a few words
		const pal=qp[2].split(/\s+/);
		if(pal.every(w=>ADJ_TAMANO.test(w))) return s;       // "Cebolla: 1 grande"
		// the words name a food of their own ("puré: 2 patatas", "Verduras: 1
		// calabacín"), or the label is a part of the dish: the label goes
		if(grupo||EsAlimento(pal[0])) return resto;
		return qp[1]+" "+qp[2]+" de "+nombre+paren;           // "Hummus: 1 tarrina"
	}

/* scale "250 g de lentejas" ×2 -> "500 g…"; times/temps/percentages stay put.
   A quantity is read whole: "1 1/2 taza", "1/2 kg" and "1½" are one number each
   ("1/2 kg" ×2 used to say "2/4 kg" — half of what you need — and "1½" ×2, "21").
   Whatever follows a quantity above one goes plural: "1 aguacate" ×2 said
   "2 aguacate" (every family dish is ×2 since «Nosotros» counts as two people),
   also after a label or a second option ("salsa: 1 aguacate", "o 1 manzana"). */
// (what is not a quantity to buy stays put: times, temperatures, percentages, "1 vez")
const NO_ESCALA="h\\b|min\\b|minutos?\\b|horas?\\b|segundos?\\b|seg\\b|°C|º|%|grados\\b|d[ií]as?\\b|noches?\\b|hervor(?:es)?\\b|vez\\b|veces\\b";

function CantidadValor(s){
	let m; s=String(s).trim();
	if((m=s.match(/^(\d+)\s+([1-9])\/([1-9])$/))) return +m[1]+m[2]/m[3];
	if((m=s.match(/^([1-9])\/([1-9])$/))) return m[1]/m[2];
	if((m=s.match(/^(\d+)([½¼¾⅓⅔])$/))) return +m[1]+FRACCIONES[m[2]];
	if(FRACCIONES[s]!==undefined) return FRACCIONES[s];
	if(/^\d{1,3}\.\d{3}$/.test(s)) return +s.replace(".","");   // "1.000 g" is a thousand, not one

function CantidadFmt(n,decimal){
	const r=Math.round(n*100)/100;
	if(Math.abs(r-Math.round(r))<1e-9) return String(Math.round(r));
	if(n<10&&!decimal){                          // "2½ tazas", "1½ kg"; never "62½ g" nor "7½ g"
		const e=Math.floor(n+1e-9), fr=n-e;
		for(const [v,s] of [[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"]]) if(Math.abs(fr-v)<0.01) return (e?String(e):"")+s;
	}
	return String(r).replace(".",",");
}
function ScaleQty(text,f){

		// number of the range too), and names like "harina 00"

		// a/b in front of a plural is scaled as two numbers, as before
		const fr=m[1].match(/^([1-9])\/([1-9])$/), sig=(tras.match(/^\s+(?:de\s+)?([a-záéíóúüñ]+)/i)||[])[1]||"";

		// clearly singular changes: «2 cafés» must not become «cafeses»
		if(nv>1){

			const seg=text.slice(last+sp[0].length).match(/^[^\d½¼¾⅓⅔]*/)[0];

/* "pimiento rojo grande (unos 200 g)" -> "pimientos rojos grandes (unos 200 g)":
   the noun and its adjectives, up to "de", a bracket or anything that is not a
   plain lower-case word ("huevo L", "manzana Golden", "AOVE" stay as written).
   Units ("kg", "ml", "cda.") and "1 o 2" are left alone; adverbs are skipped
   ("plátanos muy maduros"). Idempotent: what already ends in -s stays. */
const PLURAL_ALTO_1=new Set(["de","del","o","u","y","e","a","al","en","con","sin","para","por","que","x","más","menos","si","como","cada","entre","hasta","es","son","unos","unas","aprox","aproximadamente"]);
const PLURAL_ALTO=new Set([...PLURAL_ALTO_1,"sobre","tipo"].filter(x=>x!=="más"&&x!=="menos"));
const PLURAL_SALTA=new Set(["muy","bien","mal","más","menos","poco","bastante","recién","tan"]);   // «1 más» stops; «muy/más maduro» is skipped
const UNIDADES_ABREV=new Set(["g","gr","grs","kg","mg","ml","cl","dl","l","lt","lts","cm","mm","ud","uds","u","unid","unids","paq","paqs","pqt","pza","pzas","cc","oz","lb","cda","cdas","cdta","cdtas","cdita","cditas","cs","cp"]);
function PluralFrase(s,yaPlural){
	const w=s.split(/(\s+)/);                                // keeps the spaces
	if(!w.length||UNIDADES_ABREV.has(w[0].toLowerCase().replace(/[.),;:]+$/,""))) return s;   // "(1 kg)" stays "kg)"
	for(let i=0;i<w.length;i+=2){
		// a word may carry the closing bracket or comma of the phrase: "(o 1 huevo)"
		const t=w[i].match(/^([a-záéíóúüñ]{2,})([),.;:]*)$/);
		if(!t||(i?PLURAL_ALTO:PLURAL_ALTO_1).has(t[1])||UNIDADES_ABREV.has(t[1])) break;
		if(i&&PLURAL_SALTA.has(t[1])) continue;
		w[i]=(yaPlural&&/s$/i.test(t[1])?t[1]:PluralEs(t[1]))+t[2];
		if(t[2]) break;                                      // the phrase ends there
	}

const SIN_TILDE={"á":"a","é":"e","í":"i","ó":"o","ú":"u"};
function PluralEs(w){
	const low=w.toLowerCase();
	if(low==="buen") return w.slice(0,-1)+"nos";           // "1 buen puñado"
	if(low==="gran") return w+"des";
	if(/[áéíóú]s$/.test(low)) return w.replace(/[áéíóú](?=s$)/,c=>SIN_TILDE[c])+"es";   // francés -> franceses
	if(/[sx]$/.test(low)) return w;                          // already plural / invariable
	if(/[aeiouáéíóú]$/.test(low)) return w+"s";
	if(/z$/.test(low)) return w.slice(0,-1)+"ces";           // nuez -> nueces
	// Spanish endings take -es and lose the accent of the last syllable: limón ->
	// limones, calabacín -> calabacines. Anything else is a loanword: brick -> bricks
	if(/[lnrdjy]$/.test(low)) return w.replace(/[áéíóú](?=[a-zñ]?$)/,c=>SIN_TILDE[c])+"es";
	return w+"s";
}
/* shopping helper: ingredients of a planned cell (composites merge parts).
   Scaled when asked: recipes are written for N servings ("Ingredientes (2
   raciones)") but you cook for the people actually eating it, possibly more
   than one day — buying half of what you need is the whole point of the list. */
function IngredientesDe(name,factor){
	const parts=(name||"").split(SEP).map(s=>s.trim()).filter(Boolean);
	let out=[];
	parts.forEach(p=>{
		const r=RecipeParts(DishRecipe(p)); if(!r) return;
		const f=factor||1;
		out=out.concat(f===1? r.items : r.items.map(x=>ScaleQty(x,f)));
	});
	return out.length?out:null;
}
/* how many servings the recipe text itself is written for (default 2) */
function RecipeServings(name){
	const parts=(name||"").split(SEP).map(s=>s.trim()).filter(Boolean);
	for(const p of parts){
		const r=RecipeParts(DishRecipe(p));
		// "(1 ración)" too: read as the default 2, the French omelette bought half
		if(r && r.base){ const m=r.base.match(/(\d+)\s*(?:raci[oó]n(?:es)?|unidad(?:es)?|uds?)\b/i); if(m) return parseInt(m[1],10)||2; }
	}
	return 2;
}
/* people actually eating this dish this week (counts every planned cell, so a
   dish cooked twice for 3 people needs 6 servings) */
function ServingsNeeded(name){
	const wk=CurWeek(); const k=name.trim().toLowerCase(); let n=0;
	wk.days.forEach(d=>["Comida","Cena"].forEach(s=>{
		const slot=d.slots[s]; if(!slot) return;
		state.members.forEach(m=>{
			const c=slot[m.id];
			if(c && c.dish && !c.away && c.dish.trim().toLowerCase()===k) n+=MemberPersonas(m);
		});
	}));
	return n||1;
}
/* a member is a column, not always one person: «Nosotros» is Alex AND Jeza.
   Counting columns bought 3 servings for 4 people all week. */
function MemberPersonas(m){ return typeof m.personas==="number"?m.personas:(m.id==="nosotros"?2:1); }
/* rounded-up scale factor for a dish, e.g. recipe for 2, need 6 -> ×3 */
function DishScale(name){
	const need=ServingsNeeded(name), base=RecipeServings(name)||2;
	const f=need/base;
	return f<=1 ? 1 : Math.round(f*2)/2;      // halves: ×1,5 is a real thing when cooking

/* Pantry hint: which stocked item plausibly covers this ingredient?
   Matches on the pantry item's HEAD NOUN (first significant word, as Spanish
   puts it first) against whole words of the ingredient. That keeps "Pollo
   entero" ↔ "250 g de pollo" while killing the old false positive where
   "Caldo de pollo" marked "400 g de pechuga de pollo" as already owned.
   Returns the matching item (so the UI can name it) or null. */
/* crude but symmetric: applied to BOTH sides, so consistency beats grammar */
/* (+ the "-es" plurals the shopping list now writes: limones, calabacines, yogures,
   nueces — only these endings: "carnes" or "verdes" must stay carne/verde) */
function Singular(w){
	if(w.length>5 && /(on|in|ur|ol|or|ar)es$/.test(w)) return w.slice(0,-2);    // coliflores -> coliflor
	if(w.length>4 && /[aeiou]ces$/.test(w)) return w.slice(0,-3)+"z";      // not "dulces"

function PantryMatch(text){
	const words=new Set(Norm(text).split(/[^a-z0-9]+/).filter(Boolean).map(Singular));
	const inv=[...state.inventory.frigo,...state.inventory.conge].filter(i=>i.qty>0);
	for(const i of inv){
		const ks=Tokens(i.name);
		if(ks.length && words.has(Singular(ks[0]))) return i;
	}

function PantryHas(text){ return !!PantryMatch(text); }
/* distinct cooked dishes (Comida + Cena) planned this week, alpha order.
   Desayuno/Almuerzo are routine staples, handled in Fruta/verdura + Otros. */
function PlannedCookDishes(){
	const wk=CurWeek(); const seen=new Map();
	wk.days.forEach(d=>["Comida","Cena"].forEach(s=>{
		const slot=d.slots[s]; if(!slot) return;
		state.members.forEach(m=>{
			const c=slot[m.id];
			if(c && c.dish && !c.away && !EsLibre(c.dish)){          // the plan's free meal buys nothing
				const k=c.dish.trim().toLowerCase();
				if(!seen.has(k)) seen.set(k,c.dish.trim());
			}

	}));

}
/* sort key that drops a leading "<qty> <unit> de " so "250 g de lentejas"
   and "lentejas rojas" cluster together in the merged shopping list */
function IngSortKey(t){
	let s=Norm(t);
	s=s.replace(/^[\d.,\/½¼¾⅓⅔\s\-–—]+/,"");
	s=s.replace(/^(kg|g|mg|ml|cl|l|ud|uds|dientes?|lomos?|latas?|filetes?|rebanadas?|cdas?|cdtas?|cucharadas?|cucharaditas?|hojas?|ramas?|vasos?|pizca|manojos?|puñados?)\b\s*/,"");
	s=s.replace(/^de\s+(la\s+|el\s+|los\s+|las\s+)?/,"");

}
/* all planned-dish ingredients as ONE list, deduped (accent/case-insensitive),
   clustered by ingredient noun. Dishes without a recipe are not included here
   (they're surfaced as such in the per-dish view). */
/* Scale of ONE part of a dish: "Salmorejo · Pavo a la plancha" is a 4-serving
   soup and a 2-serving grill; scaling both by the soup's base bought turkey for 2. */
function PartScale(need,base){ const f=need/(base||2); return f<=1?1:Math.round(f*2)/2; }
/* shopping ingredients of a planned cell, each part scaled by its own recipe.
   Pairs {orig, x}: the line as the recipe writes it and as it is bought */
function IngredientesCompraPares(name){
	const need=ServingsNeeded(name), out=[]; let sobra=null;
	(name||"").split(SEP).map(s=>s.trim()).filter(Boolean).forEach(p=>{
		const r=RecipeParts(DishRecipe(p)); if(!r) return;
		const base=RecipeServings(p), f=PartScale(need,base);
		r.items.forEach(x=>{
			if(!SOBRA_RE.test(x)){ out.push({orig:x, x:f===1?x:ScaleQty(x,f)}); return; }
			// the leftover line: only for the servings no roast lunch covers, and
			// then it is something to buy, not "what was left over"
			if(sobra===null) sobra=SobraSinCubrir(name);
			if(!sobra) return;
			const y=x.replace(SOBRA_RE,"").replace(/\s{2,}/g," ").trim(), fs=PartScale(sobra,base);
			out.push({orig:y, x:fs===1?y:ScaleQty(y,fs)});
		});
	});
	return out;
}
function IngredientesCompra(name){ const o=IngredientesCompraPares(name).map(p=>p.x); return o.length?o:null; }
/* Sunday dinner reuses the lunch roast ("400 g de pollo asado (el que sobró de la
   comida)"). A dinner after a roast-chicken lunch that day is covered: the line is
   not bought again — it used to add a second chicken to the list and a phantom
   «Pollo asado» to the pantry. Any other serving of the dish (another night, or a
   lunch) is not: the same salad put on Tuesday's lunch by hand came out with no
   chicken at all. Returns the persons NOT covered. */
const SOBRA_RE=/\(el que sobr[oó] de la comida\)/i;
function SobraSinCubrir(name){
	const k=(name||"").trim().toLowerCase(); let n=0;
	const come=(slot,test)=>state.members.some(m=>{ const c=slot&&slot[m.id]; return c&&c.dish&&!c.away&&test(c.dish); });
	CurWeek().days.forEach(d=>["Comida","Cena"].forEach(s=>{
		const slot=d.slots[s]; if(!slot) return;
		if(s==="Cena" && come(d.slots.Comida,x=>/pollo asado/i.test(x))) return;
		state.members.forEach(m=>{ const c=slot[m.id]; if(c&&c.dish&&!c.away&&c.dish.trim().toLowerCase()===k) n+=MemberPersonas(m); });
	}));
	return n;
}
/* per-part factors for the header: "Salmorejo ×1 · Pavo ×2". The full names are
   already on the line above: repeated in the label, it grew to 300 px and pushed
   the 📖 and the counter out of the card every week (Monday lunch is always a
   4-serving first course with a 2-serving second). First word of each part only. */
function EscalaTxt(name){
	const need=ServingsNeeded(name);
	// the position in the dish counts every part, with a recipe or not
	const parts=(name||"").split(SEP).map((s,i)=>({p:s.trim(),i})).filter(o=>o.p&&RecipeParts(DishRecipe(o.p)));
	const fs=parts.map(o=>PartScale(need,RecipeServings(o.p)));
	if(!fs.some(f=>f>1)) return "";
	const x=f=>"×"+String(f).replace(".",",");
	if(parts.length<2) return x(fs[0]);
	// "Judías ×2 · Judías ×1" says nothing: then by position
	const pal=parts.map(o=>o.p.split(/[\s,]+/)[0]);
	const nom=new Set(pal.map(s=>s.toLowerCase())).size===pal.length ? pal : parts.map(o=>(o.i+1)+".º");
	return nom.map((n,i)=>n+" "+x(fs[i])).join(SEP);
}
/* The merged list used to drop repeats: two dishes with "1 cebolla" bought ONE
   onion (16 lines a week went missing). Now repeats count: "1 cebolla ×2". The
   ×N suffix is not part of the "bought" key, so ticking the line in «Por plato»
   ticks the merged one too (and vice versa). */
const SHOP_X=/ ×\d+$/;
function ShopKey(x){ return Norm(String(x).replace(SHOP_X,"")); }
function MergedIngredients(){
	const map=new Map();
	PlannedCookDishes().forEach(n=>{
		const ing=IngredientesCompra(n);
		if(ing) ing.forEach(x=>{const k=Norm(x); const e=map.get(k); if(e) e.n++; else map.set(k,{x,n:1});});
	});
	// + the post-workout carb of whoever trained: the plan's base recipes are
	// carb-free on purpose, so this is the only place that potato gets bought
	PlanHidratosCompra().forEach(x=>{const k=Norm(x); if(!map.has(k)) map.set(k,{x,n:1});});
	// only lines with a quantity add up ("sal" or "AOVE" twice is still one line)
	return [...map.values()].map(e=>e.n>1&&/^\s*[\d½¼¾⅓⅔]/.test(e.x)?e.x+" ×"+e.n:e.x).sort((a,b)=>{
		const aa=AisleOf(a), ab=AisleOf(b);
		if(aa!==ab) return aa-ab;                       // walk the shop, not the alphabet
		return IngSortKey(a).localeCompare(IngSortKey(b),"es");

}
/* rough supermarket aisles, so the combined list follows the trolley instead of
   the alphabet. Unknown items fall into "despensa", which is fine. */
const AISLES=[
	{n:"Fruta y verdura",k:["tomate","cebolla","ajo","patata","zanahoria","calabac","berenjena","pimiento","lechuga","espinaca","brocoli","broco","canonigo","rucula","pepino","limon","lima","naranja","platano","manzana","aguacate","champinon","seta","calabaza","puerro","apio","judia","guisante","perejil","cilantro","albahaca","menta","romero","tomillo","boniato","col","coliflor","esparrago","remolacha","mango","fresa","pera","jengibre","cebolleta","chalota","rabano","alcachofa","uva","eneldo","cebollino"]},
	{n:"Carne y pescado",k:["pollo","pavo","ternera","cerdo","lomo","carne","jamon","bacon","chorizo","conejo","cordero","salmon","merluza","bacalao","atun","lubina","dorada","gamba","langostino","mejillon","calamar","sepia","pulpo","boqueron","anchoa","marisco","chipiron","pechuga","contramuslo","muslo","solomillo","filete"]},
	{n:"Frescos y lácteos",k:["huevo","leche","yogur","queso","mozzarella","feta","parmesano","nata","mantequilla","tofu","crema","palitos de cangrejo","surimi"]},
	{n:"Despensa",k:["arroz","pasta","espagueti","macarron","quinoa","lenteja","garbanzo","alubia","frijol","avena","harina","pan","tortilla integral","aceite","aove","vinagre","sal","pimienta","curry","comino","pimenton","curcuma","canela","azafran","laurel","oregano","caldo","tomate triturado","conserva","tahini","miso","soja","coco","nuez","nueces","almendra","anacardo","pistacho","semilla","sesamo","pipa","miel","mostaza","aceituna","hummus","levadura","cacahuete","pasas"]},
	{n:"Congelados",k:["congelad","helado"]}
];
function AisleOf(text){
	const t=Norm(text);
	// tins, stock and dressings first: "tomate triturado" and "vinagre de manzana"
	// were sent to the greengrocer, "atún en aceite" and "caldo de pollo" to the fishmonger
	// (outside parentheses: "pimientos asados (o en conserva)" are still produce)
	if(/\b(vinagre|triturad[oa]s?|caldo|en aceite|latas?|en conserva|de bote|pipas)\b/.test(t.replace(/\([^)]*\)/g,""))) return 3;
	for(let i=0;i<AISLES.length;i++) if(AISLES[i].k.some(k=>t.indexOf(k)>=0)) return i;
	return 3;                                          // default: despensa
}
function AisleName(i){ return (AISLES[i]||AISLES[3]).n; }
/* "bought" checklist, stored per week (keyed by Norm(ingredient)) so it resets
   naturally when you move to another week. Same key across dishes = tick once. */
/* Fruta/verdura and Otros keep a global "done" flag, so last week's ticks used to
   survive into this week and you'd send the greengrocer an already-crossed-off
   list. Reset them the first time a new week is opened. */
function ResetWeeklyTicks(){
	// only for a NEWER week: looking back at last week's list unticked this week's
	// fruit and «Otros» — and, re-stamped, the untick travelled to the other phone.
	// A peek far ahead (more than next week) does not count as "the current shop",
	// or the weeks in between would never start clean
	if(state.shopWeek===state.current) return 0;
	if(state.shopWeek && state.current<state.shopWeek && state.shopWeek<=AddDays(MondayOf(TodayISO()),7)) return 0;
	let n=0;
	(state.produce||[]).forEach(p=>{ if(p.done){p.done=false;Stamp(p);n++;} });
	(state.extras||[]).forEach(x=>{ if(x.done){x.done=false;Stamp(x);n++;} });
	state.shopWeek=state.current;
	SaveQuiet();
	return n;
}
/* While you are at the supermarket the only thing that matters is what is still
   missing, so anything ticked sinks to the bottom. Render-only: the arrays keep

function PendingFirst(list){
	const l=(list||[]).map((it,i)=>({it,i}));
	l.sort((a,b)=>(!!a.it.done-!!b.it.done)||(a.i-b.i));
	return l.map(x=>x.it);
}

/* recipe text for a dish: user-written first, then the built-in recipe book */
function DishRecipe(name){

/* a meal cell may hold "1º · 2º"; sum the macros of every recognised part */
function MealMacros(dish){
	if(!dish) return null;
	const parts=dish.split(SEP).map(s=>s.trim()).filter(Boolean);
	const t={kcal:0,prot:0,carb:0,fat:0}; let hit=false;
	parts.forEach(p=>{const m=DishMacros(p); if(m){hit=true;t.kcal+=m.kcal;t.prot+=m.prot;t.carb+=m.carb;t.fat+=m.fat;}});

}
function MemberWeekMacros(member){
	const wk=CurWeek(); const f=member.factor||1;
	const t={kcal:0,prot:0,carb:0,fat:0}; let counted=0,planned=0;
	wk.days.forEach(d=>["Comida","Cena"].forEach(sl=>{

function RenderMacros(){
	const days=7;

		${cards}`;
}

		if(!state.members.some(m=>src.slots[s][m.id]&&src.slots[s][m.id].dish)) return;

			d.slots[s][m.id]={dish:c?c.dish:"",invId:null,away:!!(c&&c.away)}; });
		n++;
	}));
	ui.copyPick={};
	Save(); CloseSheet(); Render();
	ToastAction(`Copiado a ${targets.length} día${targets.length>1?"s":""}`,"Deshacer",()=>{
		try{ const w=JSON.parse(bak); state.weeks[w.monday]=w; Save(); Render(); Toast("Deshecho"); }
		catch(e){ Toast("No se pudo deshacer"); }
	});
}

/* ---- dish editor (add + edit). Writes to state.userDishes, keyed by name. ---- */
function EditDish(dish,defCourse){
	const isEdit=!!dish;
	const orig=isEdit?dish.name:null;
	AddPrompt({title:isEdit?"Editar plato":"Nuevo plato",fields:[
		{key:"name",label:"Nombre del plato",ph:"p.ej. Lasaña de calabacín",value:isEdit?dish.name:""},
		{key:"course",label:"Categoría",type:"select",value:isEdit?dish.course:defCourse,options:[
			{value:"primero",label:"Primeros"},{value:"segundo",label:"Segundos"},{value:"cena",label:"Cenas"},{value:"noah",label:"Comidas Noah"}]},
		{key:"tipo",label:"Tipo (opcional)",ph:"Pasta, Pollo, Verduras…",value:isEdit?(dish.tipo||""):""},
		{key:"estilo",label:"Estilo (opcional)",ph:"Casero, Italiano, Asiático…",value:isEdit?(dish.estilo||""):""},
		{key:"batch",label:"¿Batch/Tupper?",type:"select",value:isEdit&&dish.batch?"1":"0",options:[{value:"0",label:"No"},{value:"1",label:"Sí"}]},
		// everything below is optional and folded away: adding a dish is 2 fields
		{type:"fold",label:"Macros y receta (opcional)",open:isEdit},
		{key:"kcal",label:"Kcal por ración",type:"number",ph:"450",value:isEdit&&typeof dish.kcal==="number"?dish.kcal:"",fold:1},
		{key:"prot",label:"Proteína (g)",type:"number",ph:"25",value:isEdit&&typeof dish.prot==="number"?dish.prot:"",fold:1},
		{key:"carb",label:"Hidratos (g)",type:"number",ph:"40",value:isEdit&&typeof dish.carb==="number"?dish.carb:"",fold:1},
		{key:"fat",label:"Grasa (g)",type:"number",ph:"15",value:isEdit&&typeof dish.fat==="number"?dish.fat:"",fold:1},
		{key:"receta",label:"Receta (ingredientes y pasos)",type:"textarea",ph:"Escríbela una vez y quedará guardada…",value:isEdit?(DishRecipe(dish.name)||""):"",fold:1}
	],onSave:v=>{
		if(!v.name) return Toast("Pon un nombre");
		const num=x=>{const n=ParseQty(x);return n===null?undefined:n};
		const u={name:v.name,course:v.course,tipo:v.tipo||null,estilo:v.estilo||null,batch:v.batch==="1",
			kcal:num(v.kcal),prot:num(v.prot),carb:num(v.carb),fat:num(v.fat),receta:v.receta||null};
		const key=v.name.trim().toLowerCase();
		const okey=orig?orig.trim().toLowerCase():null;
		state.userDishes=(state.userDishes||[]).filter(d=>{
			const k=(d.name||"").trim().toLowerCase();
			return k!==key && k!==okey;
		});
		state.userDishes.push(u);
		state.hidden=(state.hidden||[]).filter(h=>h!==key);        // resurrect if it was hidden
		if(okey && okey!==key){
			if(!state.hidden.includes(okey)) state.hidden.push(okey);  // rename: hide old SEED name
			RenameDishInWeeks(orig,v.name);                            // follow the rename into planned weeks
		}
		RefreshCatalog(); Save(); CloseSheet();
		ui.ideasCourse=v.course; Render(); Toast(isEdit?"Plato actualizado":"Plato añadido");
	}});
}

function OpenPicker(dayIdx,slot,member,applyAll){
	const course = slot==="Comida"?"comida":(slot==="Cena"?"cena":"todos");

	if(slot==="Comida"||slot==="Cena"){

		const parts=(ref&&ref.dish?ref.dish:"").split(SEP).map(s=>s.trim());
		picker.pri=parts[0]||null;

function PickerCandidates(){
	let items=state.catalog.slice();
	if(!picker.all){                     // scope toggle: restrict to the slot's course
		if(picker.slot==="Comida") items=items.filter(c=>c.course===(picker.sub==="pri"?"primero":"segundo"));
		else if(picker.slot==="Cena") items=items.filter(c=>c.course==="cena");
	}
	// other slots (Desayuno/Almuerzo): all courses
	if(picker.tipo) items=items.filter(c=>c.tipo===picker.tipo);
	if(picker.search){const q=Norm(picker.search);items=items.filter(c=>Norm(c.name).includes(q))}
	items.sort((a,b)=>a.name.localeCompare(b.name,"es"));
	return items;

/* Collapse the picker to "field + results" while the on-screen keyboard is up.
   Driven by the measured keyboard height, not by focus: it can't race a tap on a
   result (blur → keyboard close → the rest returns *after* the click lands) and
   it heals itself when the keyboard goes away. Pure class toggle: no re-render,
   so #pickSearch and the caret survive. */
function SyncPickerKb(kb){
	const sb=document.querySelector(".sheet-body");
	if(!sb || !sb.classList) return false;
	const on = !!picker && kb>60;
	if(on===sb.classList.contains("pk-kb")) return on;
	sb.classList.toggle("pk-kb",on);
	if(on) sb.scrollTop=0;                 // put the field at the top, results under it
	return on;
}

/* assign logic */
/* Valid member ids for the current picker. Guards the case that corrupted data:
   opening via "para todos" leaves picker.member null; if the user then turns the
   "Aplicar a todos" switch OFF, [null] used to be written as a phantom member
   ("null" key), so the dish silently vanished from the week. Never write to a
   member that doesn't exist — fall back to everyone (the original intent). */
function PickerTargets(){
	const ids=state.members.map(m=>m.id);
	if(!picker || picker.applyAll) return ids;
	const one=ids.filter(id=>id===picker.member);
	return one.length?one:ids;
}
function ApplyDish(dish,invId){
	const wk=CurWeek(); const slot=wk.days[picker.dayIdx].slots[picker.slot];
	const targets = PickerTargets();
	let firstInv = invId;     // only first target carries the inv link / decrement
	targets.forEach((mid,idx)=>{
		const link = (idx===0)?firstInv:null;
		slot[mid] = {dish:dish, invId:link, away:false};
	});
	if(invId){
		const it=InvById(invId);
		if(it && it.qty>0){it.qty-=1}  // consume one unit
	}
	const wasAll=picker.applyAll;
	Save(); CloseSheet(); Render();
	Toast(wasAll?"Asignado a todos":"Asignado");
}
function SaveComida(){
	const parts=[picker.pri,picker.seg].filter(Boolean);
	if(!parts.length) return Toast("Elige al menos un plato");
	ApplyDish(parts.join(SEP), picker.invId||null);
}
