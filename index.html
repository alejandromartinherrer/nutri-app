		case "prod-clear": { const n=state.produce.length, hechos=state.produce.filter(p=>p.done).length;
			ConfirmSheet({title:"Vaciar fruta y verdura",
				text:`Se quitan los <b>${n}</b> productos de la lista${hechos?` (${hechos} ya comprado${hechos>1?"s":""})`:""}. Podrás deshacerlo.`,
				okLabel:"Vaciar", onOk:()=>ClearListWithUndo(state.produce,"fruta y verdura")}); break; }
		case "prod-add": AddPrompt({title:"Añadir fruta/verdura",fields:[
			{key:"name",label:"Qué",ph:"p.ej. Manzana Golden"},
			{key:"qty",label:"Cantidad",type:"number",value:""},
			{key:"unit",label:"Unidad",ph:"ud / kg",value:"ud"}
		],onSave:v=>{if(!v.name)return Toast("Pon un nombre");
			const {qty,unit}=ParseQtyUnit(v.qty);
			// "0,5 kg" written entirely in the quantity box still gets its unit
			const u=(v.unit&&v.unit!=="ud")?v.unit:(unit||v.unit||"ud");
			state.produce.push(Stamp({id:Uid(),name:v.name,qty:(qty&&qty>0)?qty:null,unit:u,done:false}));Save();CloseSheet();Render()}}); break;
		/* extras */
		case "ex-done": { const x=state.extras.find(z=>z.id===ds.id); if(x){x.done=!x.done; Stamp(x); Save(); Render()} break; }
		case "ex-del": DeleteWithUndo(state.extras,state.extras.findIndex(z=>z.id===ds.id)); break;
		case "ex-clear": { const n=state.extras.length, hechos=state.extras.filter(x=>x.done).length;
			ConfirmSheet({title:"Vaciar Otros",
				text:`Se quitan los <b>${n}</b> elementos de la lista${hechos?` (${hechos} ya comprado${hechos>1?"s":""})`:""}. Podrás deshacerlo.`,
				okLabel:"Vaciar", onOk:()=>ClearListWithUndo(state.extras,"Otros")}); break; }
		case "ex-add": AddPrompt({title:"Añadir a Otros",fields:[{key:"name",label:"Qué",ph:"p.ej. Papel de horno"}],onSave:v=>{if(!v.name)return;state.extras.push(Stamp({id:Uid(),name:v.name,done:false}));Save();CloseSheet();Render()}}); break;
		case "need-to-extra": state.extras.push(Stamp({id:Uid(),name:ds.name,done:false})); Save(); Toast("Movido a Otros"); break;
		/* ideas */
		case "ideas-course": ui.ideasCourse=ds.c; ui.ideasTipo=null; ui.ideasSearch=""; Render(); break;
		case "ideas-clear": ui.ideasSearch=""; ui.ideasTipo=null; Render(); break;
		case "ideas-tipo": ui.ideasTipo=ds.t||null; Render(); break;
		case "idea-open": _pickerBack=null; _planBack=null; OpenDish(ds.id); break;
		/* plan del nutricionista */
		case "vive-activo": EnsurePlanState(state); state.plan.activo=!state.plan.activo; StampPlan("activo"); Save(); Render();
			Toast(state.plan.activo?"Plan del nutricionista activado: Sorpréndeme, raciones e hidratos en la compra":"Plan apagado: Sorpréndeme elige de todo el recetario, sin raciones ni hidratos post-entreno"); break;
		case "vive-ent": ToggleEntreno(ds.p,ds.d); Save(); Render(); break;
		case "vive-noche": ToggleNoche(ds.p,ds.d); Save(); Render(); break;
		case "vive-cole": EnsurePlanState(state); state.plan.ninosCole=!state.plan.ninosCole; StampPlan("ninosCole"); Save(); Render();
			Toast(state.plan.ninosCole?"Noah e Iria: comida en el cole de lunes a viernes":"Noah e Iria comen en casa"); break;
		case "vive-dia": OpenPlanDia(+ds.d); break;
		case "vive-sec": ui.planOpen=ui.planOpen||{}; ui.planOpen[ds.k]=!ui.planOpen[ds.k]; Render(); break;
		case "vive-receta": { _planBack=(ds.d===""||ds.d===undefined)?null:+ds.d;
			const k=(ds.name||"").trim().toLowerCase();
			const d=state.catalog.find(x=>x.name.trim().toLowerCase()===k);
			if(d){ _pickerBack=null; OpenDish(d.id); } else OpenRecetaSuelta(ds.name);
			break; }
		case "vive-back": { const b=_planBack; _planBack=null; if(b!==null) OpenPlanDia(b); else CloseSheet(); break; }
		case "plan-dish": OpenPlanDish(ds.name); break;
		case "copy-day": ui.copyPick={}; OpenCopyDay(+ds.d); break;
		case "copy-pick": ui.copyPick=ui.copyPick||{}; ui.copyPick[ds.date]=!ui.copyPick[ds.date];
			OpenCopyDay(+document.querySelector('[data-action="copy-do"]').dataset.d); break;
		case "copy-do": DoCopyDay(+ds.d); break;
		case "plan-put": { if(AssignDishTo(+ds.d,ds.s,ds.name)){ CloseSheet(); ui.view="semana"; ui.collapsed[CurWeek().days[+ds.d].date]=false; Render(); Toast(`${ds.name} · ${DOW[+ds.d]} ${ds.s.toLowerCase()} ✓`); } break; }
		case "pick-back": { if(_pickerBack){ picker={..._pickerBack}; _pickerBack=null; RenderPicker(); } break; }
		case "dish-open": { _planBack=null; const k=(ds.name||"").trim().toLowerCase();
			const d=state.catalog.find(x=>x.name.trim().toLowerCase()===k);
			// routine breakfasts have a recipe but live outside the catalog: their 📖
			// used to answer "no está en el recetario"
			if(d) OpenDish(d.id); else if(DishRecipe(ds.name)) OpenRecetaSuelta(ds.name.trim());
			else Toast("Este plato no está en el recetario");
			break; }
		case "idea-edit": { const d=state.catalog.find(x=>x.id===ds.id); if(d) EditDish(d,d.course); break; }
		case "idea-del": { const d=state.catalog.find(x=>x.id===ds.id); if(!d) break;
			const nm=d.name.trim().toLowerCase();
			const propia=(state.userDishes||[]).find(x=>(x.name||"").trim().toLowerCase()===nm);
			const quitar=()=>{
				const hiddenBak=(state.hidden||[]).slice(), userBak=(state.userDishes||[]).slice();
				(state.hidden=state.hidden||[]).includes(nm)||state.hidden.push(nm);
				state.userDishes=(state.userDishes||[]).filter(x=>(x.name||"").trim().toLowerCase()!==nm);
				RefreshCatalog(); Save(); if(ds.close) CloseSheet(); Render();
				ToastAction("Quitado «"+d.name+"» del recetario","Deshacer",()=>{
					state.hidden=hiddenBak; state.userDishes=userBak;
					RefreshCatalog(); Save(); Render(); Toast("Restaurado");
				});
			};
			// a dish carrying a recipe YOU wrote is the one thing that can't be rebuilt
			if(propia && propia.receta){
				ConfirmSheet({title:"Borrar «"+d.name+"»",
					text:"Este plato tiene <b>tu receta escrita</b>. Si lo borras, la receta se pierde y no está en ningún otro sitio.",
					okLabel:"Borrar del recetario", onOk:quitar});
			} else quitar();
			break; }
		case "idea-add": EditDish(null, ds.c||"primero"); break;
	}
});

/* picker-specific (data-paction) */
document.addEventListener("click",e=>{
	const t=e.target.closest("[data-paction]"); if(!t||!picker) return;
	const a=t.dataset.paction, ds=t.dataset;
	switch(a){
		// who the dish is for: "" = everyone. Replaces the old on/off switch, which
		// could leave member=null and had no way to target just one person.
		case "pwho": { picker.applyAll = ds.m===""; picker.member = ds.m || null;
			PickerLoadComposer(); PaintPickerHead(); PaintPickerFilters(); PaintPickerList(); break; }
		case "psub": picker.sub=ds.c; picker.tipo=null; PaintPickerHead(); PaintPickerFilters(); PaintPickerList(); break;
		case "pclrsub": picker[ds.c]=null; PaintPickerHead(); break;
		case "ptipo": picker.tipo=ds.t||null; PaintPickerFilters(); PaintPickerList(); break;
		case "pall": picker.all=ds.v==="1"; picker.tipo=null; PaintPickerFilters(); PaintPickerList(); break;
		case "pinv": { const it=InvById(ds.id); if(!it) break;
			if(picker.slot==="Comida"||picker.slot==="Cena"){ picker[picker.sub]=it.name; picker.invId=it.id; if(picker.sub==="pri")picker.sub="seg"; PaintPickerAfterChoice(); }
			else ApplyDish(it.name,it.id); break; }
		// consult the recipe BEFORE choosing, without losing the picker
		case "pbook": { e.stopPropagation();
			const k=(ds.name||"").trim().toLowerCase();
			const d2=state.catalog.find(x=>x.name.trim().toLowerCase()===k);
			if(d2){ _pickerBack={...picker}; OpenDish(d2.id); }
			break; }
		case "pchoose":
			if(picker.slot==="Comida"||picker.slot==="Cena"){ picker[picker.sub]=ds.name; if(picker.sub==="pri")picker.sub="seg"; PaintPickerAfterChoice(); }
			else ApplyDish(ds.name,null); break;
		case "pfree":   // free text: same as choosing, but clears the search box
			if(picker.slot==="Comida"||picker.slot==="Cena"){ picker[picker.sub]=ds.name; picker.search=""; const si=document.getElementById("pickSearch"); if(si) si.value=""; if(picker.sub==="pri")picker.sub="seg"; PaintPickerAfterChoice(); }
			else ApplyDish(ds.name,null); break;
		case "psave": SaveComida(); break;
		case "paway": SetAway(); break;
		case "pclear": ClearCell(); break;
	}
});

/* search free-text commit on enter inside picker */
document.addEventListener("keydown",e=>{
	if(e.key==="Escape"&&document.getElementById("sheet").classList.contains("show")){
		CloseSheet(); return;
	}
	if(e.key==="Enter"&&picker&&document.activeElement&&document.activeElement.id==="pickSearch"){
		const v=document.activeElement.value.trim(); if(!v) return;
		if(picker.slot==="Comida"||picker.slot==="Cena"){
			picker[picker.sub]=v; picker.search="";
			document.activeElement.value="";           // the input stays alive: keyboard doesn't drop
			if(picker.sub==="pri")picker.sub="seg";
			PaintPickerAfterChoice();
		} else ApplyDish(v,null);
	}
});

/* ============================ INIT ============================ */
(function init(){
	if(!Load()){ state=SeedState(); }
	if(!state.graveyard||typeof state.graveyard!=="object") state.graveyard={};
	EnsurePlanState(state);
	if(!Array.isArray(state.extras)) state.extras=[];
	if(!Array.isArray(state.hidden)) state.hidden=[];
	if(!Array.isArray(state.userDishes)) state.userDishes=[];
	RefreshCatalog();                 // reference data: SEED + userDishes − hidden
	if(!state.members) state.members=[{id:"nosotros",name:"Nosotros",color:"var(--m-nosotros)",factor:1},{id:"noah",name:"Noah",color:"var(--m-noah)",factor:0.6},{id:"iria",name:"Iria",color:"var(--m-iria)",factor:0.6}];
	state.members.forEach(m=>{if(typeof m.factor!=="number")m.factor=(m.id==="nosotros"?1:0.6);});
	// always open on the CURRENT week (needs members: EnsureWeek builds cells per member)
	GoToThisWeek();
	if(!state.theme) state.theme="fresco";
	ApplyTheme();
	BuildManifest();
	EnsureWeek(state.current);
	SaveQuiet(); Render();
	CloudPull({boot:true});          // async, never blocks offline start
	/* Swipe left/right on the week to move between weeks: the arrows were the only
	   way, and they are the smallest targets on the busiest screen. */
	(function(){
		const view=document.getElementById("view");
		let x0=0,y0=0,live=false;
		view.addEventListener("touchstart",e=>{
			if(ui.view!=="semana"||e.touches.length!==1){live=false;return}
			live=true; x0=e.touches[0].clientX; y0=e.touches[0].clientY;
		},{passive:true});
		view.addEventListener("touchend",e=>{
			if(!live) return; live=false;
			const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
			if(Math.abs(dx)<60||Math.abs(dy)>40) return;          // horizontal only
			state.current=AddDays(state.current, dx<0?7:-7);
			EnsureWeek(state.current); Save(); Render();
		},{passive:true});
	})();
	/* Offline edits used to sit there for ever: ScheduleAutoSync bails when there
	   is no connection and nothing ever retried. Retry when the network returns
	   and when the app goes to the background. */
	window.addEventListener("online",()=>{
		if(CloudDirty() && !PushBackedOff()) CloudSave(true);
		CloudPull({quiet:true});          // the other phone may have edited while we were dark
	});
	/* Track the finger so a pull never rebuilds a list mid-flick. iOS keeps
	   scrolling after touchend, so we also wait for the scroll to go quiet. */
	let _gestEnd=null;
	const gestOn=()=>{ _gestureActive=true; clearTimeout(_gestEnd); };
	const gestOff=()=>{ clearTimeout(_gestEnd); _gestEnd=setTimeout(()=>{ _gestureActive=false; FlushPendingPull(); },450); };
	window.addEventListener("touchstart",gestOn,{passive:true});
	window.addEventListener("touchmove",gestOn,{passive:true});
	window.addEventListener("touchend",gestOff,{passive:true});
	window.addEventListener("touchcancel",gestOff,{passive:true});
	window.addEventListener("scroll",gestOff,{passive:true});
	/* Expose the on-screen keyboard height as --kb so bottom sheets sit ON TOP of
	   it instead of hiding behind it (iOS doesn't shrink the layout viewport). */
	const vv=window.visualViewport;
	if(vv){
		const upd=()=>{
			const kb=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
			document.documentElement.style.setProperty("--kb",kb+"px");
			SyncPickerKb(kb);            // collapse/restore the picker with the keyboard
		};
		vv.addEventListener("resize",upd); vv.addEventListener("scroll",upd); upd();
	}
	/* One handler for everything that must happen on a visibility change:
	   push what's pending when leaving, and on return roll the week over first
	   (so the pull's guards run against the final screen) and then pull. */
	document.addEventListener("visibilitychange",()=>{
		if(document.visibilityState!=="visible"){
			if(CloudDirty() && !PushBackedOff()) CloudSave(true);
			return;
		}
		// coming back to the PWA after midnight / days later must not leave you in the past
		if(state.current!==MondayOf(TodayISO())){ GoToThisWeek(); Render(); }
		CloudPull({quiet:true});          // ← the fix: no need to close and reopen any more
	});
	// iOS can restore a frozen PWA without a visibilitychange; pageshow covers it
	window.addEventListener("pageshow",e=>{ if(e && e.persisted) CloudPull({quiet:true}); });
	/* Safety net for "both phones open on the kitchen counter": poll while the
	   app is actually on screen. Unauthenticated reads are 60/h per IP and two
	   phones share one home router, so throttle hard when there is no token. */
	let _lastNoTokenPull=0;
	setInterval(()=>{
		if(document.visibilityState!=="visible" || navigator.onLine===false || _cloudBusy) return;
		if(!GhToken()){
			if(Date.now()-_lastNoTokenPull<300000) return;
			_lastNoTokenPull=Date.now();
		}
		CloudPull({quiet:true});
	},60000);
	/* Offline: best-effort SW registration. Silently skipped on file://,
	   unsupported browsers, or when sw.js is not deployed next to the app. */
	if("serviceWorker" in navigator){
		try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
	}
})();
</script>
