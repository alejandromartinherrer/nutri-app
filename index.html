/* ============================ SURPRISE GENERATOR ============================ */
function Surprise(){
	// snapshot BEFORE filling: rolling the dice used to be a one-way door — the
	// only way back was emptying the whole week, manual work included
	_surpriseBak=JSON.stringify(CurWeek());
	const wk=CurWeek();
	const byCourse = c=>state.catalog.filter(x=>x.course===c);
	const pri = byCourse("primero"), seg=byCourse("segundo"), cen=byCourse("cena");
	// inventory keyword set for prioritisation
	const invItems=[...state.inventory.frigo,...state.inventory.conge].filter(i=>i.qty>0);
	// both sides in singular: «Calabacines» in the fridge is the calabacín of the cream
	const invTokens = invItems.map(i=>({id:i.id,toks:Tokens(i.name).map(Singular),pri:InvUrgent(i)}));
	function invMatch(dish){
		// the dish side counts its INGREDIENTS only: with Tokens, a generic "Verduras"
		// bag in the freezer matched every «… con verduras» and chose the dish (hot
		// stews in July, the same cream every Tuesday)
		// Two passes: the dish NAME first, its group only as a last resort. With one
		// pass, «Tacos de lechuga con pavo» (group Pollo) took any «Pollo» in the
		// fridge before the «Filetes de pavo» it is made of. Within a pass, what
		// expires first wins (it carries the +2 below).
		// The group only serves a GENERIC product ("Pescado", "Pollo"), every one of
		// its words a word of the group: «Carne picada» is no carpaccio and «Palitos
		// de pescado» are not 24 fish dishes.
		const pasada=(toks,todas)=>{ let first=null;
			for(const it of invTokens) if(todas ? it.toks.length&&it.toks.every(t=>toks.has(t)) : it.toks.some(t=>toks.has(t))){
				if(it.pri) return it; if(!first) first=it; }
			return first; };
		const sing=t=>new Set([...t].map(Singular));
		return pasada(sing(MainToks(dish.name)),false) || pasada(sing(MainToks(dish.tipo||"")),true);
	}
	function Echoes(dish,avoid){
		if(!avoid) return false;
		// compare FAMILIES, not groups: Pasta and "Arroz y cereales" are different
		// groups but the same family, and "Risotto de calabaza · Pad thai" is still
		// starch on starch. TipoFamily already exists for the colour dots.
		if(avoid.tipo && dish.tipo){
			const fa=TipoFamily(dish.tipo), fb=TipoFamily(avoid.tipo);
			if(dish.tipo===avoid.tipo || (fa&&fb&&fa===fb)) return true;
		}
		if(avoid.toks && avoid.toks.size){
			for(const t of MainToks(dish.name)) if(avoid.toks.has(t)) return true; // mismo ingrediente
		}
		return false;
	}
	function pickFor(pool,usedNames,prevTipo,avoid,cap,bonus){
		if(!pool.length) return null;
		const cand=pool.filter(x=>!usedNames.has(x.name.toLowerCase()));
		let base=cand.length?cand:pool;
		// Two hard rules, not bonuses: the pantry bonus below is worth +3/+5 and
		// would happily serve "berenjena rellena · berenjena rellena" every day the
		// fridge has an aubergine. (1) no echo inside the same meal; (2) no food
		// group more than CAP_TIPO times per week in the SAME course — with a
		// prioritised pantry the 2nd course used to be chicken 89% of the time.
		const noEcho=x=>!Echoes(x,avoid);
		const bajoTope=x=>{
			if(!cap) return true;
			for(const k of clavesDe(x.name,x.tipo)) if((cap.counts.get(k)||0)>=cap.max) return false;
			return true;
		};
		// give up the weekly cap before the same-meal rule: repeating a group across
		// the week is milder than serving the same thing twice in one sitting
		for(const opcion of [base.filter(x=>noEcho(x)&&bajoTope(x)), base.filter(noEcho), base.filter(bajoTope)]){
			if(opcion.length){ base=opcion; break; }
		}
		// score: inventory match (+3, +2 extra if priority), different tipo from prev (+1), small noise
		let best=null,bestScore=-1;
		base.forEach(x=>{
			let sc=Math.random()*0.9;
			const im=invMatch(x);
			if(im){sc+=3; if(im.pri) sc+=2}
			if(prevTipo && x.tipo && x.tipo!==prevTipo) sc+=1;
			if(bonus) sc+=bonus(x);                     // plan: season + oily fish
			if(sc>bestScore){bestScore=sc;best=x}
		});
		return best;
	}
	const usedComida=new Set(), usedCena=new Set();
	/* How many times each MAIN INGREDIENT has been used per course this week.
	   Counting the food group instead does not work: chicken lives under Pollo,
	   Pasta, Arroz, Ensaladas and Sopas, so capping "Pollo" only pushes the +5
	   pantry bonus onto "Pad thai de pollo" — measured, the plate still had chicken
	   73% of the time while the label said 29%. A Map, not an object: tipo/name
	   tokens are user text and "__proto__" as a key silently broke the counter. */
	const topePri=new Map(), topeSeg=new Map(), topeCena=new Map();
	const cap=t=>({counts:t,max:CAP_TIPO});
	/* Two kinds of key in the same counter: the main ingredients, and "tipo:<group>".
	   Neither alone is enough — the ingredient misses the egg dinners ("Tortilla de
	   calabacín" never says huevo, and "tortilla" is cooking vocabulary), the group
	   misses the chicken filed under Pasta or Arroz. The tipo is user-editable free
	   text, so it is trimmed and lower-cased: untrimmed, "Pollo"/"pollo "/"Pollo"
	   were three separate counters and the cap silently tripled. */
	const tipoKey=t=>"tipo:"+String(t||"").trim().toLowerCase();
	const clavesDe=(name,tipo)=>{ const k=[...MainToks(name)]; if(tipo) k.push(tipoKey(tipo)); return k; };
	const anota=(t,name,tipo)=>{ if(name) clavesDe(name,tipo).forEach(k=>t.set(k,(t.get(k)||0)+1)); };
	// count what is ALREADY planned by hand: the cap is about the week you end up
	// with, not only about the holes «Sorpréndeme» happens to fill
	const _m0=state.members[0]&&state.members[0].id;
	if(_m0) wk.days.forEach(d=>{
		const c=d.slots.Comida&&d.slots.Comida[_m0], x=d.slots.Cena&&d.slots.Cena[_m0];
		if(c&&c.dish){ const p=c.dish.split(SEP).map(t=>t.trim());
			anota(topePri,p[0],DishTipo(p[0])); if(p[1]) anota(topeSeg,p[1],DishTipo(p[1])); }
		if(x&&x.dish) anota(topeCena,x.dish,DishTipo(x.dish));
	});
	let prevCT=null, prevNT=null;
	let filled=0;
	/* PLAN MODE: every hole is filled from the options the nutritionist gives for
	   THAT day and meal (plus same-group swaps), never from the whole catalog. The
	   same rules still apply inside those options: pantry first, no echo in a meal,
	   weekly cap per ingredient. Oily fish lands on exactly 2 a week when the holes allow it,
	   and the season decides between cold soups/salads and creams/stews. */
	const planOn=PlanActivo();
	const byName=new Map(state.catalog.map(c=>[c.name.trim().toLowerCase(),c]));
	const frio=TemporadaFria(wk.monday);
	/* the plan's weekly targets are the ADULTS' (PlanCumplimiento counts «Nosotros»):
	   an oily fish in a lunch only Noah and Iria eat does not count towards them.
	   Counting it spent the 2 oily fish on the kids whenever the adults ate out */
	const _ad=state.members.some(m=>m.id==="nosotros")?"nosotros":_m0;
	const adultosComen=slot=>!!(slot&&_ad&&slot[_ad]&&!slot[_ad].away);
	let azules=0;
	if(planOn&&_ad) wk.days.forEach(d=>["Comida","Cena"].forEach(s=>{
		const c=d.slots[s]&&d.slots[s][_ad]; if(c&&c.dish&&!c.away&&c.dish.split(SEP).some(p=>EsAzul(p.trim()))) azules++;
	}));
	const planPool=names=>(names||[]).map(n=>byName.get(n.trim().toLowerCase())).filter(Boolean);
	const temporada=(sp,x)=>((frio?sp.frio:sp.calor)||[]).indexOf(x.name)>=0?1.2:0;
	// who eats a hole: whoever is not out, minus Noah and Iria at school on weekday
	// lunches. A lunch nobody eats (adults out, kids at school) was filled anyway,
	// counted in the toast and, in the look-ahead, kept its cap booking all week
	const colegio=(dow,s)=>s==="Comida"&&dow<5&&NinosCole();
	const comen=(slot,dow,s)=>state.members.filter(m=>!slot[m.id].away&&!(colegio(dow,s)&&m.id!=="nosotros"));
	const huecoVacio=(slot,dow,s)=>!state.members.some(m=>slot[m.id].dish) && comen(slot,dow,s).length>0;
	/* Look ahead once, before filling (same "empty hole" test as fillSlot):
	   - huecosAzul: the course-holes THE ADULTS EAT where an oily fish is among the
	     in-season best, in filling order. Oily fish is neutral while there are holes
	     to spare and pushed (+2.5) only when the remaining holes are just enough to
	     reach 2; a third one is pushed away (-1). A flat +1 to the first oily fish
	     made Monday dinner oily 300/300 and most weeks ended with 3. When the season
	     alone cannot reach 2 (winter, with a white fish already fixed on Monday
	     night or Thursday: 1 oily fish in 100/100 weeks) out-of-season options join.
	   - reservas: a key that EVERY option of a hole shares (chicken on Sunday night,
	     turkey on Friday) is booked in the weekly cap up front, so earlier holes do
	     not use up the cap that hole cannot avoid. Each hole releases its own
	     booking right before picking. Ingredients only, never "tipo:" keys. */
	const huecosTop=[], huecosAny=[], orden=new Map(), reservas=new Map();
	if(planOn) wk.days.forEach((d,i)=>["Comida","Cena"].forEach(s=>{
		if(!d.slots[s]||!huecoVacio(d.slots[s],i,s)) return;
		const sp=PlanSlot(i,s); if(!sp||sp.hid==="libre") return;
		const paraAdultos=adultosComen(d.slots[s]);
		[["pri",sp.pri],["seg",sp.seg]].forEach(([k,names])=>{
			const pool=planPool(names); if(!pool.length) return;
			orden.set(i+"|"+s+"|"+k,orden.size);
			const top=Math.max(...pool.map(x=>temporada(sp,x)));
			// a hole the pantry will take anyway (bacalao that expires on Thursday: its
			// +3/+5 beats the oily fish even with the +2.5 push) is not a hole for it: the
			// push has to go to one that can take it, earlier or later in the week
			const dsp=x=>{ const im=invMatch(x); return im?(im.pri?5:3):0; };
			const az=pool.filter(x=>EsAzul(x.name)), no=pool.filter(x=>!EsAzul(x.name));
			const tomada=az.length&&no.length&&Math.max(...no.map(x=>dsp(x)+temporada(sp,x)))>Math.max(...az.map(x=>dsp(x)+temporada(sp,x)))+2.5;
			if(paraAdultos && az.length && !tomada){
				huecosAny.push(i+"|"+s+"|"+k);
				if(az.some(x=>temporada(sp,x)===top)) huecosTop.push(i+"|"+s+"|"+k);
			}
			let comun=null; pool.forEach(x=>{ const t=MainToks(x.name); comun=comun?new Set([...comun].filter(y=>t.has(y))):t; });
			if(comun&&comun.size){ const tb=s==="Comida"?(k==="pri"?topePri:topeSeg):topeCena;
				comun.forEach(y=>tb.set(y,(tb.get(y)||0)+1)); reservas.set(i+"|"+s+"|"+k,[tb,[...comun]]); }
		});
	}));
	const libera=key=>{ const r=reservas.get(key); if(!r) return; r[1].forEach(y=>r[0].set(y,r[0].get(y)-1)); reservas.delete(key); };
	// holes of a list still ahead (this one included), in filling order
	const quedan=(lista,key)=>{ const o=orden.get(key); return lista.filter(k=>orden.get(k)>=o).length; };
	const planBonus=(sp,key)=>x=>{
		let b=temporada(sp,x);
		if(EsAzul(x.name)){
			const falta=2-azules;
			if(falta<=0) b-=1;
			else if(orden.has(key)){
				// decided at each hole, not once: a prioritised hake in the fridge takes
				// Monday night, and then the season's holes alone no longer reach 2
				const L=quedan(huecosTop,key)>=falta?huecosTop:huecosAny;
				if(L.indexOf(key)>=0 && falta>=quedan(L,key)) b+=2.5;
			}
		}
		return b;
	};
	// one "used" set for lunch AND dinner in plan mode: the warm-season Monday
	// lunch and Tuesday dinner both lean on salmorejo, and came out the same half
	// the weeks (pickFor falls back to the whole pool if everything is used)
	const usedPlan=new Set();
	function PlanPick(dow,slotName){
		const sp=PlanSlot(dow,slotName); if(!sp) return null;
		if(sp.hid==="libre") return {name:PLAN_LIBRE, im:null};
		const esComida=slotName==="Comida";
		const used=usedPlan;
		const kp=dow+"|"+slotName+"|pri", ks=dow+"|"+slotName+"|seg";
		const P=planPool(sp.pri), S=planPool(sp.seg);
		let p=null, s=null;
		if(P.length){
			libera(kp);
			p=pickFor(P,used,null,null,cap(esComida?topePri:topeCena),planBonus(sp,kp));
			if(p){ used.add(p.name.toLowerCase()); anota(esComida?topePri:topeCena,p.name,p.tipo); }
		}
		if(S.length){
			libera(ks);
			s=pickFor(S,used,p?p.tipo:null,p?{tipo:p.tipo,toks:MainToks(p.name)}:null,cap(esComida?topeSeg:topeCena),planBonus(sp,ks));
			if(s){ used.add(s.name.toLowerCase()); anota(esComida?topeSeg:topeCena,s.name,s.tipo); }
		}
		const chosen=[p,s].filter(Boolean);
		if(!chosen.length) return null;
		if(adultosComen(wk.days[dow].slots[slotName])) chosen.forEach(x=>{ if(EsAzul(x.name)) azules++; });
		const im=(s&&invMatch(s))||(p&&invMatch(p))||null;
		return {name:chosen.map(x=>x.name).join(SEP), im};
	}
	wk.days.forEach((d,i)=>{
		if(planOn){
			fillSlot(d,"Comida",()=>PlanPick(i,"Comida"),i);
			fillSlot(d,"Cena",()=>PlanPick(i,"Cena"),i);
			return;
		}
		// COMIDA = 1º + 2º (family)
		// what today's meal has already used, so the day doesn't echo itself
		let dayToks=new Set(), dayTipo=null;
		fillSlot(d,"Comida",()=>{
			const p=pickFor(pri,usedComida,prevCT,null,cap(topePri));
			if(p){usedComida.add(p.name.toLowerCase()); prevCT=p.tipo; anota(topePri,p.name,p.tipo);
				MainToks(p.name).forEach(t=>dayToks.add(t)); dayTipo=p.tipo;}
			// the 2nd course must not repeat the 1st's group or its main ingredient
			const s=pickFor(seg,usedComida,p?p.tipo:prevCT,{tipo:dayTipo,toks:dayToks},cap(topeSeg));
			if(s){usedComida.add(s.name.toLowerCase()); anota(topeSeg,s.name,s.tipo);
				MainToks(s.name).forEach(t=>dayToks.add(t));}
			const chosen=[p,s].filter(Boolean);
			if(!chosen.length) return null;
			const im=(s&&invMatch(s))||(p&&invMatch(p))||null;
			return {name:chosen.map(x=>x.name).join(SEP), im};
		},i);
		// CENA – family (single dish); avoids repeating today's ingredients, but may
		// share a food group with lunch (a hard tipo rule here left too little to pick)
		fillSlot(d,"Cena",()=>{
			const dish=pickFor(cen,usedCena,prevNT,{toks:dayToks},cap(topeCena));
			if(!dish) return null; usedCena.add(dish.name.toLowerCase()); prevNT=dish.tipo; anota(topeCena,dish.name,dish.tipo);
			MainToks(dish.name).forEach(t=>dayToks.add(t));
			return {name:dish.name, im:invMatch(dish)};
		},i);
	});
	// «Sorpréndeme» pone el MISMO menú a toda la familia. Antes sobrescribía
	// la comida de Noah con un plato de la categoría «Comidas Noah», así que
	// la semana salía con dos menús distintos. Esa categoría sigue existiendo
	// en el recetario y en el selector para ponerla a mano cuando se quiera.

	function fillSlot(d,slotName,producer,dow){
		const slot=d.slots[slotName];
		// never overwrite manual work: a dish anywhere in the slot means hands off.
		// "Fuera de casa" only blocks the slot when EVERYONE is out: before, one kid
		// eating at a friend's left the whole family without dinner planned.
		if(state.members.some(m=>slot[m.id].dish)) return;
		const cole=colegio(dow,slotName);
		if(!comen(slot,dow,slotName).length){           // nobody at home for it
			if(cole) state.members.forEach(m=>{ if(m.id!=="nosotros"&&!slot[m.id].away) slot[m.id]={dish:"",invId:null,away:true}; });
			return;
		}
		const r=producer();           // {name, im} or null
		if(!r) return;
		state.members.forEach((m,idx)=>{
			if(slot[m.id].away) return;                            // whoever is out stays out
			if(cole && m.id!=="nosotros"){ slot[m.id]={dish:"",invId:null,away:true}; return; }
			slot[m.id]={dish:r.name,invId:(idx===0&&r.im)?r.im.id:null,away:false};
		});
		filled++;
	}
	Save(); Render(); _surpriseTras=JSON.stringify(CurWeek());
	if(!filled){ Toast("No había huecos vacíos que rellenar"); return; }
	ToastAction(planOn?`Semana del plan: ${filled} comidas ✨`:`Rellenadas ${filled} comidas ✨`,"Deshacer",UndoSurprise);
}
let _surpriseBak=null, _surpriseTras=null;      // the week right before and right after the last roll
/* Undo only what the roll did and nobody has touched since, meal by meal. Putting
   back the whole saved week wiped a dish put by hand after rolling (and the lines
   ticked in the shopping list), with 🎲 and with «Deshacer». Returns the meals undone. */
function DeshacerTirada(soloVisible){
	if(!_surpriseBak||!_surpriseTras) return 0;
	let antes, tras; try{ antes=JSON.parse(_surpriseBak); tras=JSON.parse(_surpriseTras); }catch(e){ return 0; }
	// «Deshacer» works on the rolled week wherever you are; 🎲 re-rolls the week on
	// screen, so it only undoes when that is the rolled one
	const wk=state.weeks[antes.monday]; if(!wk||(soloVisible&&antes.monday!==state.current)) return 0;
	const J=JSON.stringify; let n=0;
	wk.days.forEach((d,i)=>["Comida","Cena"].forEach(s=>{
		const a=antes.days[i]&&antes.days[i].slots[s], t=tras.days[i]&&tras.days[i].slots[s], c=d.slots[s];
		if(a&&t&&c && J(c)===J(t) && J(a)!==J(t)){ d.slots[s]=JSON.parse(J(a)); n++; }
	}));
	return n;
}
function UndoSurprise(){
	if(!_surpriseBak) return Toast("Nada que deshacer");
	const n=DeshacerTirada(false); _surpriseBak=_surpriseTras=null;
	if(!n) return Toast("Nada que deshacer: ya has cambiado esas comidas");
	Save(); Render(); Toast("Semana como estaba");
}
/* "otra vez": undo the previous roll and roll again, so you can keep trying */
function SurpriseAgain(){
	DeshacerTirada(true);
	Surprise();
}
function Tokens(s){
	return (s||"").toLowerCase()
		.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
		.replace(/[^a-z0-9 ]/g," ").split(/\s+/)
		.filter(w=>w.length>3 && !["con","las","los","una","del","sin","pan"].includes(w));
}

/* A dish's main ingredient = its name minus the cooking vocabulary. Measured the
   alternative first and it does not work: judging by how often a word appears
   ("generic = in >=5% of dishes") calls "pollo" generic, because it is in 17% of
   them. Nor does the food group: chicken is spread across Ensaladas / Sopas /
   Pasta / Arroz / Pollo, so capping the LABEL just re-routes to the chicken filed
   under another one ("Pad thai de pollo" is tipo Pasta). Ways of cooking, by
   contrast, are a small closed set that does not grow with the recipe book. */
function MainToks(name){ return new Set(Tokens(name).filter(t=>!COCINA.has(t))); }

/* Most times one food group may repeat per course in a week. Measured 2 vs 3 over
   15 weeks with a prioritised pantry: 2 beats 3 on every axis — the top 2nd-course
   group drops 43%→29% (4→6 groups) and it even uses MORE of the pantry (66%→71%),
   because it spreads across several items instead of hammering one. */
const CAP_TIPO = 2;

/* Cooking vocabulary: ways of cooking, formats and fillers. Whatever is left of a
   dish name is its actual ingredient, which is what «Sorpréndeme» must not repeat
   twice in the same meal. Closed set: it does not grow with the recipe book. */
const COCINA = new Set(("horno plancha parrilla brasa vapor papillote wok sarten cazuela olla " +
	"ensalada ensaladilla crema cremoso cremosa sopa caldo guiso guisado guisada guisadas " +
	"salsa salteado salteada salteados tortilla revuelto bowl tosta wrap quesadilla burrito " +
	"asado asada asados asadas relleno rellena rellenos rellenas gratinado gratinada " +
	"marinado marinada crujiente ligero ligera casero casera casa fresco fresca integral " +
	"mini fingers bastones palitos trozos lomos filete filetes rodajas " +
	"verduras verdura hierbas especias hortalizas guarnicion " +
	"sobre cama templada templado").split(" "));        // «… al horno sobre cama de verduras», «Ensalada templada de …»

/* ============================ PLAN DEL NUTRICIONISTA ============================
   «Planificación nutricional — Alex y Jeza», Escuela de Salud VIVE (12-ago-2026).
   La estrategia del propio plan es periodizar los hidratos dentro de UNA cocina
   común: la base se cocina una vez para toda la casa y lo que cambia es la ración
   de hidratos de cada adulto según haya entrenado ese día:
   - día de entreno: el bloque fuerte de hidrato va en la comida POSTERIOR al
     entreno (entreno de mañana → comida; de tarde → cena);
   - día de descanso: fuera arroz, pasta, patata y pan de comida y cena.
   Las raciones de proteína y las excepciones (pan en el salmorejo, legumbre del
   miércoles, paella del sábado, patata del domingo) son las del plan tal cual. El
   hidrato NO está copiado día a día: es una regla (PlanHidrato), así que si cambian
   los días de entreno las raciones se recolocan solas. Con los entrenos del plan
   reproduce sus tablas celda a celda (hay test que lo fija). */
const PLAN_LIBRE = "Libre";

function PlanPerfil(id){ return PLAN_VIVE.perfiles.find(p=>p.id===id)||null; }
function PlanSlot(dow,slot){ const d=PLAN_VIVE.semana[dow]; return (d&&d[slot])||null; }
function EsLibre(dish){ return !!dish && Norm(dish)===Norm(PLAN_LIBRE); }
/* Only what the family changes lives in state (and syncs between phones): who
   trains which day and when, Jeza's night shifts, whether the kids have school
   lunch, and whether «Sorpréndeme» follows the plan. The rest is the nutritionist's
   document, in code. Never overwrites a choice already made: an emptied training
   week stays empty. */
function EnsurePlanState(s){
	if(!s||typeof s!=="object") return s;
	if(!s.plan||typeof s.plan!=="object"||Array.isArray(s.plan)) s.plan={};
	const p=s.plan;
	if(typeof p.activo!=="boolean") p.activo=true;
	if(!p.entrenos||typeof p.entrenos!=="object") p.entrenos={};
	if(!p.noches||typeof p.noches!=="object") p.noches={};
	PLAN_VIVE.perfiles.forEach(pf=>{
		if(!p.entrenos[pf.id]||typeof p.entrenos[pf.id]!=="object") p.entrenos[pf.id]=Object.assign({},pf.entrenos);
		if(!Array.isArray(p.noches[pf.id])) p.noches[pf.id]=[];
	});
	if(typeof p.ninosCole!=="boolean") p.ninosCole=false;
	return s;
}
function PlanActivo(){ return !!(state&&state.plan&&state.plan.activo); }
/* the Plan tab's day buttons: rest → morning → evening → rest, and night on/off.
   Each tap stamps THAT day only (see MergePlan) */
function ToggleEntreno(pid,dow){
	EnsurePlanState(state);
	const e=state.plan.entrenos[pid]||(state.plan.entrenos[pid]={});
	const k=String(+dow), cur=e[k], next=!cur?"mañana":(cur==="mañana"?"tarde":null);
	if(next) e[k]=next; else delete e[k];
	StampPlan("e:"+pid+":"+k);
}
function ToggleNoche(pid,dow){
	EnsurePlanState(state);
	const n=state.plan.noches[pid]||(state.plan.noches[pid]=[]);
	const dd=+dow, at=n.indexOf(dd);
	if(at>=0) n.splice(at,1); else { n.push(dd); n.sort((a,b)=>a-b); }
	StampPlan("n:"+pid+":"+dd);
}
/* The plan syncs KEY BY KEY, like the shopping lists (see MergeShopping): each
   person's training on each day ("e:alex:0"), each night shift ("n:jeza:6"),
   «activo» and «ninosCole» carry their own edit time in plan.at. Whole-plan
   last-write-wins lost Jeza's night shifts when Alex changed his training on the
   other phone a few seconds later, and a phone updated from v1.17 uploaded the
   DEFAULT plan over everyone's. Per DAY, not per person: a change made on a phone
   that had not received the other's yet (it happens while one phone is still on
   v1.17) replaced that person's whole week; now it only touches the day tapped.
   EnsurePlanState never stamps: a default value loses to any stamped one. */
function StampPlan(k){ const p=state&&state.plan; if(!p||typeof p!=="object") return; if(!p.at||typeof p.at!=="object") p.at={}; p.at[k]=new Date().toISOString(); }
function PlanValido(p){ return !!p && typeof p==="object" && !Array.isArray(p); }
/* only the plan's own people: a copy with "__proto__" as a person reached
   Object.prototype through PlanPut and every rest day read as "tarde" */
function PlanKeys(pl){
	const ks=["activo","ninosCole"];
	PLAN_VIVE.perfiles.forEach(pf=>{ for(let d=0;d<7;d++){ ks.push("e:"+pf.id+":"+d); ks.push("n:"+pf.id+":"+d); } });
	return ks;
}
/* the value of one key; undefined = this copy does not know that person */
function PlanGet(pl,k){
	if(k==="activo"||k==="ninosCole") return pl[k];
	const [t,id,d]=k.split(":");
	if(t==="e"){ const e=pl.entrenos&&pl.entrenos[id]; if(!e||typeof e!=="object") return undefined; return (e[d]==="mañana"||e[d]==="tarde")?e[d]:null; }
	const n=pl.noches&&pl.noches[id]; return Array.isArray(n)? n.indexOf(+d)>=0 : undefined;
}
function PlanPut(pl,k,v){
	if(k==="activo"||k==="ninosCole"){ pl[k]=v; return; }
	const [t,id,d]=k.split(":");
	if(t==="e"){
		if(!pl.entrenos||typeof pl.entrenos!=="object") pl.entrenos={};
		const e=(pl.entrenos[id]&&typeof pl.entrenos[id]==="object")?pl.entrenos[id]:(pl.entrenos[id]={});
		if(v==="mañana"||v==="tarde") e[d]=v; else delete e[d];
		return;
	}
	if(!pl.noches||typeof pl.noches!=="object") pl.noches={};
	const n=Array.isArray(pl.noches[id])?pl.noches[id]:(pl.noches[id]=[]);
	const i=n.indexOf(+d);
	if(v&&i<0){ n.push(+d); n.sort((a,b)=>a-b); } else if(!v&&i>=0) n.splice(i,1);
}
/* pulls into target.plan every key that source edited more recently; true if any */
function MergePlan(target,source){
	const tp=target&&target.plan, sp=source&&source.plan;
	if(!tp||!sp||tp===sp||typeof tp!=="object"||typeof sp!=="object") return false;
	if(!tp.at||typeof tp.at!=="object") tp.at={};
	const ta=tp.at, sa=(sp.at&&typeof sp.at==="object")?sp.at:{};
	let changed=false;
	new Set(PlanKeys(tp).concat(PlanKeys(sp))).forEach(k=>{
		if(String(sa[k]||"")>String(ta[k]||"")){
			const v=PlanGet(sp,k);
			if(v!==undefined){ PlanPut(tp,k,v); ta[k]=sa[k]; changed=true; }
		}
	});
	return changed;
}
function NinosCole(){ return !!(state&&state.plan&&state.plan.ninosCole); }
function EntrenoDe(pid,dow){
	const e=state&&state.plan&&state.plan.entrenos&&state.plan.entrenos[pid];
	const v=e&&e[String(dow)];
	return (v==="mañana"||v==="tarde")?v:null;
}
function NocheDe(pid,dow){
	const n=state&&state.plan&&state.plan.noches&&state.plan.noches[pid];
	return Array.isArray(n)&&n.indexOf(dow)>=0;
}
function PostEntrenoSlot(t){ return t==="mañana"?"Comida":"Cena"; }
/* THE rule. tipo: post (le toca su ración de hidrato), no (descanso: sin hidrato
   denso), incluido (el plato ya es el hidrato: legumbre, paella), fijo (la patata
   del domingo, cantidad del plan), libre. */
function PlanHidrato(pid,dow,slot){
	const sp=PlanSlot(dow,slot), pf=PlanPerfil(pid);
	if(!sp||!pf) return null;
	if(sp.hid==="libre") return {tipo:"libre"};
	if(sp.hid==="incluido") return {tipo:"incluido"};
	const t=EntrenoDe(pid,dow);
	if(t && PostEntrenoSlot(t)===slot) return {tipo:"post"};
	if(sp.hid==="fijo") return {tipo:"fijo"};
	return {tipo:"no"};
}
function PlanHidratoTexto(pf,sp){ return pf.hidratoPor[(sp&&sp.carb)||"patata"]||pf.hidratoPor.patata; }
/* the carb side of whoever trained, for the shopping list: the base recipe is
   carb-free on purpose, so without this the post-workout potato never got bought */
function PlanHidratosCompra(){
	if(!PlanActivo()) return [];
	const wk=CurWeek(), out=[];
	wk.days.forEach((d,dow)=>PLAN_VIVE.perfiles.forEach(pf=>{
		const t=EntrenoDe(pf.id,dow); if(!t) return;
		const slot=PostEntrenoSlot(t);
		const c=(d.slots[slot]||{}).nosotros;
		if(!c||!c.dish||c.away||EsLibre(c.dish)) return;           // not eating that meal at home
		// a dish that already brings its carb (legumes, rice, potato…) needs no side
		const info=PlanRacionInfo(pf,dow,slot,c.dish);
		if(!info||info.hid!=="post") return;
		const sp=PlanSlot(dow,slot)||{};

/* weekly checks the plan and its infographics ask for, on what the adults eat */
const PESCADO_AZUL=new Set(["salmon","atun","bonito","caballa","sardina","sardinas","sardinillas","boqueron","boquerones","anchoa","anchoas","trucha","emperador","espada","salmonete","arenque","jurel","ventresca"]);
const PESCADO_BLANCO=new Set(["merluza","bacalao","lubina","dorada","rape","gallo","mero","besugo","lenguado","rodaballo","abadejo","pescadilla","pescado","cabracho","cazon","rosada","raya"]);

const AZUL_SIN_NOMBRE=new Set(["ensalada empedrada"]);
function EsAzul(name){ return Tokens(name).some(t=>PESCADO_AZUL.has(t)) || AZUL_SIN_NOMBRE.has((name||"").trim().toLowerCase()); }
function PlanCumplimiento(){

		r.comidas++;
		let pes=false,az=false,leg=false,roja=false;
		c.dish.split(SEP).map(x=>x.trim()).filter(Boolean).forEach(p=>{
			const tk=Tokens(p), tp=DishTipo(p);
			if(tp==="Pescado"||tk.some(x=>PESCADO_BLANCO.has(x))||EsAzul(p)) pes=true;
			if(EsAzul(p)) az=true;                          // the same test «Sorpréndeme» counts with

/* Portions follow the dish ACTUALLY planned. The slot's own portions only apply
   when the dish is one of the slot's options; otherwise they are worked out from
   the dish: "200 g" of the plan's chicken breast means nothing next to a plate of
   beans someone put there by hand. */
const PLAN_DENSOS=new Set(["arroz","pasta","espaguetis","espagueti","macarrones","fideos","noodles","cuscus","patata","patatas",
	"gnocchi","lasana","pizza","boniato","quinoa","tostada","tostadas","picatostes","burrito","wrap","quesadilla","tortillas","risotto","paella"]);
/* A dense carb in the dish, read from its RECIPE when there is one: the name
   misled both ways («Pizza con base de coliflor» has no dough, «Poke de salmón»
   hides 150 g of rice, «pan» is not even a token). Trace amounts do not count: a
   spoon of flour or breadcrumbs, one small potato in a cream for four, anything
   optional. Without a recipe, the name and the group decide, as before. The
   salmorejo's bread is the plan's own: it serves it on rest days. */
const DENSO_ING=/\b(arroz|pasta|espaguetis?|spaghetti|macarrones|fideos|noodles|tallarines|cuscus|bulgur|quinoa|patatas?|papas|boniatos?|pan|tortillas?|wraps?|pitas?|placas|lasanas?|masa|hojaldre|base de pizza|harina|gnocchi|polenta|tostadas?|biscotes|nachos|arepas?)\b/;
function DensoEnReceta(name){
	const r=RecipeParts(DishRecipe(name)); if(!r) return null;
	const serv=RecipeServings(name)||2;
	const hay=r.items.some(x=>{
		const t=Norm(x);
		if(!DENSO_ING.test(t)||/opcional|rallad|picatoste/.test(t)) return false;
		if(/\b(cda|cdta|cdas|cdtas|cdita|cditas|cucharadas?|cucharaditas?|pizcas?)\b/.test(t)) return false;
		const kg=t.match(/(\d+(?:[.,]\d+)?)\s*kg\b/);
		if(kg) return parseFloat(kg[1].replace(",","."))*1000/serv>=25;
		const g=t.match(/(\d+(?:[.,]\d+)?)\s*(?:g|gr|grs|gramos?)\b/);
		if(g) return parseFloat(g[1].replace(",","."))/serv>=25;               // grams per serving
		const n=t.match(/^\s*(\d+(?:[.,]\d+)?|½|¼|¾)(?:\s*[–-]\s*\d+)?\s+(?:\S+\s+){0,2}?(patatas?|papas|boniatos?|tortillas?|wraps?|pitas?|rebanadas?|panes?|tostadas?|arepas?)\b/);
		if(n) return CantidadValor(n[1])*(/grande/.test(t)?2:/pequen/.test(t)?.5:1)/serv>=.5;
		// another measure ("1 taza de arroz", "1 base de pizza") counts when it is the
		// measure of the carb; "1 cebolla y 1 patata pequeña" is not a potato serving
		if(/^\s*[\d½¼¾]/.test(t)) return DENSO_ING.test(t.split(/\s+/).slice(0,4).join(" "));
		return true;                                                           // "arroz", "tortillas integrales"
	});
	// a pasta or rice dish whose recipe names its carb in a way not listed above
	// ("200 g de fusilli") is still that: the group says so
	if(!hay){ const tp=DishTipo(name); if(tp==="Pasta"||tp==="Arroz y cereales") return true; }
	return hay;
}
function EsDenso(name){
	if(/^salmorejo\b/i.test((name||"").trim())) return false;
	const rec=DensoEnReceta(name); if(rec!==null) return rec;
	const t=DishTipo(name); return t==="Arroz y cereales"||t==="Pasta"||Tokens(name).some(x=>PLAN_DENSOS.has(x));
}
/* the carb IS the dish (pasta, rice, quinoa, pizza…), not a side or a bit of it:
   by group, or among the first two words that are not cooking vocabulary */
function DensoPrincipal(name){
	const t=DishTipo(name); if(t==="Arroz y cereales"||t==="Pasta") return true;
	return [...MainToks(name)].slice(0,2).some(x=>PLAN_DENSOS.has(x));
}
/* a real protein in the dish (group or name): «Merluza al horno con verduras y
   patata» is fish with a potato side, not "mostly carbs" — it was told so, and
   lost its portion, together with 34 other dishes. Ham, bacon or chorizo in a
   pasta or a pizza are seasoning, not the protein of the plate. */
const PLAN_PROTEINAS=new Set(["pollo","pavo","ternera","cerdo","conejo","cordero","solomillo","pechuga","pechugas","contramuslos",
	"muslos","hamburguesa","hamburguesas","albondigas","gambas","langostinos","mejillones","calamares","sepia","pulpo","marisco",
	"huevo","huevos","tofu","tempeh","seitan"]);
function EsProteico(name){
	const t=DishTipo(name);
	if(["Pollo","Carne","Pescado","Marisco","Huevos"].indexOf(t)>=0) return true;
	return Tokens(name).some(x=>PLAN_PROTEINAS.has(x)||PESCADO_AZUL.has(x)||PESCADO_BLANCO.has(x)||CARNE_ROJA.has(x));

function PlanSlotTiene(sp,name){ const k=(name||"").trim().toLowerCase(); return (sp.pri||[]).concat(sp.seg||[]).some(n=>n.trim().toLowerCase()===k); }
function PlanRacionInfo(pf,dow,slot,dish){
	const sp=PlanSlot(dow,slot), h=PlanHidrato(pf.id,dow,slot);
	if(!sp||!h) return null;
	// the free dinner is free whatever gets put there: a pizza by hand used to
	// get "⚠ descanso: sin pan" in the day plan while the week view said nothing
	if(h.tipo==="libre") return {hid:"libre",rac:""};
	const parts=(dish||"").split(SEP).map(x=>x.trim()).filter(Boolean);
	const enPlan=!parts.length||parts.every(p=>PlanSlotTiene(sp,p));
	if(enPlan){
		// portions of the option actually chosen (racPor: egg OR chicken, not both);
		// {base,noche}: the app already knows whether that person works that night
		const k1=parts.length===1?parts[0].toLowerCase():"";

		return {rac:r, hid:h.tipo, txt:sp.hidCorto};
	}
	const tipos=parts.map(DishTipo);
	// the protein portion also when only the NAME says it («Paella de pollo» is
	// filed under rice and got "plato normal"); eggs are counted in eggs
	const protTok=parts.flatMap(p=>Tokens(p).filter(x=>PLAN_PROTEINAS.has(x)||PESCADO_AZUL.has(x)||PESCADO_BLANCO.has(x)||CARNE_ROJA.has(x)));
	const huevos=pf.huevos+(pf.huevos>1?" huevos":" huevo");

		: tipos.indexOf("Huevos")>=0 ? huevos
		: protTok.length ? (protTok.every(x=>/^huevos?$/.test(x)) ? huevos : (slot==="Comida"?pf.protComida:pf.protCena))

		if(conHidrato) return {rac, hid:"incluido", txt:"el plato ya trae su hidrato"};
		// a plate that IS pasta or rice, with no protein: "without the pasta" can't be

		if(parts.every(p=>EsDenso(p)&&DensoPrincipal(p)&&!EsProteico(p))) return {rac:"", hid:"aviso", txt:"⚠ descanso: este plato es sobre todo hidrato; el plan pide proteína + verdura (cámbialo o toma poca cantidad)"};
		return {rac, hid:"aviso", txt:AVISO_DESCANSO};

/* seasonal preference: cold soups and legume salads in the warm months, creams and
   hot legumes from October to April (the plan treats them as interchangeable) */
function TemporadaFria(iso){ const m=new Date((iso||TodayISO())+"T00:00:00").getMonth(); return m>=9||m<=3; }

/* ============================ CLOUD SYNC (GitHub) ============================
   "Guardar" commits data/sync.json to the app's own repo via the GitHub
   Contents API; on boot (online, non-blocking) the newest copy wins by
   updatedAt. Offline-first is untouched: sync is a layer on top, the app
   never waits for the network. The fine-grained PAT lives ONLY in its own
   localStorage key — never inside state, exports or the synced file. */
/* data lives on its own branch: saves don't rebuild Pages nor pollute main */
const GH_OWNER="alejandromartinherrer", GH_REPO="nutri-app", GH_BRANCH="data";
const GH_SYNC_PATH="data/sync.json";
const GH_TOKEN_KEY="nutri_gh_token";

function GhToken(){ try{return localStorage.getItem(GH_TOKEN_KEY)||""}catch(e){return ""} }
function SetGhToken(t){ try{ if(t) localStorage.setItem(GH_TOKEN_KEY,t); else localStorage.removeItem(GH_TOKEN_KEY); }catch(e){} }

/* UTF-8-safe base64 (chunked: state JSON can exceed the arg-spread limit) */
function B64EncodeUtf8(str){
	const bytes=new TextEncoder().encode(str); let bin="";
	for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
	return btoa(bin);
}
function B64DecodeUtf8(b64){
	const bin=atob((b64||"").replace(/\s/g,"")); const bytes=new Uint8Array(bin.length);
	for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
	return new TextDecoder().decode(bytes);
}

/* pure & testable: what gets synced. catalog is reference data (rebuilt from
   SEED + userDishes on every device) — syncing it would freeze updates. */
function BuildSyncPayload(s){
	const st={}; Object.keys(s).forEach(k=>{ if(k!=="catalog") st[k]=s[k]; });
	return {app:"nutri-app", schema:SCHEMA_VERSION, savedAt:st.updatedAt||null, state:st};
}

/* Recipes and deletions are CUMULATIVE, not week-scoped: unlike the weekly plan
   (last-write-wins is fine there), a dish added on one device must never be
   dropped just because another device saved a newer whole-state. Union them. */
function MergeRecipeBook(target, source){
	if(!source) return target;
	const byName=new Map();
	(source.userDishes||[]).forEach(d=>{ if(d&&d.name) byName.set(d.name.trim().toLowerCase(),d); });
	(target.userDishes||[]).forEach(d=>{ if(d&&d.name) byName.set(d.name.trim().toLowerCase(),d); }); // same name: keep target's version
	target.userDishes=[...byName.values()];
	target.hidden=[...new Set([...(target.hidden||[]),...(source.hidden||[])])];
	return target;
}
function RecipeBookSize(s){ return ((s&&s.userDishes)||[]).length + ((s&&s.hidden)||[]).length; }

/* ---- shared shopping lists: union with tombstones (v1.14.0) --------------
   «Otros» and «Fruta y verdura» are the two lists both phones edit at the same
   time, and until now they rode on plain whole-state last-write-wins: whoever
   uploaded last silently wiped the other's additions. Unioning them by id fixes
   that but BREAKS deleting — the union re-adds the item on the next pull *and*
   on the next push — so every deletion is recorded as a tombstone that travels
   in the sync payload. Additive and backward compatible: an old copy simply has
   no graveyard, and ValidState never required one. */
const GRAVE_DAYS=90;
function Stamp(o){ if(o) o.updatedAt=new Date().toISOString(); return o; }
function Grave(){ return state.graveyard||(state.graveyard={}); }
function Bury(id){ if(id) Grave()[id]=new Date().toISOString(); }
function Unbury(id){ if(id&&state.graveyard) delete state.graveyard[id]; }
function MergeGraves(a,b){
	const out={};
	Object.keys(a||{}).forEach(id=>out[id]=a[id]);
	Object.keys(b||{}).forEach(id=>{ if(!out[id]||b[id]>out[id]) out[id]=b[id]; });
	return out;
}
/* keep the graveyard bounded; after this long both phones have long converged */
function PruneGraveyard(grave,nowMs,days){
	const cut=new Date(nowMs-(days||GRAVE_DAYS)*86400000).toISOString(), out={};
	Object.keys(grave||{}).forEach(id=>{ if(grave[id]>cut) out[id]=grave[id]; });
	return out;
}
/* Union two copies of one list by id, newest edit per item wins.
   A tombstone is TERMINAL: an id that was deleted stays deleted however
   recently the other phone touched it. Otherwise ticking «Leche» as bought on a
   copy that had not heard about the delete would resurrect it — and clear the
   tombstone, so the delete could never propagate again. Re-adding something on
   purpose mints a fresh id, so nothing intentional is ever lost this way. */
function MergeList(target,source,grave){
	const by=new Map();
	(source||[]).forEach(it=>{ if(it&&it.id) by.set(it.id,it); });
	(target||[]).forEach(it=>{
		if(!it||!it.id) return;
		const cur=by.get(it.id);
		if(!cur || (it.updatedAt||"")>=(cur.updatedAt||"")) by.set(it.id,it);
	});
	const g=grave||{};
	return [...by.values()].filter(it=>!g[it.id]);
}
/* applied in BOTH directions — when adopting the cloud and before every upload —
   so neither a pull nor a push can drop the other phone's addition. */
function MergeShopping(target,source){
	if(!target||!source) return target;
	const grave=PruneGraveyard(MergeGraves(target.graveyard,source.graveyard),Date.now(),GRAVE_DAYS);
	target.extras=MergeList(target.extras,source.extras,grave);
	target.produce=MergeList(target.produce,source.produce,grave);
	target.graveyard=grave;
	return target;
}
function ShopSig(s){
	return JSON.stringify([(s&&s.extras)||[],(s&&s.produce)||[]]);
}

async function CloudGet(){
	const url=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_SYNC_PATH}?ref=${GH_BRANCH}`;
	const headers={Accept:"application/vnd.github+json"};
	const tok=GhToken(); if(tok) headers.Authorization="Bearer "+tok;
	const r=await fetch(url,{headers,cache:"no-store"});
	if(r.status===404) return {payload:null,sha:null};
	if(!r.ok) throw new Error("HTTP "+r.status);
	const j=await r.json();
	return {payload:JSON.parse(B64DecodeUtf8(j.content)), sha:j.sha};
}

let _cloudBusy=false;
function SetCloudBusy(b){
	_cloudBusy=b;
	const el=document.getElementById("cloudBtn");
	if(el){ el.style.opacity=b?".45":""; el.textContent=b?"⏳":"☁️"; }
}
/* unsaved-changes indicator: edits newer than the last successful upload */
function CloudDirty(){
	return !!(state.updatedAt && (!state.lastSync || state.updatedAt>state.lastSync));
}
/* three distinct states, because "orange dot" used to mean both "pending" and
   "has been failing for three days because the token expired" */
let _cloudFailed=false;
function UpdateCloudDot(){
	const el=document.getElementById("cloudBtn");
	if(!el) return;
	el.classList.remove("dirty","failed","unset");
	if(!GhToken()){ el.classList.add("unset"); el.title="Copia de seguridad sin configurar"; return; }
	if(_cloudFailed){ el.classList.add("failed"); el.title="No se ha podido subir — toca para revisar"; return; }
	if(CloudDirty()){ el.classList.add("dirty"); el.title="Cambios pendientes de subir"; return; }
	el.title="Todo subido";
}
/* auto-sync: quiet upload ~30 s after the last edit (token + online only) */
let _autoSync=null;
/* A dead token used to re-fire a failing PUT on every trigger. Reads are never
   backed off (public repo); only the failing write is throttled. */
let _pushBackoffUntil=0, _pushBackoffMs=0;
function PushBackedOff(){ return Date.now()<_pushBackoffUntil; }
function ScheduleAutoSync(){
	if(!GhToken() || navigator.onLine===false) return;
	clearTimeout(_autoSync);
	_autoSync=setTimeout(()=>{ if(CloudDirty() && !_cloudBusy && !PushBackedOff()) CloudSave(true); },30000);
}
async function CloudSave(auto){
	if(_cloudBusy) return;
	if(!GhToken()){ if(!auto) OpenCloudSettings(); return; }
	SetCloudBusy(true);
	try{
		const {sha,payload}=await CloudGet();               // fresh sha → no lost-update
		// union the cloud's recipe book into ours so we never overwrite a recipe
		// that another device added; persist the recovered ones locally too.
		if(payload&&payload.state){
			const before=RecipeBookSize(state), shopBefore=ShopSig(state);
			MergeRecipeBook(state, payload.state);
			MergeShopping(state, payload.state);   // never PUT over the peer's Otros / fruta
			const gainedPlan=MergePlan(state, payload.state);   // nor over their plan edits
			const gainedBook=RecipeBookSize(state)>before;
			if(gainedBook) RefreshCatalog();
			if(gainedBook || gainedPlan || ShopSig(state)!==shopBefore){ SaveQuiet(); Render(); }
		}
		const body={message:"app: sync "+(state.updatedAt||TodayISO()),
			content:B64EncodeUtf8(JSON.stringify(BuildSyncPayload(state),null,1)), branch:GH_BRANCH};
		if(sha) body.sha=sha;
		const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_SYNC_PATH}`,{
			method:"PUT",
			headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+GhToken(),"Content-Type":"application/json"},
			body:JSON.stringify(body)});
		if(r.status===401||r.status===403) throw {code:"auth"};
		if(r.status===409||r.status===422) throw {code:"conflict"};
		if(!r.ok) throw new Error("HTTP "+r.status);
		state.lastSync=new Date().toISOString(); _cloudFailed=false;
		_pushBackoffUntil=0; _pushBackoffMs=0; SaveQuiet();
		if(!auto) Toast("Guardado en la nube ☁️✓");
	}catch(e){
		_cloudFailed=true;
		_pushBackoffMs=Math.min(_pushBackoffMs? _pushBackoffMs*2 : 60000, 300000);
		_pushBackoffUntil=Date.now()+_pushBackoffMs;
		if(auto){/* quiet: the dot turns red and the next edit reschedules */}
		// an expired token used to point at a menu entry; open the sheet instead,
		// so there is always a way back even if the menu changes
		else if(e&&e.code==="auth") OpenCloudSettings({aviso:"⚠️ <b>El acceso a la nube ha caducado.</b> Crea un token nuevo en GitHub y pégalo aquí abajo. Tus datos siguen guardados en este dispositivo."});
		else if(e&&e.code==="conflict") Toast("Otro dispositivo subió cambios antes. Pulsa ☁️ otra vez.");
		else Toast(navigator.onLine===false?"Sin conexión. Guardado en el móvil; se subirá solo."
			:"No se ha subido a la nube. Tus datos están en el móvil y se reintentará.");
	}finally{ SetCloudBusy(false); UpdateCloudDot(); }
}

/* ---- auto-pull (v1.13.0) ----------------------------------------------
   Until now the app only pulled at boot, so seeing the other phone's changes
   meant fully closing and reopening it. CloudPull is the single pull entry
   point for both boot and the foreground triggers.

   The quiet path is deliberately READ-ONLY: it adopts the cloud copy only when
   this device has nothing unsent, and it NEVER stamps, re-stamps or pushes.
   That is what keeps it safe — a stale-but-dirty device (expired token, no
   token, long offline) can never promote its own clock and erase the other
   phone's week. When local is dirty we simply keep the screen as it is and let
   the ordinary autosync push it; plain last-write-wins then settles it exactly
   as it does today. */
function PullDeferred(){
	// never rebuild the screen under the user's hands
	try{
		const sh=document.getElementById("sheet");
		if(sh && sh.classList.contains("show")) return true;     // a bottom sheet is open
		if(picker!==null) return true;                            // the dish picker writes back by position
		const ae=document.activeElement;                          // typing (incl. #ideasSearch, inside #view)
		if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable)) return true;
		if(_gestureActive) return true;                           // finger down / list still gliding
		if(Date.now()<(ToastAction._until||0)) return true;        // a live "Deshacer" window
	}catch(e){}
	return false;
}
/* pure decision helper (mirrors the branches below so it is testable) */
function SyncVerdict(o){
	if(!o||!o.valid||!o.remoteUpdatedAt) return "skip";
	if(o.remoteUpdatedAt<=(o.localUpdatedAt||"")) return "recover";
	const dirty=!!(o.localUpdatedAt && (!o.localLastSync || o.localUpdatedAt>o.localLastSync));
	return dirty ? "keep-local" : "adopt";
}
/* Replace local state with the cloud copy. Order is load-bearing: the localBook
   snapshot must be taken BEFORE the overwrite and merged back AFTER it, because
   `state=payload.state` discards everything merged into the old object — that
   is exactly how a user recipe was lost once. */
function AdoptRemote(payload,o){
	o=o||{};
	const prev=o.undo? JSON.stringify(state) : null;
	const localBook={userDishes:state.userDishes,hidden:state.hidden};
	// snapshot the shared lists too: the overwrite below throws away this copy
	const localShop={extras:state.extras,produce:state.produce,graveyard:state.graveyard};
	// a copy uploaded by a phone still on a pre-plan version carries no plan at all:
	// "unknown" must not read as "reset to defaults" and wipe the training days
	const localPlan=state.plan;
	// the week on screen is this phone's navigation, not family data: adopting the
	// other phone's copy used to jump you to whatever week IT had open (last week,
	// typically), undoing "always open on this week"
	const localCurrent=state.current;
	let scrollY=0; try{ scrollY=window.scrollY||0; }catch(e){}
	state=payload.state;
	if(localCurrent) state.current=localCurrent;
	if(!Array.isArray(state.userDishes)) state.userDishes=[];
	if(!Array.isArray(state.hidden)) state.hidden=[];
	if(!Array.isArray(state.extras)) state.extras=[];
	if(!Array.isArray(state.produce)) state.produce=[];
	// a missing plan, or one that is not a plan at all (text, a list), is "unknown":
	// EnsurePlanState would reset it to the defaults and lose this phone's
	if(!PlanValido(state.plan) && PlanValido(localPlan)) state.plan=localPlan;
	else if(PlanValido(localPlan)) MergePlan(state,{plan:localPlan});  // keep what THIS phone edited later
	EnsurePlanState(state);
	MergeRecipeBook(state, localBook);                     // keep local-only recipes when adopting remote
	MergeShopping(state, localShop);                       // and this phone's Otros / Fruta y verdura
	SanitizeSlots(state);                                  // heal phantom cells coming from an old device
	state.lastSync=state.updatedAt;                        // it IS the cloud copy → not dirty → no ping-pong
	RefreshCatalog(); SaveQuiet();
	ApplyTheme(); BuildManifest();
	if(!state.current) state.current=MondayOf(TodayISO());
	EnsureWeek(state.current); Render();
	if(o.quiet){
		try{ window.scrollTo(0,scrollY); }catch(e){}         // don't yank a reader's place
		Toast("Lista actualizada ☁️");
		// NO "Deshacer" here on purpose: its Save() would stamp a newer time,
		// clobber the other phone and start a tug-of-war.
	} else {
		ToastAction("Actualizado desde la nube ☁️","Deshacer",()=>{
			try{
				const p=JSON.parse(prev);
				if(!ValidState(p)) return Toast("No se pudo deshacer");
				state=p; RefreshCatalog(); Save();               // stamp: local now wins
				ApplyTheme(); BuildManifest(); Render();
				Toast("Restaurada tu copia local — se subirá sola");
			}catch(e){ Toast("No se pudo deshacer"); }
		});
	}
}
/* fire-and-forget: never blocks first paint, silent on failure */
let _pullPending=false, _gestureActive=false;
async function CloudPull(opts){
	opts=opts||{};
	const quiet=!!opts.quiet;
	if(_cloudBusy) return;                                  // never fight an in-flight save/pull
	if(quiet && PullDeferred()){ _pullPending=true; return; } // don't even spend the request
	_cloudBusy=true;                                        // same mutex CloudSave checks (no ⏳ for quiet pulls)
	try{
		const {payload}=await CloudGet();
		if(!payload || !payload.state || !ValidState(payload.state)) return;
		// re-check AFTER the round-trip: the user may have started typing meanwhile
		if(quiet && PullDeferred()){ _pullPending=true; return; }
		const verdict=SyncVerdict({localUpdatedAt:state.updatedAt||"", localLastSync:state.lastSync||"",
			remoteUpdatedAt:payload.state.updatedAt||payload.savedAt||"", valid:true});
		if(verdict==="adopt"){ AdoptRemote(payload,{quiet:quiet,undo:!quiet}); return; }
		// 'recover' and 'keep-local': the cloud may still hold recipes or shopping
		// items this device never saw. Union them (never drop one); SaveQuiet → no
		// stamp, so a mere pull can never outrank a real edit on the other phone.
		const before=RecipeBookSize(state), shopBefore=ShopSig(state);
		MergeRecipeBook(state, payload.state);
		MergeShopping(state, payload.state);
		const gainedPlan=MergePlan(state, payload.state);
		const gainedBook=RecipeBookSize(state)>before, gainedShop=ShopSig(state)!==shopBefore||gainedPlan;
		if(gainedBook || gainedShop){
			if(gainedBook) RefreshCatalog();
			if(quiet){ SaveQuiet(); if(!PullDeferred()) Render(); }
			else { Save(); Render(); if(gainedBook) Toast("Recetas recuperadas de la nube ☁️"); }
		}
	}catch(e){/* offline / rate-limited → keep local, that's the contract */}
	finally{ _cloudBusy=false; }

/* importing replaces everything, so it now previews what's inside, confirms,
   and leaves an undo — it used to swap your whole state the moment you picked a file */
function BindImportFile(){
	const f=document.getElementById("importFile");
	if(!f) return;
	f.onchange=ev=>{
		const file=ev.target.files[0]; if(!file) return;
		const r=new FileReader();
		r.onload=()=>{try{
			const data=JSON.parse(r.result);
			if(!ValidState(data)) return Toast("Ese archivo no es una copia válida");
			const prev=JSON.stringify(state);
			ConfirmSheet({title:"Importar copia",
				text:(()=>{const w=Object.keys(data.weeks||{}).length,d=(data.userDishes||[]).length;
					return `Vas a <b>sustituir</b> todo lo que hay en este dispositivo por el contenido del archivo.<br><br>El archivo trae ${w} ${w===1?"semana":"semanas"} y ${d} ${d===1?"plato tuyo":"platos tuyos"}.`;})(),
				okLabel:"Sustituir mis datos",
				onOk:()=>ImportarCopia(data,prev)});
		}catch(e){Toast("No se pudo leer el archivo")}};
		r.readAsText(file);
	};
}
/* the body of «Importar copia», out of the file handler so it can be tested.
   A file exported before v1.18 has no plan: "unknown" must not read as "reset to
   defaults" (Save() would then push the default training days to the other phone) */
function ImportarCopia(data,prev){
	prev=prev||JSON.stringify(state);
	const localPlan=state.plan;
	state=data;
	if(!PlanValido(state.plan) && PlanValido(localPlan)) state.plan=localPlan;
	if(!Array.isArray(state.userDishes))state.userDishes=[];
	if(!Array.isArray(state.hidden))state.hidden=[];
	if(!Array.isArray(state.extras))state.extras=[];
	EnsurePlanState(state);
	SanitizeSlots(state); RefreshCatalog(); Save();
	ApplyTheme(); BuildManifest(); GoToThisWeek(); Render();
	ToastAction("Copia importada","Deshacer",()=>{
		try{ state=JSON.parse(prev); RefreshCatalog(); Save(); ApplyTheme(); BuildManifest(); Render(); Toast("Restaurado"); }
		catch(e){ Toast("No se pudo deshacer"); }
	});
}

/* ============================ BACK FROM THE SHOP ============================
   The loop was open: planning discounted stock automatically, but nothing you
   bought ever came back into the pantry, so it drifted out of date and dragged
   "ya tienes" and Sorpréndeme down with it. One tap per item, no forms. */
function BoughtForPantry(){
	const out=[], seen=new Set();
	const push=(name,src)=>{
		const clean=(name||"").trim(); if(!clean) return;
		const k=Norm(clean); if(seen.has(k)) return; seen.add(k);
		out.push({name:clean, src});
	};
	// ingredients ticked off in "Para los platos". The pantry gets the product as
	// the RECIPE names it: from the scaled line ("2 aguacates") it got «Aguacates»,
	// a second row next to your «Aguacate» that «Sorpréndeme» no longer recognised
	const b=BoughtMap(), orig=new Map();
	PlannedCookDishes().forEach(n=>IngredientesCompraPares(n).forEach(p=>{ const k=ShopKey(p.x); if(!orig.has(k)) orig.set(k,p.orig); }));
	MergedIngredients().forEach(x=>{ const k=ShopKey(x); if(b[k]) push(IngShortName(orig.get(k)||x.replace(SHOP_X,"")),"ingrediente"); });
	// fruit/veg and extras already crossed out
	(state.produce||[]).filter(p=>p.done).forEach(p=>push(p.name,"fruta"));
	(state.extras||[]).filter(x=>x.done).forEach(x=>push(x.name,"otros"));
	return out;
}
/* "250 g de lentejas" -> "Lentejas": the pantry stores products, not quantities.
   Works on the ORIGINAL text (not the sort key) so accents and ñ survive. */
function IngShortName(text){
	let s=(text||"").trim();
	// a line kept as the recipe wrote it ("Cebolla: 1 grande") names its product first
	const rr=s.match(ROTULO_RE); if(rr && !ROTULO_GRUPO.test(rr[1].trim())) s=rr[1].trim();
	s=s.replace(/^[\d.,\/½¼¾⅓⅔\s\-–—]+/,"");
	s=s.replace(/^(kg|g|gr|grs|gramos?|mg|ml|cl|l|litros?|ud|uds|unidad(?:es)?|dientes?|lomos?|latas?|botes?|tarrinas?|paquetes?|bolsas?|sobres?|tazas?|piezas?|filetes?|rebanadas?|cdas?|cdtas?|cucharadas?|cucharaditas?|hojas?|ramas?|vasos?|pizca|manojos?|puñados?)\b\s*/i,"");
	s=s.replace(/^de\s+(la\s+|el\s+|los\s+|las\s+)?/i,"");
	s=s.replace(/\s*\([^)]*\)\s*$/,"");           // drop a trailing "(opcional)"
	s=s.trim();
	if(!s) return (text||"").trim();
	return s.charAt(0).toUpperCase()+s.slice(1);
}

/* ============================ SHOPPING COPY ============================ */
function CopyShop(){
	const wk=CurWeek();
	let lines=[`🛒 Compra — semana ${FmtLong(wk.monday)} a ${FmtLong(AddDays(wk.monday,6))}`,""];
	// same order as the Compra screen: the two lists you write by hand first,
	// then the ingredients the app works out from the recipes
	const prod=state.produce.filter(p=>!p.done);
	if(prod.length){lines.push("🍎 Fruta y verdura");prod.forEach(p=>lines.push(`· ${p.name}${p.qty?` (${NiceQty(p.qty)} ${p.unit||""})`:""}`));lines.push("")}
	const ex=state.extras.filter(x=>!x.done);
	if(ex.length){lines.push("📝 Otros");ex.forEach(x=>lines.push(`· ${x.name}`));lines.push("")}
	const dishes=PlannedCookDishes();
	if(dishes.length){
		lines.push("🍳 Para los platos (lo que falta)");
		if(state.shopView==="merged"){
			let last=-1;
			MergedIngredients().filter(x=>!IsBought(x)).forEach(x=>{
				const a=AisleOf(x); if(a!==last){ lines.push(""); lines.push(AisleName(a).toUpperCase()); last=a; }
				lines.push(`· ${x}${PantryHas(x)?" (ya tienes)":""}`);
			});
			dishes.filter(n=>!IngredientesDe(n)).forEach(n=>lines.push(`· ${n} (plato sin receta)`));
		}else{
			dishes.forEach(n=>{
				const esc=EscalaTxt(n);
				const ing=IngredientesCompra(n);
				if(!ing){ lines.push(`▸ ${n} (sin receta)`); return; }
				const rem=ing.filter(x=>!IsBought(x));
				if(rem.length){ lines.push(`▸ ${n}${esc?` (para ${ServingsNeeded(n)} · ${esc})`:""}`); rem.forEach(x=>lines.push(`   · ${x}${PantryHas(x)?" (ya tienes)":""}`)); }
			});
			// (the merged view already carries these through MergedIngredients)
			const pc=PlanHidratosCompra().filter(x=>!IsBought(x));
			if(pc.length){ lines.push("▸ Hidratos post-entreno (plan)"); pc.forEach(x=>lines.push(`   · ${x}`)); }
		}
		lines.push("");
	}
	const text=lines.join("\n").trim();
	CopyText(text);
}
function CopyText(text){
	if(navigator.clipboard&&navigator.clipboard.writeText){
		navigator.clipboard.writeText(text).then(()=>Toast("Lista copiada"),()=>fallbackCopy(text));
	}else fallbackCopy(text);
}
function fallbackCopy(text){
	const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
	document.body.appendChild(ta);ta.focus();ta.select();
	try{document.execCommand("copy");Toast("Lista copiada")}catch(e){Toast("Copia manual: mantén pulsado el texto")}
	ta.remove();
}

function AddPrompt(opts){
	// opts: {title, fields:[{key,label,ph,type,value}], onSave}
	document.getElementById("sheetContent").innerHTML=`
		<div class="grip"></div>
		<div class="sheet-h"><div class="t1">${opts.title}</div><div class="x" data-action="close-sheet">✕</div></div>
		<div class="sheet-body" id="promptBody"></div>`;
	const body=document.getElementById("promptBody");
	let foldBox=null;                      // optional fields live in here
	opts.fields.forEach(f=>{
		if(f.type==="fold"){                 // a collapsible group header
			const det=document.createElement("details"); det.className="fold"; det.open=!!f.open;
			const sum=document.createElement("summary"); sum.textContent=f.label; det.appendChild(sum);
			body.appendChild(det); foldBox=det; return;
		}
		const host = (f.fold && foldBox) ? foldBox : body;
		const lab=document.createElement("div");lab.className="lab";lab.textContent=f.label;host.appendChild(lab);
		const body2=host;                    // keep the rest of the code reading naturally
		if(f.type==="select"){
			const sel=document.createElement("select");sel.className="field";sel.id="f_"+f.key;
			f.options.forEach(o=>{const op=document.createElement("option");op.value=o.value;op.textContent=o.label;if(String(o.value)===String(f.value))op.selected=true;sel.appendChild(op)});
			body2.appendChild(sel);
		}else if(f.type==="textarea"){
			const ta=document.createElement("textarea");ta.className="field ta";ta.id="f_"+f.key;ta.placeholder=f.ph||"";
			ta.rows=6;if(f.value!=null)ta.value=f.value;body2.appendChild(ta);
		}else{
			const inp=document.createElement("input");inp.className="field";inp.id="f_"+f.key;inp.placeholder=f.ph||"";
			// NOT type="number": the browser silently BLANKS anything it dislikes, so
			// "0,5" (how you write it in Spanish), "1/2" and "½" all arrived as ""
			// and the product was saved with no quantity at all. text + inputMode
			// keeps the numeric keypad on the phone and never throws away the value.
			if(f.type==="number"){ inp.type="text"; inp.inputMode="decimal"; }
			else inp.type=f.type||"text";
			if(f.value!=null)inp.value=f.value;body2.appendChild(inp);
		}
	});
	const row=document.createElement("div");row.className="act-row prompt-actions";
	row.innerHTML=`<button class="btn ghost" data-action="close-sheet">Cancelar</button><button class="btn prim" id="promptSave">Guardar</button>`;
	body.appendChild(row);
	// iOS: keep the focused field visible above the keyboard
	body.querySelectorAll(".field").forEach(el=>{
		el.addEventListener("focus",()=>setTimeout(()=>{try{el.scrollIntoView({block:"center",behavior:"smooth"})}catch(_){}},250));
	});
	ShowSheet();
	const first=body.querySelector(".field");if(first)setTimeout(()=>first.focus(),250);
	document.getElementById("promptSave").onclick=()=>{
		const vals={};opts.fields.forEach(f=>{vals[f.key]=document.getElementById("f_"+f.key).value.trim()});
		opts.onSave(vals);
	};
}

/* ============================ SHARE WEEK AS IMAGE (WhatsApp) ============================ */
function ResolveVar(name,fallback){
	try{const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();return v||fallback;}
	catch(e){return fallback;}
}
function Cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function JoinNames(names){
	if(names.length===1) return names[0];
	const last=names[names.length-1];
	const head=names.slice(0,-1).join(", ");
	const conn=/^[iI]/.test(last)?" e ":" y ";
	return head+conn+last;
}
/* per-slot summary -> array of plain strings, or null if empty (mirrors SlotRows) */
function SlotSummaryLines(day,slot){
	if(!day.slots[slot]) return null;
	const cells=state.members.map(m=>({m,c:day.slots[slot][m.id]})).filter(x=>x.c);
	if(!cells.some(x=>x.c.dish||x.c.away)) return null;
	const filled=cells.filter(x=>x.c.dish&&!x.c.away);
	const allSame=filled.length===cells.length&&filled.length>0&&
		filled.every(x=>x.c.dish.trim().toLowerCase()===filled[0].c.dish.trim().toLowerCase());
	if(allSame) return [filled[0].c.dish.trim()];
	const groups=[];
	filled.forEach(x=>{
		const key=x.c.dish.trim().toLowerCase();
		let g=groups.find(s=>s.key===key);
		if(!g){g={key,dish:x.c.dish.trim(),names:[]};groups.push(g);}
		g.names.push(x.m.name);
	});
	const out=groups.map(g=>JoinNames(g.names)+": "+g.dish);
	const away=cells.filter(x=>x.c.away).map(x=>x.m.name);
	if(away.length) out.push(JoinNames(away)+": fuera de casa");
	return out;
}
function RoundRect(ctx,x,y,w,h,r){
	ctx.beginPath();ctx.moveTo(x+r,y);
	ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
	ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function RenderWeekCanvas(){
	const wk=CurWeek();
	const W=1080,P=56,cardPad=30,dayGap=20;
	const ff='"Helvetica Neue", Helvetica, Arial, sans-serif';
	const F=(w,s)=>`${w} ${s}px ${ff}`;
	const col={
		bg:ResolveVar("--bg","#F4F6F3"),card:ResolveVar("--card","#FFFFFF"),
		ink:ResolveVar("--ink","#1E2A24"),muted:ResolveVar("--muted","#6B756F"),
		line:ResolveVar("--line","#E4E9E4"),accent:ResolveVar("--aub","#2E7D5B")
	};
	const DAY_S=40,LBL_S=22,TXT_S=33,TXT_LH=44;
	const SLOTS_SHOW=["Comida","Cena"];
	const cv=document.createElement("canvas");cv.width=W;
	const ctx=cv.getContext("2d");
	const innerW=W-2*P-2*cardPad;
	const wrap=(text,maxW)=>{
		ctx.font=F(400,TXT_S);
		const words=String(text).split(" "),lines=[];let ln="";
		words.forEach(w=>{const t=ln?ln+" "+w:w;if(ctx.measureText(t).width>maxW&&ln){lines.push(ln);ln=w;}else ln=t;});
		if(ln)lines.push(ln);return lines;
	};
	/* --- measure --- */
	const dayHeadH=56,labelH=LBL_S+12,blockGap=8;
	const days=wk.days.map((d,i)=>{
		const blocks=[];
		SLOTS_SHOW.forEach(sl=>{
			const lines=SlotSummaryLines(d,sl);if(!lines)return;
			const wrapped=[];lines.forEach(t=>wrap(t,innerW-8).forEach(w=>wrapped.push(w)));
			blocks.push({label:sl.toUpperCase(),wrapped});
		});
		let contentH=dayHeadH;
		if(blocks.length) blocks.forEach(b=>{contentH+=labelH+b.wrapped.length*TXT_LH+blockGap;});
		else contentH+=TXT_LH;
		return {dow:Cap(DOW[i]),date:d.date,blocks,cardH:contentH+2*cardPad};
	});
	const headerH=190,afterHeader=34,footerH=68,bottomPad=36;
	let total=headerH+afterHeader+footerH+bottomPad;
	days.forEach(d=>{total+=d.cardH+dayGap;});
	cv.height=Math.ceil(total);
	/* --- draw (setting height reset the context) --- */
	const c=cv.getContext("2d");
	const today=TodayISO();
	c.fillStyle=col.bg;c.fillRect(0,0,W,cv.height);
	c.fillStyle=col.accent;c.fillRect(0,0,W,headerH);
	c.textBaseline="alphabetic";c.textAlign="left";
	c.fillStyle="#fff";c.font=F(800,52);c.fillText("Menú de la semana",P,92);
	c.fillStyle="rgba(255,255,255,.88)";c.font=F(500,30);
	c.fillText(FmtLong(wk.monday)+" – "+FmtLong(AddDays(wk.monday,6)),P,138);
	let y=headerH+afterHeader;
	days.forEach(d=>{
		RoundRect(c,P,y,W-2*P,d.cardH,22);
		c.fillStyle=col.card;c.fill();
		c.strokeStyle=col.line;c.lineWidth=1.5;c.stroke();
		const cx=P+cardPad;let iy=y+cardPad;
		/* day header */
		c.fillStyle=col.ink;c.font=F(800,DAY_S);
		const dl=d.dow+"  ·  "+FmtLong(d.date);
		c.fillText(dl,cx,iy+34);
		if(d.date===today){
			const w0=c.measureText(dl).width;const px=cx+w0+16;
			c.font=F(800,20);const tw=c.measureText("HOY").width;
			RoundRect(c,px,iy+8,tw+26,30,15);c.fillStyle=col.accent;c.fill();
			c.fillStyle="#fff";c.fillText("HOY",px+13,iy+30);
		}
		iy+=dayHeadH;
		if(!d.blocks.length){
			c.fillStyle=col.muted;c.font=F(400,TXT_S);
			c.fillText("Sin planificar",cx+4,iy+26);
		}else d.blocks.forEach(b=>{
			c.fillStyle=col.accent;c.font=F(800,LBL_S);
			c.fillText(b.label,cx,iy+LBL_S);
			iy+=labelH;
			c.fillStyle=col.ink;c.font=F(400,TXT_S);
			b.wrapped.forEach(line=>{c.fillText(line,cx+4,iy+26);iy+=TXT_LH;});
			iy+=blockGap;
		});
		y+=d.cardH+dayGap;
	});
	c.fillStyle=col.muted;c.font=F(500,26);c.textAlign="center";
	c.fillText("Actualizado el "+FmtLong(today),W/2,cv.height-bottomPad);
	c.textAlign="left";
	return cv;
}
function DataUrlToFile(dataUrl,name){

}

/* Quantities the way people actually write them: "0,5" and "0.5", "1/2", "½",
   "1 1/2", "1½". Returns a number, or null if there is nothing usable. */
const FRAC_UNI={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
function ParseQty(txt){
	const s=String(txt==null?"":txt).trim().toLowerCase().replace(/\s+/g," ");
	if(!s) return null;
	let n=null;
	let m=s.match(/^(\d+)?\s*([½¼¾⅓⅔⅛])/);                       // 1½ · ½
	if(m) n=(m[1]?parseInt(m[1],10):0)+FRAC_UNI[m[2]];
	if(n===null && (m=s.match(/^(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)/)) && +m[3]!==0)
		n=(m[1]?parseInt(m[1],10):0)+(+m[2])/(+m[3]);              // 1 1/2 · 1/2
	if(n===null && (m=s.match(/^\d+(?:[.,]\d+)?/)))
		n=parseFloat(m[0].replace(",","."));                       // 0,5 · 0.5 · 2
	return (n!==null&&isFinite(n))?n:null;
}
/* "0,5 kg" typed all in the quantity box: keep the number, hand back the rest so
   the unit is not lost either. */
function ParseQtyUnit(txt){
	const s=String(txt==null?"":txt).trim();
	const qty=ParseQty(s);
	if(qty===null) return {qty:null,unit:""};
	const resto=s.replace(/^\s*(?:\d+\s+)?(?:\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛])\s*/,"").trim();
	return {qty, unit:/^[a-zA-ZáéíóúñÁÉÍÓÚÑ.]{1,10}$/.test(resto)?resto:""};
}
/* ½ and ¾ read better than 0,5 and 0,75 on a shopping list — and it is the same
   style the recipe scaling already uses. */
function NiceQty(n){
	if(n==null||!isFinite(n)) return "";
	const r=Math.round(n*1000)/1000, ent=Math.floor(r), fr=r-ent;
	for(const [v,ch] of [[.5,"½"],[.25,"¼"],[.75,"¾"],[1/3,"⅓"],[2/3,"⅔"]])
		if(Math.abs(fr-v)<1e-6) return (ent?ent:"")+ch;
	return (Math.round(r*100)/100).toString().replace(".",",");
}

/* ============================ EVENTS ============================ */
function Toast(msg){
	const t=document.getElementById("toast");
	// don't let a routine message wipe an "Deshacer" the user may still be reaching for
	if(t.classList.contains("act") && Date.now()<(ToastAction._until||0)) return;
	t.textContent=msg;t.classList.remove("act");t.classList.add("show");
	clearTimeout(Toast._t);Toast._t=setTimeout(()=>t.classList.remove("show"),1900);
}
/* toast with one action button (e.g. "Deshacer"); longer-lived than Toast */
function ToastAction(msg,label,fn){
	const t=document.getElementById("toast");
	t.textContent=msg;
	const b=document.createElement("button"); b.className="t-act"; b.textContent=label;
	b.onclick=()=>{ t.classList.remove("show","act"); ToastAction._until=0; clearTimeout(Toast._t); fn(); };
	t.appendChild(b);
	t.classList.add("show","act");
	ToastAction._until=Date.now()+8000;      // protected window
	clearTimeout(Toast._t);
	Toast._t=setTimeout(()=>{t.classList.remove("show","act");ToastAction._until=0;},8000);
}
/* Deleting a list item was one silent, final tap. Now it always comes back with
   an 8s "Deshacer" that puts the item back exactly where it was. */
function DeleteWithUndo(arr,idx,verb){
	if(idx<0||idx>=arr.length) return null;
	const item=arr[idx];
	// the two shared lists need a tombstone, or the union merge would resurrect
	// the item on the very next sync with the other phone
	const shared = arr===state.extras || arr===state.produce;
	arr.splice(idx,1);
	if(shared) Bury(item.id);
	Save(); Render();
	ToastAction((verb||"Quitado")+" «"+(item.name||"")+"»","Deshacer",()=>{
		if(shared){ Unbury(item.id); Stamp(item); }   // undo must outlive its own tombstone
		arr.splice(Math.min(idx,arr.length),0,item);
		Save(); Render(); Toast("Restaurado");
	});
	return item;
}
/* Emptying a whole list, so finishing the shop isn't N taps on ✕. Same contract as
   the single delete: tombstones so the other phone doesn't resurrect them, and one
   «Deshacer» that puts every item back exactly as it was. */
function ClearListWithUndo(arr,label){
	if(!arr||!arr.length) return 0;
	const shared = arr===state.extras || arr===state.produce;
	const copia = arr.slice();
	if(shared) copia.forEach(it=>Bury(it.id));
	arr.length=0;
	Save(); Render();
	ToastAction("Vaciado "+label+" · "+copia.length,"Deshacer",()=>{
		if(shared) copia.forEach(it=>{ Unbury(it.id); Stamp(it); });
		copia.forEach(it=>arr.push(it));
		Save(); Render(); Toast("Restaurado");
	});
	return copia.length;
}
