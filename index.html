<title>Menú de la semana</title>
<style>
:root{
	--bg:#F4F6F3; --card:#FFFFFF; --ink:#1E2A24; --muted:#6B756F;
	--line:#E4E9E4; --line2:#EEF2EE;
	--aub:#2E7D5B; --aub-2:#246B4D; --aub-soft:#E2F0E9;
	--herb:#2F7D58; --herb-soft:#E5F0EA;
	--amber:#B5642B; --amber-soft:#F7EADB;
	--red:#B33A3A;
	--m-nosotros:#2F6F8F; --m-noah:#3E7C5A; --m-iria:#C2557A;
	--r:14px; --r-sm:10px;
	--sh:0 1px 2px rgba(36,27,46,.06),0 6px 18px rgba(36,27,46,.06);
	--sh-pop:0 8px 40px rgba(36,27,46,.22);
	--ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* no double-tap zoom (still allows scroll); pinch-to-zoom stays available */
html{touch-action:manipulation}
/* Surfaces that used to be hardcoded light. THEMES sets its vars inline on
   :root, so these live in classes instead — that's why the dark flag works. */
:root{
	--surface-nav:rgba(255,255,255,.92);
	--field-focus:#FFFFFF;
	--track:#cdbfca;          /* switch track when off */
	--faint:#e0d8de;          /* grip, hairlines */
	--ghost-bg:#FFFFFF;       /* secondary buttons */
	--del-ink:#c6bcc4;        /* trash icons */
}
:root.dark{
	--surface-nav:rgba(22,27,31,.94);
	--field-focus:#232B31;
	--track:#3A444C;
	--faint:#39434A;
	--ghost-bg:#232B31;
	--del-ink:#7C888F;
	--amber:#E39B5C;
	--red:#E2726F;
	/* the light tints stayed light in Noche: the day names of the training editor
	   were light-on-light (1.01:1) and the backup warning too */
	--herb-soft:#1F3329;
	--amber-soft:#3A2A1C;
}
/* the pantry chips carry fixed dark text, unreadable on the dark tints */
:root.dark .inv-chip{color:var(--herb)} :root.dark .inv-chip.fridge{color:var(--amber)}
/* text size escape hatch: pinch works again, and this scales the whole UI */
:root[data-txt="grande"]{zoom:1.12}
:root[data-txt="enorme"]{zoom:1.26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
	font-family:var(--ff); color:var(--ink); background:var(--bg);
	font-size:15px; line-height:1.4;
	padding-bottom:calc(64px + env(safe-area-inset-bottom));
	-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh}

/* ---------- top bar ---------- */
.top{
	position:sticky;top:0;z-index:30;
	background:var(--aub);color:#fff;
	padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;
	box-shadow:0 2px 12px rgba(36,27,46,.18);
}
.top-row{display:flex;align-items:center;gap:8px}
.top h1{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0;opacity:.75;flex:1}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:17px;line-height:1;border:0;padding:0;color:inherit;font-family:inherit;cursor:pointer}
.icon-btn:active{background:rgba(255,255,255,.28)}
.wk{display:flex;align-items:center;gap:10px;margin-top:10px}
.wk-nav{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;font-weight:600}
.wk-nav:active{background:rgba(255,255,255,.28)}
.wk-label{flex:1;text-align:center}
.wk-label .r1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.wk-label .r2{font-size:12px;opacity:.7;margin-top:1px}
.surprise{
	margin-top:11px;width:100%;height:46px;border-radius:13px;
	background:linear-gradient(180deg,#FFE27A,#F7C948);color:#3a2a08;
	font-weight:800;font-size:15px;letter-spacing:.01em;
	display:flex;align-items:center;justify-content:center;gap:8px;
	box-shadow:0 2px 0 #d9a916,0 8px 20px rgba(0,0,0,.18);
}
.surprise:active{transform:translateY(1px);box-shadow:0 1px 0 #d9a916}
.icon-btn.wa{background:#25D366}
.icon-btn.wa:active{background:#1da851}
.icon-btn svg{width:19px;height:19px;display:block}
.today-btn{width:auto;flex-shrink:0;padding:0 12px;font-size:13px;font-weight:700;letter-spacing:.02em}
.today-btn.here{opacity:.55}
.today-btn.away{background:#fff;color:var(--aub)}
.today-btn.away:active{background:rgba(255,255,255,.85)}

/* ---------- views ---------- */
.view{padding:14px 14px 24px}
.view-title{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:2px 2px 12px}
.hint{color:var(--muted);font-size:13px;margin:0 2px 14px}

/* ---------- day card ---------- */
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line2)}
.day-head.collapsed{border-bottom:none}
.day-dow{font-size:16px;font-weight:800;text-transform:capitalize;letter-spacing:-.01em}
.day-date{font-size:12px;color:var(--muted)}
.day-today{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--aub);padding:3px 7px;border-radius:20px}
.day-fill{flex:1}
.day-mini{display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.chev{color:var(--muted);font-size:13px;transition:transform .18s}
.chev.up{transform:rotate(180deg)}
.slots{padding:4px 0}
.slot{padding:9px 14px;border-top:1px solid var(--line2)}
.slot:first-child{border-top:none}
.slot-l{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--aub-2);margin-bottom:6px;display:flex;align-items:center;gap:7px}
/* padding grows the tap area to 44px; the negative margin keeps the layout put */
.slot-l .sl-act{margin:-13px -6px -13px auto;padding:13px 6px;color:var(--muted);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:12px}
.rows{display:flex;flex-direction:column;gap:5px}
.row-all,.row-m{display:flex;align-items:center;gap:9px;min-height:44px;border-radius:var(--r-sm);padding:7px 8px;background:var(--line2)}
.row-all{background:var(--aub-soft)}
/* the member pill is a label, not the content: it must not outshout the dish */
.tag{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:20px;color:#fff;white-space:nowrap;flex-shrink:0;opacity:.92}
.tdot.more{background:var(--line);color:var(--muted)}
.tag.all{background:var(--aub)}
.tag.m{text-align:center}
.dish{flex:1;font-size:15.5px;font-weight:600;white-space:pre-wrap;line-height:1.3}
.dish.empty{color:var(--muted);font-weight:600}
.dish .frozen,.dish .fridge{font-size:11px;margin-left:6px;color:var(--herb);font-weight:700;white-space:nowrap}
.dish .fridge{color:var(--amber)}
/* the dish name is the content — it must outweigh the member pill next to it */
.dish-nm{cursor:pointer;border-bottom:1px dashed var(--line);padding:8px 3px 3px;margin:-8px -3px -1px;display:inline-block}
.dish-nm:active{background:var(--aub-soft);border-radius:5px}
.dish-nm .rbk{font-size:11px;opacity:.55;margin-left:3px;border:0}
.dish-sep{opacity:.45;margin:0 2px}
.search-note{font-size:12.5px;color:var(--muted);margin:0 2px 12px;font-weight:600}
.lnk{background:none;border:0;color:var(--aub);font-weight:800;font-family:inherit;font-size:12.5px;cursor:pointer;padding:6px 4px;margin:-6px 0}
.tipo-tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:middle}
.tipo-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.01em;white-space:nowrap}
.tdot{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:8.5px;font-weight:800;line-height:1}
.away{color:var(--muted);font-size:13px;font-weight:700}
.add-slot{color:var(--aub-2);font-weight:800;font-size:13px;padding:6px 8px}

/* ---------- pantry / lists ---------- */
.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.sec-h h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.sec-h .add-x{margin:-13px -6px -13px auto;padding:13px 6px;color:var(--aub);font-weight:800;font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line2)}
.it .star{font-size:16px;width:44px;height:44px;margin:-9px -10px -9px -12px;display:grid;place-items:center;flex-shrink:0;color:#d8cfd5}
.it .star.on{color:#E8A93B}
.it .nm{flex:1;font-size:14.5px;min-height:26px;display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;padding:9px 0;margin:-9px 0}
.it .nm small{color:var(--muted);font-weight:600}
.it .used{font-size:11px;color:var(--herb);font-weight:700}
.it .pri{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--amber);background:var(--amber-soft);padding:2px 7px;border-radius:20px}
.it .pri.cad-off{color:#fff;background:var(--red)}
.stepper{display:flex;align-items:center;gap:0;background:var(--bg);border-radius:9px;overflow:hidden;flex-shrink:0}
.stepper button{width:40px;height:44px;font-size:18px;font-weight:700;color:var(--aub);display:grid;place-items:center}
.stepper button:active{background:var(--aub-soft)}
.stepper .q{min-width:30px;text-align:center;font-weight:800;font-size:14px}
.del{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--del-ink);font-size:15px;flex-shrink:0;margin-right:-8px}
.del:active{background:#f6eef3;color:var(--red)}
.check{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:14px;color:#fff;position:relative}
/* invisible 44px hit area around the 26px box: full target, same drawing */
.check::after{content:"";position:absolute;inset:-9px}
.check.on{background:var(--herb);border-color:var(--herb)}
.it.done .nm{text-decoration:line-through;color:var(--muted)}
.empty-msg{padding:16px 14px;color:var(--muted);font-size:13px;text-align:center}

/* ideas */
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:12px 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.tab.on{background:var(--aub);color:#fff}
.fchips{display:flex;gap:6px;padding:0 14px 12px;overflow-x:auto;flex-wrap:nowrap}
/* in the main views let filters wrap: a hidden horizontal scroll meant that only
   3 of 9 food types were ever seen. Sheets keep the single scrolling row. */
#view .fchips,#view .tabs{flex-wrap:wrap;overflow-x:visible}
.fchip{padding:11px 12px;min-height:40px;display:inline-flex;align-items:center;border-radius:18px;background:var(--card);box-shadow:var(--sh);font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted)}
.fchip.on{background:var(--herb);color:#fff}
.idea{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line2);cursor:pointer}
.idea:active{background:var(--line2)}
.idea .nm{flex:1;font-size:14.5px;font-weight:600}
.idea .nm .ued{font-size:11px;color:var(--aub);opacity:.9}
.idea .nm .rbk{font-size:12px;opacity:.65;margin-left:2px}
.idea .ti{font-size:10.5px;font-weight:800;color:var(--aub-2);background:var(--aub-soft);padding:3px 8px;border-radius:20px;white-space:nowrap}
.idea .ti.co{color:var(--muted);background:var(--line2)}
/* dish detail sheet */
.dm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dm{background:var(--bg);border-radius:11px;padding:10px 6px;text-align:center}
.dm b{display:block;font-size:16px}
.dm span{font-size:10.5px;color:var(--muted);font-weight:600}
.rec-text{background:var(--bg);border-radius:11px;padding:12px 13px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.rec-text.muted{color:var(--muted)}
.field.ta{height:auto;min-height:120px;padding:10px 13px;line-height:1.5;resize:vertical;font-family:inherit;font-size:14px}

/* ---------- bottom nav ---------- */
.nav{
	position:fixed;left:0;right:0;bottom:0;z-index:30;
	background:var(--surface-nav);backdrop-filter:saturate(160%) blur(14px);
	border-top:1px solid var(--line);
	display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
	max-width:520px;margin:0 auto;
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--muted);font-size:10.5px;font-weight:700;border-radius:12px}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--aub)}
.nav .badge{position:absolute;transform:translate(14px,-6px);background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:10px;display:grid;place-items:center;padding:0 4px}

/* ---------- modal / sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(36,27,46,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
	position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;
	background:var(--card);border-radius:20px 20px 0 0;
	box-shadow:var(--sh-pop);
	transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
	bottom:var(--kb,0px);               /* --kb = keyboard height, set from visualViewport */
	max-height:88vh;max-height:calc(88dvh - var(--kb,0px));
	display:flex;flex-direction:column;overflow:hidden;
	padding-bottom:env(safe-area-inset-bottom);
}
/* the sheet is flex, but its content lives one level down: without min-height:0
   the inner column refuses to shrink and long sheets (recetas, editor) run off
   the bottom of the phone screen with no way to scroll */
#sheetContent{display:flex;flex-direction:column;min-height:0;flex:1}
.sheet.show{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:4px;background:var(--faint);margin:9px auto 4px}
.sheet-h{padding:4px 16px 10px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line2)}
.sheet-h .t1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sheet-h .t2{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.sheet-h .x{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:16px;color:var(--muted)}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px 24px}
.field{width:100%;height:44px;border:1.5px solid var(--line);border-radius:11px;padding:0 13px;background:var(--bg);outline:none}
.field:focus{border-color:var(--aub);background:var(--field-focus);color:var(--ink)}
.lab{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 7px}
.toggle{display:flex;align-items:center;gap:10px;background:var(--aub-soft);border-radius:12px;padding:11px 13px;margin-bottom:4px}
.toggle .tl{flex:1;font-weight:700;font-size:14px}
.sw{width:48px;height:28px;border-radius:16px;background:var(--track);position:relative;transition:background .18s;flex-shrink:0}
.sw.on{background:var(--aub)}
.sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on::after{left:23px}
.pick-list{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.pick{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line2);text-align:left;width:100%}
.pick .nm{flex:1;font-size:15px;font-weight:600}
/* week header: macros are one tap from the week they describe */
.r2-btn{background:none;border:0;font-family:inherit;color:inherit;font:inherit;cursor:pointer;padding:6px 8px;margin:-6px -8px;opacity:.85}
/* surprise: roll again / undo */
.surprise-row{display:flex;gap:8px}
.surprise-row .surprise{flex:1}
.surprise.again{flex:0 0 52px;font-size:18px;padding:0}
/* copy a day onto other days */
.day-copy{font-size:15px;color:var(--muted);padding:10px 8px;margin:-10px 0;cursor:pointer}
.copy-box{background:var(--bg);border-radius:11px;padding:12px 14px;font-size:14px}
.copy-src{margin-bottom:4px} .copy-src:last-child{margin-bottom:0}
.copy-day{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 12px;margin-top:8px;
	border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-family:inherit;text-align:left;cursor:pointer}
.copy-day.on{border-color:var(--aub);background:var(--aub-soft)}
.copy-day .cd-k{width:20px;font-weight:800;color:var(--aub)}
.copy-day .cd-n{flex:1;font-size:14.5px;font-weight:700;text-transform:capitalize}
.copy-day .cd-n span{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:none}
.copy-day .cd-w{font-size:10.5px;font-weight:800;color:var(--amber);background:var(--amber-soft);padding:3px 8px;border-radius:20px}
/* plan a dish straight from its card */
.plan-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 2px;border-top:1px solid var(--line2)}
.plan-day{flex:1;min-width:104px;font-size:14.5px;font-weight:700;text-transform:capitalize}
.plan-day span{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:none}
.plan-opts{display:flex;gap:6px}
.hopt.taken{opacity:.6}
.when-row{background:var(--aub-soft);color:var(--aub-2);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px}
/* recipe shortcut inside lists */
.pick-book{font-size:15px;padding:10px 8px;margin:-10px 0;opacity:.7;cursor:pointer}
.pick .kc{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
/* text size choice */
.txt-row{display:flex;gap:7px}
.txt-opt{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);color:var(--muted);
	font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.txt-opt.on{background:var(--aub);border-color:var(--aub);color:#fff}
/* optional fields folded away: adding a dish is two fields */
.fold{margin-top:14px;border-top:1px solid var(--line2);padding-top:10px}
.fold>summary{font-size:13px;font-weight:800;color:var(--aub);cursor:pointer;padding:8px 2px;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸ ";font-size:11px}
.fold[open]>summary::before{content:"▾ "}
/* backup sheet: state at a glance */
.bk-state{background:var(--bg);border-radius:11px;padding:13px 15px;font-size:14px;font-weight:600}
.bk-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:4px}
.bk-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.bk-dot.on{background:var(--herb)} .bk-dot.warn{background:#F6B93B} .bk-dot.off{background:var(--line)}
.bk-alert{background:var(--amber-soft);color:var(--ink);border-radius:11px;padding:13px 15px;margin-bottom:14px;font-size:14px;line-height:1.5}
.menu-item .mi-sub{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
/* picker: who is this dish for */
.who-chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 4px}
.who{flex:1 1 auto;min-width:70px;min-height:44px;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);
	background:var(--bg);color:var(--muted);font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
.who.on{background:var(--aub);border-color:var(--aub);color:#fff}
.cm-hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0;font-weight:600}
.free-hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0;font-weight:600;opacity:.8}
.pick.free{background:var(--aub-soft);border-radius:11px;border-top:0;padding:11px 12px;margin:10px 0 0}
.pick.free .nm{color:var(--aub-2)}
.pick .ti{font-size:10.5px;font-weight:800;color:var(--aub-2);background:var(--aub-soft);padding:3px 8px;border-radius:20px;white-space:nowrap}
.inv-row{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.inv-chip{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;background:var(--herb-soft);color:#235c40;font-weight:700;font-size:13px;white-space:nowrap;border:1.5px solid transparent}
.inv-chip.fridge{background:var(--amber-soft);color:#6b4309}
.inv-chip:active{border-color:var(--herb)}
.inv-chip .q{font-size:11px;opacity:.7}
.act-row{display:flex;gap:8px;margin-top:16px}
.act-row .btn{flex:1}
/* picker: save/remove/away sit above the long list so you never scroll to save */
.aisle.done{color:var(--muted);opacity:.75}
.pick-actions{margin:14px 0 4px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.pick-actions .act-row{margin-top:8px}
#pickSearchBar{margin-top:12px}
/* Con el teclado abierto la hoja se queda en ~300 px de alto y las sugerencias
   caían 315 px POR DEBAJO de lo visible: había que pasar los botones, la
   despensa y los filtros para verlas. Mientras el teclado está subido el
   selector se reduce a campo + resultados, con el campo fijo arriba. Todo lo
   demás vuelve solo al cerrar el teclado (sin re-render: el campo nunca muere). */
.pk-kb .pk-who-lab,.pk-kb #pickWho,.pk-kb #pickComposer,
.pk-kb .pick-actions,.pk-kb #pickInv,.pk-kb #pickFilters{display:none}
.pk-kb #pickSearchBar{position:sticky;top:0;z-index:2;margin-top:0;
	background:var(--card);padding:8px 0 9px;box-shadow:0 8px 10px -9px rgba(0,0,0,.4)}
.pk-kb .pick-list{margin-top:0}
.pk-ctx{display:none}
.pk-kb .pk-ctx{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 7px}
.pk-kb .pk-ctx b{color:var(--ink)}
.btn{flex:1;height:46px;border-radius:12px;font-weight:800;font-size:14px;display:grid;place-items:center;border:1.5px solid var(--line)}
.btn.ghost{background:var(--ghost-bg);color:var(--ink)}
.btn.warn{background:var(--ghost-bg);color:var(--amber);border-color:var(--amber-soft)}  /* was #fff: a white button with 2.3:1 text in Noche */
.btn.danger{background:#fff;color:var(--red);border-color:#f0dada}
.btn.prim{background:var(--aub);color:#fff;border-color:var(--aub)}
.btn:active{transform:translateY(1px)}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--line2);font-size:15px;font-weight:600;width:100%;text-align:left}
.menu-item .mi{font-size:18px;width:24px;text-align:center}
.menu-item.danger{color:var(--red)}
.appear{padding:6px 4px 14px;border-bottom:1px solid var(--line2)}
.appear .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sw-row{display:flex;gap:12px}
.sw-th{flex:1;min-width:0;border:2px solid var(--line);border-radius:13px;padding:9px 6px 8px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:7px}
.sw-th.on{border-color:var(--aub)}
.sw-dot{width:34px;height:34px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw-dot::after{content:"";position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;border:2px solid var(--card)}
.sw-nm{font-size:11px;font-weight:700;color:var(--ink);text-align:center;line-height:1.1}
.sw-th.on .sw-nm{color:var(--aub)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-pop);opacity:0;pointer-events:none;transition:all .22s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto}
.toast .t-act{margin-left:10px;background:rgba(255,255,255,.18);border:0;color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:9px;font-family:inherit;cursor:pointer}
/* cloud button: unsaved-changes dot */
.icon-btn{position:relative}
.icon-btn.dirty::after,.icon-btn.failed::after,.icon-btn.unset::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--aub);box-sizing:content-box}
.icon-btn.dirty::after{background:#F6B93B}
.icon-btn.failed::after{background:#E2554E}
.icon-btn.unset::after{background:transparent;border-color:rgba(255,255,255,.55)}
/* shopping: dish → ingredients block, with pantry hints */
.need-dish{border-top:1px solid var(--line2)}
.need-dish:first-child{border-top:0}
.need-h{display:flex;align-items:center;gap:9px;width:100%;padding:11px 14px;background:none;border:0;text-align:left;font-family:inherit;cursor:pointer}
.need-h:active{background:var(--line2)}
.need-h .need-nm{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--ink)}
.need-h .need-c{font-size:10.5px;font-weight:800;color:var(--aub-2);background:var(--aub-soft);padding:2px 8px;border-radius:20px;white-space:nowrap}
.need-h .need-c.none{color:var(--muted);background:var(--line2)}
.need-h .need-c.done{color:#fff;background:var(--herb)}
/* shopping: view toggle (per-dish / merged) */
.shop-view{display:flex;align-items:center;gap:8px;padding:10px 14px 2px}
.sv-group{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}
.sv{font-size:12.5px;font-weight:700;color:var(--muted);background:none;border:0;padding:11px 14px;min-height:42px;border-radius:8px;font-family:inherit;cursor:pointer}
.sv.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.sv-all{margin:-12px -4px -12px auto;padding:12px 4px;font-size:12px;font-weight:700;color:var(--aub);background:none;border:0;font-family:inherit;cursor:pointer}
.need-h .need-x{display:inline-block;max-width:calc(100% - 7px);font-size:11px;font-weight:700;color:var(--aub-2);background:var(--aub-soft);padding:2px 7px;border-radius:10px;margin-left:7px;white-space:normal}
.aisle{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;padding-left:4px}
.ing-block.merged .aisle:first-child{margin-top:2px}
/* back from the shop */
.home-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 2px;border-top:1px solid var(--line2)}
.home-row .nm{flex:1;min-width:110px;font-size:14.5px;font-weight:600}
.home-opts{display:flex;gap:6px}
.hopt{min-height:40px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);
	color:var(--muted);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.hopt.on{background:var(--aub);border-color:var(--aub);color:#fff}
.ing-block{padding:0 14px 12px 18px}
.ing-block.merged{padding:8px 14px 14px 10px}
.ing-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;font-size:13.5px;color:var(--ink);padding:7px 4px;line-height:1.45;background:none;border:0;text-align:left;font-family:inherit;cursor:pointer}
.ing-item:active{background:var(--line2);border-radius:8px}
.ing-item .ing-box{flex:none;width:18px;height:18px;margin-top:1px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.ing-item .ing-tx{flex:1}
.ing-item.bought .ing-box{background:var(--herb);border-color:var(--herb)}
.ing-item.bought .ing-tx{text-decoration:line-through;color:var(--muted)}
.ing-item.have .ing-tx{color:var(--muted)}
.ing-item.have .have-tag{font-size:10px;font-weight:800;color:var(--herb);margin-left:7px;letter-spacing:.03em}
.ing-item.none{display:block;color:var(--muted);font-style:italic;cursor:default;padding:5px 4px}
/* chrome only where it applies: Despensa/Recetario don't have a week, and
   "Sorpréndeme" is a once-a-week action that was shouting on every screen */
body[data-view="despensa"] .wk,body[data-view="ideas"] .wk{display:none}
body:not([data-view="semana"]) .surprise{display:none}
.surprise{box-shadow:none;font-weight:700}
/* semana: expand/collapse all days */
.exp-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:0 2px 8px}
.exp-all{font-size:12px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:11px 13px;min-height:42px;font-family:inherit;cursor:pointer;white-space:nowrap}
.exp-all.on{color:var(--aub-2);background:var(--aub-soft);border-color:var(--aub-soft)}
.exp-all:active{background:var(--line2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:3px solid var(--aub-2);outline-offset:2px}
.ver-foot{text-align:center;font-size:11px;color:var(--muted);padding:10px 0 2px}
.about-b{font-size:13.5px;line-height:1.5;color:var(--ink)}
.about-b p{margin:0 0 10px}
.about-b b{font-weight:800}

/* shopping send-to-greengrocer action */
.shop-actions{display:flex;gap:8px;margin-top:4px}
.shop-actions .btn{flex:1}
.sec-foot{padding:6px 14px 14px}
.sec-foot .btn{width:100%}
.btn.wa-btn{background:#25D366;color:#fff;border-color:#25D366;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.wa-btn svg{width:17px;height:17px;fill:#fff}
.btn.wa-btn:active{background:#1da851}

/* meal composer (1º + 2º) */
.composer{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.cm-slot{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px}
.cm-slot.on{border-color:var(--aub);background:var(--aub-soft)}
.cm-k{font-weight:800;font-size:12px;color:var(--aub);background:var(--aub-soft);border-radius:7px;padding:3px 8px;flex:none}
.cm-slot.on .cm-k{background:var(--card)}
.cm-v{flex:1;font-size:14px;font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-v.ph{color:var(--muted);font-weight:500}
.cm-x{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line2);color:var(--muted);font-size:12px}

/* macros view */
.mc-note{font-size:12px;color:var(--muted);line-height:1.45;background:var(--aub-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.mc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.mc-top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.mc-name{font-size:16px;font-weight:800}
.mc-name .tag{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle}
.mc-sub{font-size:11.5px;color:var(--muted);margin-left:auto;font-weight:600}
.mc-kcal{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mc-kcal small{font-size:13px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.mc-week{font-size:12px;color:var(--muted);margin-top:2px}
.mc-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:12px 0 8px;background:var(--line2)}
.mc-bar i{display:block;height:100%}
.mc-macros{display:flex;gap:14px;font-size:12.5px;font-weight:600}
.mc-macros .mm{display:flex;flex-direction:column;gap:2px;flex:1}
.mc-macros .mm .hd{display:flex;align-items:center;gap:6px}
.mc-macros .mm .d{width:9px;height:9px;border-radius:2px}
.mc-macros .mm b{font-weight:800}
.mc-macros .mm .wksm{font-size:11px;font-weight:600;color:var(--muted);opacity:.85;padding-left:15px}
.mc-empty{font-size:13px;color:var(--muted)}
/* ---- plan del nutricionista ---- */
.pl-bs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pl-b{font-size:10.5px;font-weight:800;color:var(--herb);background:var(--herb-soft);padding:2px 7px;border-radius:20px;white-space:nowrap}
.pl-b.n{color:var(--aub-2);background:var(--aub-soft)}
.pl-meal{margin-top:7px;padding:7px 9px;border-radius:9px;background:var(--bg);font-size:12px;line-height:1.45}
.pl-sug{color:var(--muted);font-weight:700;margin-bottom:3px}
.pl-per{display:flex;flex-direction:column;gap:2px}
.pl-p{color:var(--ink)}
.pl-p b{font-weight:800}
.pl-carb{color:var(--amber);font-weight:700}
.pl-no{color:var(--muted)}
.pl-inc{color:var(--herb);font-weight:700}
.pl-note{color:var(--muted);font-weight:700}
.day-plan{font-size:14px}
.pv-hero{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:13px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:6px}
.pv-toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px;min-height:56px}
.pv-toggle.sm{box-shadow:none;background:var(--bg);margin:12px 0 0}
.pv-tg-t{flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px}
.pv-tg-t span{font-size:12px;color:var(--muted);font-weight:600}
.pv-sw{width:44px;height:26px;border-radius:20px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
.pv-sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.pv-toggle.on .pv-sw{background:var(--herb)}
.pv-toggle.on .pv-sw i{left:21px}
.pv-sec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.pv-sh{display:flex;align-items:center;gap:8px;width:100%;min-height:50px;padding:12px 14px;text-align:left;font-size:15px;font-weight:800}
.pv-sh span:first-child{flex:1}
.pv-body{padding:2px 14px 14px;font-size:13.5px;line-height:1.5}
.pv-chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.pv-chip{font-size:12px;font-weight:800;padding:6px 10px;border-radius:20px;white-space:nowrap}
.pv-chip.ok{color:var(--herb);background:var(--herb-soft)}
.pv-chip.warn{color:var(--amber);background:var(--amber-soft)}
.pv-empty{color:var(--muted);font-size:13px;padding:4px 0}
/* a 7-column grid, not flex: with flex:1 and min-width:auto, «mañana» widened its
   cell and the Sunday fell outside the card at 375 px (untappable) */
.pv-days,.pv-daybs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pv-dayb{min-width:0;padding:0;min-height:52px;border-radius:11px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink)}
.pv-dayb i{font-style:normal;font-size:13px}
.pv-dayb.hoy{box-shadow:inset 0 0 0 2px var(--aub)}
.pv-person{margin-top:10px}
.pv-row-l{font-size:13px;margin:8px 2px 6px}
.pv-row-l b{font-weight:800}
.pv-d{min-width:0;padding:0;min-height:48px;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted)}
.pv-d .dw{font-size:11px;font-weight:800;color:var(--ink)}
.pv-d .st{font-size:11px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-d.m{background:var(--herb-soft);color:var(--herb)}
.pv-d.t{background:var(--amber-soft);color:var(--amber)}
/* Small text on the tints read at 3.7–4.4:1 in the light themes (amber 3.7 on its
   tint and 4.0 on white, the herb green 4.3, the grey notes 4.4 on the page):
   darker inks there, all ≥ 5:1. Noche keeps its own colours (they pass). */
:root:not(.dark) .pv-d.t,:root:not(.dark) .btn.warn,:root:not(.dark) .pl-carb,:root:not(.dark) .pv-chip.warn{color:#9A4F1E}
:root:not(.dark) .pv-d.m,:root:not(.dark) .pv-chip.ok,:root:not(.dark) .pl-b:not(.n){color:#2A7050}
:root:not(.dark) .pv-nota{color:#58615C}
/* 320 px with the text at «enorme» (≈254 px of layout): the day header, the 7-day
   rows and the recipe book rows ran past the card edge */
@media (max-width:340px){
	.day-head{gap:6px;padding:12px 10px}
	.day-copy{padding:10px 7px}
	.pv-d .st{font-size:10px;letter-spacing:-.02em}
	.idea{gap:6px;padding:9px 10px}
	.idea .nm{min-width:0}
	.idea .ti{max-width:34%;overflow:hidden;text-overflow:ellipsis}
}
.pv-d.n.on{background:var(--aub-soft);color:var(--aub-2)}
.pv-tipo{margin-top:8px}
.pv-tipo-h{font-weight:800;margin-bottom:4px}
.pv-ul{margin:0;padding-left:18px}
.pv-ul li{margin-bottom:4px}
.pv-wd{border-top:1px solid var(--line2);padding:8px 0}
.pv-wd:first-of-type{border-top:0}
.pv-wd-h{font-weight:800;text-transform:capitalize;margin-bottom:4px}
.pv-wm,.pv-li{display:flex;gap:10px;margin-bottom:6px}
.pv-wm .k,.pv-li .k{width:84px;flex-shrink:0;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--aub-2);padding-top:2px}
.pv-wm .v,.pv-li .v{flex:1;min-width:0}
.pv-nota{font-size:12px;color:var(--muted);margin-top:2px}
.pv-rac{font-size:12.5px;margin-top:2px}
.pv-ens{line-height:1.9}
.pv-dia{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
.pv-dia-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:16px}
.pv-dia-h span{font-size:12px;font-weight:700;color:var(--muted)}
.pv-dia-h span.on{color:var(--herb)}
.muted{color:var(--muted)}
.need-h.static{cursor:default}
.need-h.static:active{background:none}
</style>
</head>

/* ---- built-in recipe book: name(lower) -> texto (ingredientes + pasos).
   Reference data like SEED; user-written recipes in state.userDishes win
